<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MixExpo v1 · Chemical mixture exposure calculator (French TDS2) · G. Cano-Sancho</title>
<meta name="author" content="German Cano-Sancho">
<meta name="description" content="MixExpo v1 (25.11.2026) – pedagogical chemical mixture exposure calculator based on French TDS2 data. Author: German Cano-Sancho. For teaching purposes only.">
<style>
:root{
  color-scheme: light;
  --bg:#f6f5f1; --surface-1:#ffffff; --surface-2:#f1f0eb; --line:#e3e1da; --line-strong:#cfccc2;
  --text-primary:#1d1d1b; --text-secondary:#5f5e58; --text-muted:#8a887f;
  --accent:#1b64be; --accent-soft:#e6f0fc;
  --series-1:#257de0; --series-2:#f47230; --series-3:#00b894; --series-4:#f2a600;
  --good:#0aac23; --good-ink:#006c10; --warning:#fbb315; --warning-ink:#8a5a00; --critical:#dc3c3d; --critical-ink:#b0282a;
  --seq-0:#f3f7fc; --seq-1:#cce3fd; --seq-2:#9dc8f7; --seq-3:#6aabf1; --seq-4:#338ced; --seq-5:#2370cd; --seq-6:#1757ac; --seq-7:#0e3d7e;
  --grid:#ecebe6; --radius:10px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121212; --surface-1:#1b1b1b; --surface-2:#232323; --line:#2e2e2e; --line-strong:#3c3c3c;
    --text-primary:#efefef; --text-secondary:#a9a9a9; --text-muted:#7d7d7d;
    --accent:#519ced; --accent-soft:#1a2a3d;
    --series-1:#338ced; --series-2:#e76624; --series-3:#00a888; --series-4:#d28e05;
    --good-ink:#3fcf55; --warning-ink:#fbb315; --critical-ink:#f07071;
    --seq-0:#1d232b; --seq-1:#0e3d7e; --seq-2:#0f4a96; --seq-3:#1757ac; --seq-4:#2370cd; --seq-5:#338ced; --seq-6:#6aabf1; --seq-7:#b6d5f8;
    --grid:#2a2a2a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface-1);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;gap:18px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand b{font-size:18px;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--text-secondary)}
.brand .ver{font-size:11.5px;font-weight:600;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.brand .byline{font-size:12px;color:var(--text-muted)}
.ctrl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)}
.ctrl input[type=number]{width:72px}
input[type=number],input[type=text],select{background:var(--surface-1);border:1px solid var(--line-strong);border-radius:7px;padding:5px 8px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--text-primary);color:var(--surface-1)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 14px 11px;cursor:pointer;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-2);font-size:11.5px;margin-right:6px;color:var(--text-secondary)}
nav.tabs button[aria-selected=true]{color:var(--text-primary);border-bottom-color:var(--text-primary);font-weight:600}
nav.tabs button[aria-selected=true] .n{background:var(--text-primary);color:var(--surface-1)}
main{padding:22px 0 60px}
section.view{display:none}
section.view.on{display:block}
h2{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:15.5px;margin:0 0 10px}
p.lead{margin:0 0 18px;color:var(--text-secondary);max-width:80ch}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.grid-diet{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:18px;align-items:start}
.side{position:sticky;top:120px}
@media (max-width:980px){.grid-diet{grid-template-columns:1fr}.side{position:static}}
@media (max-width:700px){header.top{position:static}.top-row{gap:10px}.item{grid-template-columns:1fr 14px 1fr 28px}.item .nm{grid-column:1/-1}.kpi .v{font-size:20px}}
.stack{display:flex;flex-direction:column;gap:14px}
.meal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.meal-head h3{margin:0;display:flex;align-items:center;gap:8px}
.meal-head .tot{font-size:12.5px;color:var(--text-muted)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) 78px 18px 74px 28px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{min-width:0}
.item .nm b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm small{color:var(--text-muted);font-size:12px}
.item input{width:100%;padding:4px 6px;text-align:right}
.item .x{border:0;background:none;cursor:pointer;color:var(--text-muted);font-size:18px;line-height:1;border-radius:6px;padding:3px}
.item .x:hover{background:var(--surface-2);color:var(--critical-ink)}
.unitlbl{font-size:11px;color:var(--text-muted);text-align:center}
.empty{color:var(--text-muted);font-size:13px;padding:6px 0}
.adder{position:relative;margin-top:8px}
.adder input{width:100%;padding:7px 10px;border-style:dashed}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface-1);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.14);max-height:340px;overflow:auto;z-index:30;display:none}
.dd.open{display:block}
.dd .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:8px 10px 3px;background:var(--surface-2);position:sticky;top:0}
.dd .opt{padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.dd .opt small{color:var(--text-muted);white-space:nowrap}
.dd .opt.act,.dd .opt:hover{background:var(--accent-soft)}
.cov{display:inline-flex;gap:1px;vertical-align:middle;margin-left:4px}
.cov i{width:4px;height:9px;border-radius:1px;background:var(--line-strong)}
.cov i.y{background:var(--text-secondary)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{border:1px solid var(--line-strong);background:var(--surface-1);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
.btn.small{padding:3px 9px;font-size:12.5px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--text-secondary)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:550;white-space:nowrap}
.status .dot{width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.st-ok{color:var(--good-ink)} .st-ok .dot{background:var(--good)}
.st-unc{color:var(--warning-ink)} .st-unc .dot{background:var(--warning);color:#3a2700}
.st-hi{color:var(--critical-ink)} .st-hi .dot{background:var(--critical)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--text-secondary);font-size:12px;border-bottom:1px solid var(--line-strong);padding:7px 8px;vertical-align:bottom}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.fam td{background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:4px 8px}
.muted{color:var(--text-muted)} .sec{color:var(--text-secondary)}
.small{font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--text-secondary);font-size:11.5px}
.chart .lbl{fill:var(--text-primary);font-size:12.5px}
.chart .ax{stroke:var(--line-strong)}
.chart .gl{stroke:var(--grid)}
.chart .thr{stroke:var(--text-primary);stroke-dasharray:4 3;stroke-width:1.5}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:var(--text-primary);fill-opacity:.04}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--text-secondary);margin:4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
#tip{position:fixed;pointer-events:none;background:var(--text-primary);color:var(--surface-1);font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:7px;max-width:300px;z-index:100;opacity:0;transition:opacity .08s}
#tip b{font-weight:650}
.heat{overflow:auto}
.heat table{border-collapse:separate;border-spacing:2px;font-size:12px}
.heat th{font-weight:550;color:var(--text-secondary);padding:2px 4px;white-space:nowrap}
.heat th.sub{writing-mode:vertical-rl;transform:rotate(180deg);height:118px;vertical-align:bottom;text-align:left;cursor:pointer}
.heat th.sub.sel{color:var(--text-primary);text-decoration:underline}
.heat th.fd{text-align:right;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.heat td{width:44px;min-width:44px;height:26px;text-align:center;border-radius:4px;font-variant-numeric:tabular-nums;cursor:default}
.heat td.na{background:repeating-linear-gradient(135deg,var(--surface-2) 0 3px,var(--surface-1) 3px 6px);color:var(--text-muted)}
.scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);margin-top:8px}
.scale .bar{display:flex;height:10px;border-radius:3px;overflow:hidden}
.scale .bar i{width:26px}
.note{background:var(--surface-2);border-left:3px solid var(--line-strong);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13.5px;color:var(--text-secondary);margin:12px 0}
.note.warn{border-left-color:var(--warning)}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:20px;background:var(--surface-2);color:var(--text-secondary);white-space:nowrap}
.mix-row{display:grid;grid-template-columns:210px minmax(0,1fr) 120px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mix-row:first-of-type{border-top:0}
.mix-row .gname b{display:block;font-weight:600}
.mix-row .gname small{color:var(--text-muted)}
@media (max-width:760px){.mix-row{grid-template-columns:1fr}}
.scen-list{display:flex;flex-direction:column;gap:6px}
.scen{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.scen i{width:12px;height:12px;border-radius:3px;flex:none}
.scen input{flex:1;min-width:0;border:0;background:transparent;padding:2px 0;font-weight:550}
.scen small{color:var(--text-muted);white-space:nowrap}
details.method{border-top:1px solid var(--line);padding:10px 0}
details.method summary{cursor:pointer;font-weight:600}
details.method[open] summary{margin-bottom:8px}
.rpin{width:110px!important;text-align:right}
footer{color:var(--text-muted);font-size:12px;padding:24px 0;border-top:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media print{
  header.top{position:static} nav.tabs,.toolbar,.adder,.item .x,#tip{display:none!important}
  section.view{display:block!important;page-break-after:always} body{background:#fff}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><b>MixExpo <span class="ver">v1 · 25.11.2026</span></b><span data-i18n="subtitle"></span><span class="byline">German Cano-Sancho · <span data-i18n="peda_only"></span></span></div>
      <label class="ctrl"><span data-i18n="bw"></span> <input id="bw" type="number" min="10" max="200" step="1" value="70"> kg</label>
      <div class="ctrl"><span data-i18n="bound"></span>
        <div class="seg" id="boundSeg" role="group">
          <button data-b="lb">LB</button><button data-b="mb">MB</button><button data-b="ub">UB</button>
        </div>
      </div>
      <div class="ctrl">
        <div class="seg" id="langSeg" role="group" aria-label="Language">
          <button data-l="es">ES</button><button data-l="fr">FR</button><button data-l="en">EN</button>
        </div>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-v="diet"><span class="n">1</span><span data-i18n="tab_diet"></span></button>
      <button role="tab" data-v="expo"><span class="n">2</span><span data-i18n="tab_expo"></span></button>
      <button role="tab" data-v="contrib"><span class="n">3</span><span data-i18n="tab_contrib"></span></button>
      <button role="tab" data-v="risk"><span class="n">4</span><span data-i18n="tab_risk"></span></button>
      <button role="tab" data-v="compare"><span class="n">5</span><span data-i18n="tab_compare"></span></button>
      <button role="tab" data-v="methods"><span class="n">i</span><span data-i18n="tab_methods"></span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- 1 DIET -->
  <section class="view" id="v-diet">
    <h2 data-i18n="diet_h"></h2>
    <p class="lead" data-i18n="diet_lead"></p>
    <div class="toolbar">
      <select id="preset"></select>
      <button class="btn" id="btnClear" data-i18n="clear"></button>
      <span style="flex:1"></span>
      <label class="chk"><input type="checkbox" id="allFoods"> <span data-i18n="all_foods"></span></label>
    </div>
    <div class="grid-diet">
      <div class="stack" id="meals"></div>
      <div class="stack side">
        <div class="card">
          <h3 data-i18n="live_h"></h3>
          <div class="kpis">
            <div class="kpi"><div class="v" id="kGrams">0</div><div class="l" data-i18n="k_grams"></div></div>
            <div class="kpi"><div class="v" id="kExceed">0</div><div class="l" data-i18n="k_exceed"></div></div>
            <div class="kpi"><div class="v" id="kHI">0</div><div class="l" data-i18n="k_hi"></div></div>
            <div class="kpi"><div class="v" id="kMOET">–</div><div class="l" data-i18n-html="k_moet"></div></div>
          </div>
          <div class="chart" id="liveChart"></div>
          <p class="small muted" style="margin:8px 0 0" data-i18n-html="live_note"></p>
        </div>
        <div class="card small sec" data-i18n-html="portion_help"></div>
      </div>
    </div>
  </section>

  <!-- 2 EXPOSURE -->
  <section class="view" id="v-expo">
    <h2 data-i18n="expo_h"></h2>
    <p class="lead" data-i18n-html="expo_lead"></p>
    <div class="card" style="margin-bottom:18px">
      <div class="toolbar" style="margin-bottom:4px"><h3 style="margin:0;flex:1" data-i18n="rq_chart_h"></h3>
        <span class="ctrl"><span data-i18n="sort_lbl"></span><span class="seg" id="sortSeg"><button data-s="fam" data-i18n="sort_fam"></button><button data-s="expo" data-i18n="sort_expo"></button><button data-s="rq" data-i18n="sort_rq"></button></span></span></div>
      <div class="legend" id="rqLegend"></div>
      <div class="chart" id="rqChart"></div>
      <div class="note" id="rankNote"></div>
    </div>
    <div class="card">
      <div class="toolbar" style="margin-bottom:6px"><h3 style="margin:0;flex:1" data-i18n="expo_table_h"></h3><button class="btn small" id="btnCSV" data-i18n="export_csv"></button></div>
      <div style="overflow:auto"><table class="t" id="expoTable"></table></div>
      <div class="note" data-i18n-html="censor_note"></div>
    </div>
  </section>

  <!-- 3 CONTRIBUTIONS -->
  <section class="view" id="v-contrib">
    <h2 data-i18n="contrib_h"></h2>
    <p class="lead" data-i18n="contrib_lead"></p>
    <div class="two">
      <div class="card">
        <h3 data-i18n="heat_h"></h3>
        <div class="heat" id="heat"></div>
        <div class="scale" id="heatScale"></div>
      </div>
      <div class="card">
        <h3 id="detailH"></h3>
        <select id="subSel" style="margin-bottom:10px"></select>
        <div class="chart" id="contribChart"></div>
        <div class="note" id="contribNote"></div>
      </div>
    </div>
  </section>

  <!-- 4 RISK & MIXTURES -->
  <section class="view" id="v-risk">
    <h2 data-i18n="risk_h"></h2>
    <p class="lead" data-i18n-html="risk_lead"></p>
    <div class="two" style="margin-bottom:18px">
      <div class="card">
        <h3 data-i18n="tier0_h"></h3>
        <div class="kpis" style="grid-template-columns:1fr 1fr">
          <div class="kpi"><div class="v" id="hiAll">–</div><div class="l" data-i18n="hi_all"></div></div>
          <div class="kpi"><div class="v" id="moetCarc">–</div><div class="l" data-i18n-html="moet_carc"></div></div>
        </div>
        <p class="small sec" data-i18n-html="tier0_text"></p>
      </div>
      <div class="card">
        <h3 data-i18n="drivers_h"></h3>
        <div class="chart" id="driversChart"></div>
        <p class="small muted" data-i18n="drivers_note"></p>
      </div>
    </div>
    <div class="card">
      <h3 data-i18n="groups_h"></h3>
      <p class="small sec" style="margin-top:-4px" data-i18n="groups_lead"></p>
      <div id="mixRows"></div>
      <div class="note warn" data-i18n-html="mix_caveat"></div>
    </div>
  </section>

  <!-- 5 COMPARE -->
  <section class="view" id="v-compare">
    <h2 data-i18n="cmp_h"></h2>
    <p class="lead" data-i18n="cmp_lead"></p>
    <div class="grid-diet">
      <div class="card">
        <h3 data-i18n="cmp_chart_h"></h3>
        <div class="legend" id="cmpLegend"></div>
        <div class="chart" id="cmpChart"></div>
        <div style="overflow:auto;margin-top:14px"><table class="t" id="cmpTable"></table></div>
      </div>
      <div class="stack">
        <div class="card">
          <h3 data-i18n="scen_h"></h3>
          <div class="toolbar"><button class="btn primary" id="btnSave" data-i18n="save_scen"></button></div>
          <div class="scen-list" id="scenList"></div>
          <p class="small muted" data-i18n="scen_note"></p>
        </div>
        <div class="card">
          <h3 data-i18n="io_h"></h3>
          <div class="toolbar" style="margin:0">
            <button class="btn" id="btnExport" data-i18n="export_json"></button>
            <label class="btn"><span data-i18n="import_json"></span><input type="file" id="fileIn" accept=".json,application/json" hidden></label>
            <button class="btn" id="btnPrint" data-i18n="print"></button>
          </div>
          <p class="small sec" id="ioMsg" role="status" style="margin:8px 0 0"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 6 METHODS -->
  <section class="view" id="v-methods">
    <h2 data-i18n="m_h"></h2>
    <p class="lead" data-i18n-html="m_lead"></p>
    <div class="card" style="margin-bottom:18px">
      <div class="toolbar" style="margin-bottom:6px"><h3 style="margin:0;flex:1" data-i18n="ref_h"></h3><button class="btn small" id="btnResetRP" data-i18n="reset_rp"></button></div>
      <div style="overflow:auto"><table class="t" id="refTable"></table></div>
    </div>
    <div class="card">
      <details class="method" open><summary data-i18n="m1_s"></summary><div data-i18n-html="m1"></div></details>
      <details class="method"><summary data-i18n="m2_s"></summary><div data-i18n-html="m2"></div></details>

 m1_s:"1. Cálculo de la exposición",
 m1:"<p>Para cada sustancia <i>s</i>: <code>E<sub>s</sub> = Σ<sub>f</sub> (consumo<sub>f</sub> [g/día] × C<sub>f,s</sub> [ng/g]) / peso [kg]</code>. C<sub>f,s</sub> es la media de todas las muestras regionales/nacionales de EAT2 para ese alimento. Las sumas de congéneres (HAP4, PFAS4, PBDE, EQT) se calculan muestra a muestra antes de promediar.</p>",
 m2_s:"2. Datos censurados (LB / MB / UB)",
 m2:"<p>«ND (x)», «&lt; x» → no detectado (x = LOD): LB = 0, MB = LOD/2, UB = LOD. «NQ (x)» → detectado no cuantificado (x = LOQ): LB = 0, MB = LOQ/2, UB = LOQ. Cuando no se indica el límite se usa el de la hoja «Limites analytiques» (acrilamida LOD 4 / LOQ 10 µg/kg; DON 3/10 µg/kg en sólidos y 0,3/1 en líquidos). «NR» o celda vacía = no analizado (se excluye, no se pone a 0).</p>",
 m3_s:"3. Sustancias y agregación",
 m3:"<ul><li><b>Cd, Hg, Pb</b>: valores de elementos traza de EAT2 incluidos en la calculadora original (45 alimentos, µg/kg). Celdas vacías interpretadas como &lt; LOD (Cd 0,5; Hg 5; Pb 2,5 µg/kg). El Hg total se compara con la TWI del metilmercurio (conservador fuera del pescado).</li><li><b>HAP4</b> = BaP + BaA + BbF + CHR. <b>PFAS4</b> = PFOS + PFOA + PFNA + PFHxS (grupo EFSA 2020). <b>PBDE</b> = Σ BDE-28, 47, 99, 100, 153, 154, 183.</li><li><b>Dioxinas + PCB-DL</b>: 17 PCDD/F + 12 PCB-DL ponderados por TEF OMS-2005 → pg EQT-OMS/g.</li><li><b>Plaguicidas</b>: clorpirifós-etilo, carbendazima, dimetoato (mg/kg × 1000).</li><li><b>DON</b> (deoxinivalenol), <b>acrilamida</b>.</li><li><b>Bisfenol A</b>: campaña ANSES/LABERCA sobre las muestras EAT2 + aguas embotelladas (LHN), µg/kg; «&lt;LOD»/«&lt;LOQ» con su límite. Muestras de 2007–2009, anteriores a la prohibición francesa del BPA en envases alimentarios (2015). ANSES (2013) atribuyó cerca de la mitad de la exposición alimentaria a las conservas; la contaminación de carnes se produce tras el sacrificio.</li></ul>",
 m4_s:"4. Caracterización del riesgo y mezclas",
 m4:"<p>Sustancias con valor basado en salud (TDI/TWI/ADI): RQ = E / VBS; se muestra el % del VBS. Sustancias evaluadas con margen de exposición: MOE = BMDL / E; preocupación si MOE &lt; umbral (10 000 para carcinógenos genotóxicos, 10 para Pb, 25 para PBDE según EFSA 2024). Para combinarlas se usa RQ = umbral / MOE. HI = Σ RQ de las sustancias con umbral (nivel 0, guía MixTox de EFSA 2019); los carcinógenos genotóxicos no se suman al HI sino que se combinan con MOE<sub>T</sub> = 1/Σ(1/MOE<sub>i</sub>). Los grupos de nivel 1 son una simplificación pedagógica de los grupos de evaluación acumulativa.</p><p><b>Limitaciones:</b> 1 día ≠ exposición habitual; datos de 2007–2009; no todas las sustancias se analizaron en todos los alimentos; solo exposición alimentaria (sin agua de bebida para la mayoría de sustancias, aire, polvo…).</p>",
 m5_s:"5. Cobertura analítica del catálogo",
 m5:"<p>Número de alimentos del catálogo EAT2 de esta herramienta con datos para cada sustancia.</p>",

 m1_s:"1. Exposure calculation",
 m1:"<p>For each substance <i>s</i>: <code>E<sub>s</sub> = Σ<sub>f</sub> (intake<sub>f</sub> [g/day] × C<sub>f,s</sub> [ng/g]) / body weight [kg]</code>. C<sub>f,s</sub> is the mean of all regional/national TDS2 samples of that food. Congener sums (PAH4, PFAS4, PBDE, TEQ) are computed sample by sample before averaging.</p>",
 m2_s:"2. Left-censored data (LB / MB / UB)",
 m2:"<p>“ND (x)”, “&lt; x” → not detected (x = LOD): LB = 0, MB = LOD/2, UB = LOD. “NQ (x)” → detected, not quantified (x = LOQ): LB = 0, MB = LOQ/2, UB = LOQ. When no limit is given, the “Limites analytiques” sheet is used (acrylamide LOD 4 / LOQ 10 µg/kg; DON 3/10 µg/kg in solids, 0.3/1 in liquids). “NR” or empty = not analysed (excluded, not set to 0).</p>",
 m3_s:"3. Substances and aggregation",
 m3:"<ul><li><b>Cd, Hg, Pb</b>: TDS2 trace-element values included in the original spreadsheet calculator (45 foods, µg/kg). Empty cells taken as &lt; LOD (Cd 0.5; Hg 5; Pb 2.5 µg/kg). Total Hg is compared with the methylmercury TWI (conservative outside fish).</li><li><b>PAH4</b> = BaP + BaA + BbF + CHR. <b>PFAS4</b> = PFOS + PFOA + PFNA + PFHxS (EFSA 2020 group). <b>PBDE</b> = Σ BDE-28, 47, 99, 100, 153, 154, 183.</li><li><b>Dioxins + dl-PCBs</b>: 17 PCDD/Fs + 12 dl-PCBs weighted by WHO-2005 TEFs → pg WHO-TEQ/g.</li><li><b>Pesticides</b>: chlorpyrifos-ethyl, carbendazim, dimethoate (mg/kg × 1000).</li><li><b>DON</b> (deoxynivalenol), <b>acrylamide</b>.</li><li><b>Bisphenol A</b>: ANSES/LABERCA campaign on the TDS2 samples + bottled waters (LHN), µg/kg; “&lt;LOD”/“&lt;LOQ” with their limit. Samples from 2007–2009, before the French ban of BPA in food packaging (2015). ANSES (2013) attributed about half of dietary exposure to canned foods; contamination of meat occurs after slaughter.</li></ul>",
 m4_s:"4. Risk characterisation and mixtures",
 m4:"<p>Substances with a health-based guidance value (TDI/TWI/ADI): RQ = E / HBGV; shown as % of HBGV. Substances assessed by margin of exposure: MOE = BMDL / E; concern if MOE &lt; threshold (10,000 for genotoxic carcinogens, 10 for Pb, 25 for PBDEs per EFSA 2024). To combine them, RQ = threshold / MOE. HI = Σ RQ of threshold substances (tier 0, EFSA 2019 MixTox guidance); genotoxic carcinogens are not added to the HI but combined as MOE<sub>T</sub> = 1/Σ(1/MOE<sub>i</sub>). Tier-1 groups are a teaching simplification of cumulative assessment groups.</p><p><b>Limitations:</b> 1 day ≠ usual exposure; data from 2007–2009; not every substance was analysed in every food; diet only (no drinking water for most substances, air, dust…).</p>",
 m5_s:"5. Analytical coverage of the catalogue",
 m5:"<p>Number of foods in this tool’s TDS2 catalogue with data for each substance.</p>",

/* ---------------------------------------------------------------- state */
const byFr = {}; FOODS.forEach(f => byFr[f.fr] = f);
const byId = {}; FOODS.forEach(f => byId[f.id] = f);
const LS = "mixexpo.v2";
const packM = m => { const o={}; MEALS.forEach(k=>o[k]=(m[k]||[]).map(it=>({fr:byId[it.id].fr, g:+it.g}))); return o; };
const unpackM = m => { const o={}; MEALS.forEach(k=>o[k]=[]); MEALS.forEach(k=>((m&&m[k])||[]).forEach(it=>{ const f=byFr[it.fr||it.food]; if(f) o[k].push({id:f.id, g:+it.g||0}); })); return o; };
function store(){ try{ localStorage.setItem(LS, JSON.stringify({lang:S.lang,bw:S.bw,bound:S.bound,meals:packM(S.meals),scen:S.scen.map(x=>({name:x.name,bw:x.bw,meals:packM(x.meals)})),rp:S.rp,all:S.all,sort:S.sort})); }catch(e){} }
function emptyMeals(){ const m={}; MEALS.forEach(k=>m[k]=[]); return m; }
let S = {lang:"es", bw:70, bound:"lb", meals:emptyMeals(), scen:[], rp:{}, all:false, view:"diet", sel:"Cd", sort:"fam"};
try{ const s = JSON.parse(localStorage.getItem(LS)||"null"); if(s){ Object.assign(S, s); S.meals = unpackM(s.meals); S.scen = (s.scen||[]).map(x=>({name:x.name,bw:x.bw,meals:unpackM(x.meals)})); } }catch(e){ S.meals = emptyMeals(); S.scen = []; }
if(!S.meals || !Object.values(S.meals).some(a=>a.length)) { if(!localStorage.getItem || true) {} }

function subs(){ return SUBS_DEFAULT.map(s => Object.assign({}, s, S.rp[s.k]||{})); }
const t = k => (I18N[S.lang][k] ?? I18N.en[k] ?? k);
const fname = f => f[S.lang] || f.fr;
const sname = k => SUBTXT[k].n[S.lang];
const shname = k => SUBTXT[k].sh ? SUBTXT[k].sh[S.lang] : SUBTXT[k].n[S.lang];
const unitOf = s => (s.u==="pg" ? "pg TEQ/kg bw/d" : "ng/kg bw/d").replace("bw", S.lang==="en"?"bw":"pc").replace("/d", S.lang==="en"?"/day":(S.lang==="es"?"/día":"/j"));

/* ---------------------------------------------------------------- core computation */
function compute(meals, bw){
  const SU = subs();
  const intake = {};           // food id -> grams
  MEALS.forEach(m => (meals[m]||[]).forEach(it => { if(it.g>0) intake[it.id] = (intake[it.id]||0) + it.g; }));
  const foods = Object.keys(intake).map(Number);
  const res = {intake, foods, grams: foods.reduce((a,id)=>a+intake[id],0), S:{}};
  SU.forEach(s => {
    const E = {lb:0, mb:0, ub:0}, contrib = {}, missing = [];
    foods.forEach(id => {
      const c = byId[id].c[s.k];
      if(!c){ missing.push(id); return; }
      const g = intake[id];
      E.lb += g*c[0]/bw; E.mb += g*c[1]/bw; E.ub += g*c[2]/bw;
      contrib[id] = {lb:g*c[0]/bw, mb:g*c[1]/bw, ub:g*c[2]/bw};
    });
    const rq = b => s.type==="HBGV" ? E[b]/s.rp : E[b]*s.thr/s.rp;
    const RQ = {lb:rq("lb"), mb:rq("mb"), ub:rq("ub")};
    const status = RQ.ub < 1 ? "ok" : (RQ.lb >= 1 ? "hi" : "unc");
    res.S[s.k] = {s, E, RQ, contrib, missing, status};
  });
  return res;
}
// Tier-0 hazard index: threshold substances only (genotoxic carcinogens are combined with MOET instead)
function hi(res, b, keys){ return (keys||Object.keys(res.S).filter(k=>res.S[k].s.grp!=="carc")).reduce((a,k)=>a+res.S[k].RQ[b],0); }
function moet(res, b){ const inv = Object.values(res.S).filter(r=>r.s.grp==="carc").reduce((a,r)=>a + r.E[b]/r.s.rp, 0); return inv>0 ? 1/inv : Infinity; }
function moetStatus(res){ const thr = 10000; return moet(res,"ub")>=thr ? "ok" : (moet(res,"lb")<thr ? "hi" : "unc"); }
function hiStatus(res, keys){ return hi(res,"ub",keys)<1 ? "ok" : (hi(res,"lb",keys)>=1 ? "hi" : "unc"); }
function cw(el, fallback){ const w = el.clientWidth; return w>200 ? Math.round(w) : fallback; }

/* ---------------------------------------------------------------- formatting */
function fmt(x, d){
  if(!isFinite(x)) return "∞";
  if(x===0) return "0";
  const loc = S.lang==="en" ? "en-GB" : (S.lang==="fr"?"fr-FR":"es-ES");
  const a = Math.abs(x);
  let opts;
  if(d!==undefined) opts={maximumFractionDigits:d, minimumFractionDigits:0};
  else if(a>=1000) opts={maximumFractionDigits:0};
  else if(a>=10) opts={maximumFractionDigits:1};
  else if(a>=0.01) opts={maximumSignificantDigits:3};
  else opts={maximumSignificantDigits:2};
  return x.toLocaleString(loc, opts);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function statusHTML(st){ const ic={ok:"✓",unc:"?",hi:"!"}[st]; return `<span class="status st-${st}"><span class="dot">${ic}</span>${t("st_"+st)}</span>`; }
function metricText(r){
  const s=r.s, b=S.bound;
  if(s.type==="HBGV") return fmt(r.RQ[b]*100) + " %";
  const moe = s.rp / r.E[b];
  return "MOE " + (isFinite(moe) ? fmt(moe) : "–");
}
function refText(s){
  if(s.type==="HBGV") return `${fmt(s.rp)} ${unitOf(s)}`;
  return `BMDL ${fmt(s.rp)} ${unitOf(s)} · MOE ≥ ${fmt(s.thr)}`;
}

/* ---------------------------------------------------------------- tooltip */
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]");
  if(!el){ tip.style.opacity=0; return; }
  tip.innerHTML = el.getAttribute("data-tip");
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if(x + w > innerWidth - 8) x = e.clientX - w - 14;
  if(y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x+"px"; tip.style.top = y+"px"; tip.style.opacity = 1;
});

/* ---------------------------------------------------------------- charts (hand-made SVG, no dependencies) */
const LOGMIN = -3, LOGMAX = 3;   // RQ axis 0.001 … 100
function lx(v, x0, w){ const l = Math.log10(Math.max(v, Math.pow(10,LOGMIN))); return x0 + (Math.min(l,LOGMAX)-LOGMIN)/(LOGMAX-LOGMIN)*w; }
function logAxis(x0, w, y0, y1, compact){
  let g = "";
  for(let p=LOGMIN; p<=LOGMAX; p++){
    const x = lx(Math.pow(10,p), x0, w);
    g += `<line class="gl" x1="${x}" x2="${x}" y1="${y0}" y2="${y1}"/>`;
    const lab = p<0 ? (compact? "10"+superscript(p) : fmt(Math.pow(10,p))) : fmt(Math.pow(10,p));
    g += `<text x="${x}" y="${y1+14}" text-anchor="middle">${lab}</text>`;
  }
  const xt = lx(1, x0, w);
  g += `<line class="thr" x1="${xt}" x2="${xt}" y1="${y0-4}" y2="${y1}"/>`;
  return g;
}
function superscript(n){ const m={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"}; return String(n).split("").map(c=>m[c]).join(""); }
const STC = {ok:"var(--good)", unc:"var(--warning)", hi:"var(--critical)"};

function expoNg(r, b){ return r.E[b] * (r.s.u==="pg" ? 0.001 : 1); }   // dioxin TEQ pg -> ng for a common axis
function sortedSubs(res, mode){
  const SU = subs(), b = S.bound;
  if(mode==="expo") return SU.slice().sort((x,y)=>expoNg(res.S[y.k],b)-expoNg(res.S[x.k],b));
  if(mode==="rq")   return SU.slice().sort((x,y)=>res.S[y.k].RQ[b]-res.S[x.k].RQ[b]);
  return SU;
}
function lpos(v, lo, hi, x0, w){ const l = Math.log10(Math.max(v, Math.pow(10,lo))); return x0 + (Math.min(l,hi)-lo)/(hi-lo)*w; }
function decAxis(lo, hi, x0, w, y0, y1, compact){
  const step = (compact || (hi-lo) > 6) ? 2 : 1; let g = "";
  for(let p=Math.ceil(lo/step)*step; p<=hi; p+=step){
    const x = lpos(Math.pow(10,p), lo, hi, x0, w);
    const lab = p===0 ? "1" : ((compact || p<-2 || p>3) ? "10"+superscript(p) : fmt(Math.pow(10,p)));
    g += `<line class="gl" x1="${x}" x2="${x}" y1="${y0}" y2="${y1}"/><text x="${x}" y="${y1+14}" text-anchor="middle">${lab}</text>`;
  }
  return g;
}
function whisker(x1, x2, cy){
  if(x2-x1 <= 1) return "";
  const st = `stroke="var(--text-primary)" stroke-width="1.2" pointer-events="none"`;
  return `<line x1="${x1}" x2="${x2}" y1="${cy}" y2="${cy}" ${st}/><line x1="${x1}" x2="${x1}" y1="${cy-4}" y2="${cy+4}" ${st}/><line x1="${x2}" x2="${x2}" y1="${cy-4}" y2="${cy+4}" ${st}/>`;
}
/* Two aligned panels sharing the substance labels: left = how much (exposure), right = how risky (RQ). */
function dualChart(el, res, opts={}){
  const b = S.bound, SU = sortedSubs(res, opts.sort||"fam"), compact = !!opts.compact;
  const W = cw(el, opts.w || 760), lab = opts.labW || 180, gap = compact ? 16 : 34, padR = 12;
  const rowH = opts.rowH || 26, top = compact ? 34 : 40, n = SU.length, H = top + n*rowH + 22;
  const colW = (W - lab - gap - padR) / 2, xa = lab, xb = lab + colW + gap;
  // exposure axis: decades covering LB..UB of all substances
  const vals = SU.flatMap(s => ["lb","ub",b].map(k => expoNg(res.S[s.k], k))).filter(v => v > 0);
  let lo = vals.length ? Math.floor(Math.log10(Math.min(...vals))) : -3, hi = vals.length ? Math.ceil(Math.log10(Math.max(...vals))) : 3;
  lo = Math.max(lo, -7); if(hi - lo < 4) lo = hi - 4;
  const rlo = LOGMIN, rhi = LOGMAX;
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("dual_expo")+" / "+t("dual_rq"))}">`;
  g += `<text class="lbl" x="${xa}" y="14" style="font-weight:600">${esc(t(compact?"dual_expo_s":"dual_expo"))}</text>`;
  g += `<text class="lbl" x="${xb}" y="14" style="font-weight:600">${esc(t(compact?"dual_rq_s":"dual_rq"))}</text>`;
  if(!compact) g += `<text x="${xa}" y="29">${esc(t("dual_expo_sub"))}</text><text x="${xb}" y="29">${esc(t("dual_rq_sub"))}</text>`;
  g += decAxis(lo, hi, xa, colW, top, top + n*rowH, compact) + decAxis(rlo, rhi, xb, colW, top, top + n*rowH, compact);
  const x1 = lpos(1, rlo, rhi, xb, colW);
  g += `<line class="thr" x1="${x1}" x2="${x1}" y1="${top-4}" y2="${top + n*rowH}"/>`;
  SU.forEach((s, i) => {
    const r = res.S[s.k], y = top + i*rowH, cy = y + rowH/2, bh = Math.min(12, rowH - 9);
    const e = expoNg(r, b), q = r.RQ[b];
    const tipTxt = `<b>${esc(sname(s.k))}</b><br>${t("tip_expo")} (${b.toUpperCase()}): ${fmt(r.E[b])} ${unitOf(s)}<br>LB–UB: ${fmt(r.E.lb)} – ${fmt(r.E.ub)}<br>${t("tip_rq")}: ${fmt(q)} · ${metricText(r)}<br>${t("st_"+r.status)}`;
    g += `<rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}" data-tip="${esc(tipTxt)}"/>`;
    g += `<text class="lbl" x="${lab-10}" y="${cy+4}" text-anchor="end" pointer-events="none">${esc(compact ? trunc(shname(s.k),18) : sname(s.k))}</text>`;
    const xa0 = lpos(Math.pow(10,lo), lo, hi, xa, colW), xe = lpos(e, lo, hi, xa, colW);
    if(e > 0) g += `<rect x="${xa0}" y="${cy-bh/2}" width="${Math.max(2, xe-xa0)}" height="${bh}" rx="3" fill="var(--series-1)" pointer-events="none"/>`;
    g += whisker(lpos(expoNg(r,"lb")||Math.pow(10,lo), lo, hi, xa, colW), lpos(expoNg(r,"ub")||Math.pow(10,lo), lo, hi, xa, colW), cy);
    const xb0 = lpos(Math.pow(10,rlo), rlo, rhi, xb, colW), xq = lpos(q, rlo, rhi, xb, colW);
    if(q > 0) g += `<rect x="${xb0}" y="${cy-bh/2}" width="${Math.max(2, xq-xb0)}" height="${bh}" rx="3" fill="${STC[r.status]}" pointer-events="none"/>`;
    g += whisker(lpos(r.RQ.lb||Math.pow(10,rlo), rlo, rhi, xb, colW), lpos(r.RQ.ub||Math.pow(10,rlo), rlo, rhi, xb, colW), cy);
  });
  el.innerHTML = g + `</svg>`;
}
function rankNote(res){
  const b = S.bound, SU = subs();
  const topE = SU.slice().sort((x,y)=>expoNg(res.S[y.k],b)-expoNg(res.S[x.k],b))[0];
  const topR = SU.slice().sort((x,y)=>res.S[y.k].RQ[b]-res.S[x.k].RQ[b])[0];
  if(!res.foods.length) return "";
  let h = t("rank_note").replace("{a}", esc(sname(topE.k))).replace("{ea}", fmt(res.S[topE.k].E[b])+" "+unitOf(topE)).replace("{b}", esc(sname(topR.k))).replace("{rb}", fmt(res.S[topR.k].RQ[b]));
  if(topE.k !== topR.k) h += " " + t("rank_diff");
  return h;
}
function barList(el, rows, opts={}){
  // rows: [{label, v (0..1 share or value), txt, tip}]
  const W = cw(el, opts.w || 520), lab = opts.labW || 200, rowH = 24, padR = 56, x0 = lab, w = W-lab-padR;
  const max = opts.max || Math.max(...rows.map(r=>r.v), 1e-12);
  const H = rows.length*rowH + 6;
  let g = `<svg viewBox="0 0 ${W} ${H}">`;
  rows.forEach((r,i)=>{
    const y = i*rowH, cy = y+rowH/2, bw = Math.max(2, r.v/max*w);
    g += `<rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}" ${r.tip?`data-tip="${esc(r.tip)}"`:""}/>`;
    g += `<text class="lbl" x="${lab-10}" y="${cy+4}" text-anchor="end" pointer-events="none">${esc(trunc(r.label, opts.trunc||30))}</text>`;
    g += `<rect x="${x0}" y="${cy-6}" width="${bw}" height="12" rx="3" fill="${r.color||"var(--series-1)"}" pointer-events="none"/>`;
    g += `<text x="${x0+bw+6}" y="${cy+4}" pointer-events="none">${esc(r.txt)}</text>`;
  });
  g += `</svg>`;
  el.innerHTML = g;
}
const trunc = (s,n) => s.length>n ? s.slice(0,n-1)+"…" : s;

function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function searchFoods(q){
  const nq = norm(q.trim());
  let list = FOODS.filter(f => S.all || f.core);
  if(nq) list = FOODS.filter(f => (S.all||f.core||nq.length>=3) && [f.es,f.en,f.fr].some(n=>norm(n).includes(nq)));
  const out = {};
  CATS.forEach(c=>out[c]=[]);
  list.forEach(f=>out[f.cat].push(f));
  CATS.forEach(c=>out[c].sort((a,b)=>fname(a).localeCompare(fname(b))));
  return out;
}
function openDD(input){
  const dd = input.nextElementSibling;
  const groups = searchFoods(input.value);
  let h = "";
  CATS.forEach(c => { if(!groups[c].length) return;
    h += `<div class="grp">${esc(t("cat_"+c))}</div>` + groups[c].map(f=>`<div class="opt" data-id="${f.id}"><span>${esc(fname(f))}${S.lang!=="fr"?` <small>· ${esc(f.fr)}</small>`:""}</span><small>${f.g} g${f.c.Cd?"":" · ⚠"}</small></div>`).join("");
  });
  dd.innerHTML = h || `<div class="empty" style="padding:8px 10px">—</div>`;
  dd.classList.add("open");
  const first = dd.querySelector(".opt"); if(first) first.classList.add("act");
}
function closeDD(){ document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open")); }
function addFood(meal, id){
  const f = byId[id];
  S.meals[meal].push({id, g:f.g});
  update();
  const inp = document.querySelector(`[data-meal="${meal}"] .search`); if(inp){ inp.focus(); }
}
const mealsBox = document.getElementById("meals");
mealsBox.addEventListener("focusin", e => { if(e.target.classList.contains("search")) openDD(e.target); });
mealsBox.addEventListener("input", e => {
  const el = e.target, card = el.closest("[data-meal]"); if(!card) return;
  const meal = card.dataset.meal;
  if(el.classList.contains("search")) return openDD(el);
  const row = el.closest(".item"); if(!row) return;
  const it = S.meals[meal][+row.dataset.i], f = byId[it.id];
  if(el.classList.contains("por")){ it.g = Math.max(0, (+el.value||0)*f.g); row.querySelector(".gr").value = Math.round(it.g*10)/10; }
  if(el.classList.contains("gr")){ it.g = Math.max(0, +el.value||0); row.querySelector(".por").value = +(it.g/f.g).toFixed(2); }
  card.querySelector(".tot").textContent = fmt(S.meals[meal].reduce((a,x)=>a+(+x.g||0),0),0)+" g";
  update(false);
});
mealsBox.addEventListener("click", e => {
  const card = e.target.closest("[data-meal]"); if(!card) return;
  const meal = card.dataset.meal;
  const opt = e.target.closest(".opt");
  if(opt){ closeDD(); addFood(meal, +opt.dataset.id); return; }
  if(e.target.classList.contains("x")){ S.meals[meal].splice(+e.target.closest(".item").dataset.i,1); update(); }
});
mealsBox.addEventListener("keydown", e => {
  if(!e.target.classList.contains("search")) return;
  const dd = e.target.nextElementSibling, opts=[...dd.querySelectorAll(".opt")];
  let i = opts.findIndex(o=>o.classList.contains("act"));
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(i>=0) opts[i].classList.remove("act"); i = e.key==="ArrowDown"? Math.min(opts.length-1,i+1) : Math.max(0,i-1); if(opts[i]){opts[i].classList.add("act"); opts[i].scrollIntoView({block:"nearest"});} }
  if(e.key==="Enter" && opts[i]){ e.preventDefault(); const meal=e.target.closest("[data-meal]").dataset.meal; closeDD(); addFood(meal, +opts[i].dataset.id); }
  if(e.key==="Escape"){ closeDD(); e.target.blur(); }
});

const SEQ = ["--seq-0","--seq-1","--seq-2","--seq-3","--seq-4","--seq-5","--seq-6","--seq-7"];
function seqColor(p){ if(p<=0) return "var(--seq-0)"; const i = Math.min(7, 1+Math.floor(p/100*7)); return `var(${SEQ[i]})`; }

  document.getElementById("heatScale").innerHTML = `0 %<span class="bar">${SEQ.slice(1).map(v=>`<i style="background:var(${v})"></i>`).join("")}</span>100 % <span class="muted" style="margin-left:10px"><span class="cov" style="width:22px;height:10px;background:repeating-linear-gradient(135deg,var(--line-strong) 0 3px,var(--surface-1) 3px 6px);border-radius:2px"></span> ${esc(t("not_analysed"))}</span>`;
  // detail
  const s = SU.find(x=>x.k===S.sel), r = res.S[S.sel];

  const rows = Object.entries(r.contrib).map(([id,c])=>({id:+id, v:c[b]})).filter(x=>x.v>0).sort((a,c)=>c.v-a.v);
  const tot = r.E[b];
  if(!rows.length) { document.getElementById("contribChart").innerHTML = `<p class="empty">${esc(t("contrib_none"))}</p>`; }
  else barList(document.getElementById("contribChart"), rows.slice(0,15).map(x=>({label:fname(byId[x.id]), v:x.v/tot, txt:fmt(x.v/tot*100,1)+" %", tip:`<b>${esc(fname(byId[x.id]))}</b><br>${fmt(res.intake[x.id],0)} g × ${fmt(byId[x.id].c[s.k][{lb:0,mb:1,ub:2}[b]])} ${s.u==="pg"?"pg TEQ/g":"ng/g"}<br>= ${fmt(x.v)} ${unitOf(s)} (${fmt(x.v/tot*100,1)} %)`})), {w:560, labW:220});
  const n = document.getElementById("contribNote");
  n.innerHTML = r.missing.length ? t("contrib_cov") + r.missing.map(id=>esc(fname(byId[id]))).join(", ") : `<b>${esc(sname(s.k))}</b> · ${esc(SUBTXT[s.k].ep[S.lang])}`;
}
document.getElementById("heat").addEventListener("click", e => { const th = e.target.closest("th.sub"); if(th){ S.sel = th.dataset.k; document.getElementById("subSel").value=S.sel; renderContrib(compute(S.meals,S.bw)); } });
document.getElementById("subSel").addEventListener("change", e => { S.sel = e.target.value; renderContrib(compute(S.meals,S.bw)); });

/* ---------------------------------------------------------------- 4 · risk & mixtures */
function renderRisk(res){
  const b = S.bound, SU = subs();
  const H = hi(res,b);
  const e1 = document.getElementById("hiAll"); e1.innerHTML = `${fmt(H,2)} <span class="small" style="font-weight:500">${statusHTML(hiStatus(res))}</span>`;
  const carc = SU.filter(s=>s.grp==="carc");
  const MT = moet(res, b), stC = moetStatus(res);
  document.getElementById("moetCarc").innerHTML = `${isFinite(MT)?fmt(MT):"–"} <span class="small" style="font-weight:500">${statusHTML(stC)}</span>`;
  // drivers (threshold substances)
  const drv = SU.filter(s=>s.grp!=="carc").map(s=>({k:s.k, v:res.S[s.k].RQ[b]})).sort((a,c)=>c.v-a.v);
  if(H>0) barList(document.getElementById("driversChart"), drv.map(d=>({label:sname(d.k), v:d.v/H, txt:fmt(d.v/H*100,1)+" %", tip:`<b>${esc(sname(d.k))}</b><br>RQ ${fmt(d.v)} / HI ${fmt(H,2)}`})), {w:520, labW:180});
  else document.getElementById("driversChart").innerHTML = `<p class="empty">${esc(t("no_items"))}</p>`;
  // groups (threshold substances); shared linear scale so rows are comparable
  const TG = GROUPS.filter(g=>g!=="carc");
  const maxG = Math.max(1.2, ...TG.map(g=>SU.filter(s=>s.grp===g).reduce((a,s)=>a+res.S[s.k].RQ[b],0)));
  const scaleMax = maxG<=1.2 ? 1.5 : Math.pow(10, Math.ceil(Math.log10(maxG)*4)/4);
  const box = document.getElementById("mixRows");
  const W = Math.max(260, (box.clientWidth||900) - 210 - 120 - 24), Hh=46, w=W-30;
  const short = k => (SUBTXT[k].sh ? SUBTXT[k].sh[S.lang] : sname(k));
  let h = "";
  TG.forEach(g => {
    const ss = SU.filter(s=>s.grp===g); if(!ss.length) return;
    const tot = ss.reduce((a,s)=>a+res.S[s.k].RQ[b],0);
    const st = hiStatus(res, ss.map(s=>s.k));
    let x=0, segs="";
    ss.slice().sort((a,c)=>res.S[c.k].RQ[b]-res.S[a.k].RQ[b]).forEach((s,i)=>{
      const v = res.S[s.k].RQ[b], ww = v/scaleMax*w;
      if(ww<=0) return;
      const shade = ["var(--seq-6)","var(--seq-4)","var(--seq-3)","var(--seq-2)"][i%4];
      segs += `<rect x="${x}" y="6" width="${Math.max(1.5,ww-2)}" height="16" rx="3" fill="${shade}" data-tip="<b>${esc(sname(s.k))}</b><br>RQ ${fmt(v)} (${fmt(tot>0?v/tot*100:0,0)} %)"/>`;
      const lbl = short(s.k);
      if(ww > lbl.length*6.5+10) segs += `<text x="${x+5}" y="18" style="fill:${i<2?"#fff":"#0e3d7e"};font-size:11px" pointer-events="none">${esc(lbl)}</text>`;
      x += ww;
    });
    const xt = 1/scaleMax*w;
    const axis = `<line class="thr" x1="${xt}" x2="${xt}" y1="2" y2="26"/><text x="${xt}" y="40" text-anchor="middle">1</text><text x="0" y="40">0</text><text x="${w}" y="40" text-anchor="end">${fmt(scaleMax)}</text>`;
    h += `<div class="mix-row"><div class="gname"><b>${esc(t("g_"+g))}</b><small>${esc(t("g_"+g+"_d"))} · ${ss.map(s=>esc(sname(s.k))).join(", ")}</small></div>
      <div class="chart"><svg viewBox="0 0 ${W} ${Hh}"><line class="gl" x1="0" x2="${w}" y1="14" y2="14"/>${segs}${axis}</svg></div>
      <div><div style="font-size:20px;font-weight:650;font-variant-numeric:tabular-nums">HI ${fmt(tot,2)}</div>${statusHTML(st)}</div></div>`;
  });
  // genotoxic carcinogens: MOE approach, no HI
  h += `<div class="mix-row"><div class="gname"><b>${esc(t("g_carc"))}</b><small>${esc(t("g_carc_d"))} · ${carc.map(s=>esc(sname(s.k))).join(", ")}</small></div>
    <div class="small sec">${t("carc_row")}:<br>${carc.map(s=>{ const m = s.rp/res.S[s.k].E[b]; return `<b>${esc(sname(s.k))}</b> MOE ${isFinite(m)?fmt(m):"–"} ${statusHTML(res.S[s.k].status)}`; }).join(" &nbsp;·&nbsp; ")}</div>
    <div><div style="font-size:20px;font-weight:650;font-variant-numeric:tabular-nums">MOE<sub>T</sub> ${isFinite(MT)?fmt(MT):"–"}</div>${statusHTML(stC)}</div></div>`;
  document.getElementById("mixRows").innerHTML = h;
}

/* ---------------------------------------------------------------- 5 · compare */
const SCOL = ["var(--series-1)","var(--series-2)","var(--series-3)","var(--series-4)","var(--text-secondary)"];
function renderCompare(res){
  const list = document.getElementById("scenList");
  list.innerHTML = S.scen.map((sc,i)=>`<div class="scen"><i style="background:${SCOL[i]}"></i><input value="${esc(sc.name)}" data-i="${i}" aria-label="name"><small>${fmt(sc.bw,0)} kg</small><button class="btn small" data-load="${i}">${esc(t("load"))}</button><button class="btn small" data-del="${i}" aria-label="${esc(t("del"))}">×</button></div>`).join("");
  document.getElementById("btnSave").disabled = S.scen.length>=4;
  const series = S.scen.map((sc,i)=>({name:sc.name, color:SCOL[i], res:compute(sc.meals, sc.bw)}));
  series.push({name:t("current"), color:SCOL[4], res, current:true});
  const lg = document.getElementById("cmpLegend"), ch = document.getElementById("cmpChart");
  lg.innerHTML = series.map(s=>`<span><i style="background:${s.color}${s.current?";background:repeating-linear-gradient(45deg,var(--text-secondary) 0 2px,transparent 2px 4px);border:1px solid var(--text-secondary)":""}"></i>${esc(s.name)}</span>`).join("");
  if(!S.scen.length){ ch.innerHTML = `<p class="empty">${esc(t("cmp_empty"))}</p>`; }
  const b = S.bound, SU = subs();
  // grouped log bars
  if(S.scen.length){
    const W=cw(ch,760), lab=170, padR=16, x0=lab, w=W-lab-padR, n=series.length, bh=6, gap=2, rowH = n*(bh+gap)+12, top=8, H = top+SU.length*rowH+24;
    let g = `<svg viewBox="0 0 ${W} ${H}">` + logAxis(x0, w, top, top+SU.length*rowH);
    SU.forEach((s,i)=>{
      const y = top+i*rowH;
      g += `<text class="lbl" x="${lab-10}" y="${y+rowH/2+4}" text-anchor="end">${esc(sname(s.k))}</text>`;
      if(i>0) g += `<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}" stroke-dasharray="1 3"/>`;
      series.forEach((se,j)=>{
        const v = se.res.S[s.k].RQ[b], xs=lx(Math.pow(10,LOGMIN),x0,w), xv=lx(v,x0,w), yy = y+6+j*(bh+gap);
        const fill = se.current ? "url(#hatch)" : se.color;
        if(v>0) g += `<rect x="${xs}" y="${yy}" width="${Math.max(2,xv-xs)}" height="${bh}" rx="2" fill="${fill}" ${se.current?'stroke="var(--text-secondary)" stroke-width=".8"':""} data-tip="<b>${esc(se.name)}</b> · ${esc(sname(s.k))}<br>RQ ${fmt(v)} · ${metricText(se.res.S[s.k])}"/>`;
      });
    });
    g = g.replace("<svg ", `<svg `) + `<defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="var(--surface-1)"/><line x1="0" y1="0" x2="0" y2="4" stroke="var(--text-secondary)" stroke-width="2"/></pattern></defs></svg>`;
    ch.innerHTML = g;
  }
  // table
  let th = `<thead><tr><th></th>${series.map(s=>`<th class="num">${esc(s.name)}</th>`).join("")}</tr></thead><tbody>`;
  th += `<tr><td><b>${t("cmp_th_total")}</b></td>${series.map(s=>`<td class="num"><b>${fmt(hi(s.res,b),2)}</b></td>`).join("")}</tr>`;
  th += `<tr><td>MOE<sub>T</sub> ${esc(t("g_carc").toLowerCase())}</td>${series.map(s=>{const m=moet(s.res,b); return `<td class="num">${isFinite(m)?fmt(m):"–"}</td>`;}).join("")}</tr>`;
  th += `<tr><td>${t("cmp_th_exceed")}</td>${series.map(s=>`<td class="num">${Object.values(s.res.S).filter(r=>r.RQ[b]>=1).length}</td>`).join("")}</tr>`;
  th += `<tr><td>${t("cmp_th_g")}</td>${series.map(s=>`<td class="num">${fmt(s.res.grams,0)}</td>`).join("")}</tr>`;
  SU.forEach(s => th += `<tr><td class="small">${esc(sname(s.k))} <span class="muted">(${s.type==="HBGV"?"%":"MOE"})</span></td>${series.map(se=>`<td class="num small">${metricText(se.res.S[s.k]).replace("MOE ","")}</td>`).join("")}</tr>`);
  document.getElementById("cmpTable").innerHTML = th + "</tbody>";
}
document.getElementById("btnSave").addEventListener("click", () => {
  if(S.scen.length>=4) return;
  S.scen.push({name:`${t("scen_default")} ${String.fromCharCode(65+S.scen.length)}`, bw:S.bw, meals:JSON.parse(JSON.stringify(S.meals))});
  update();
});
document.getElementById("scenList").addEventListener("click", e => {
  const l = e.target.dataset.load, d = e.target.dataset.del;
  if(l!==undefined){ const sc=S.scen[+l]; S.meals=JSON.parse(JSON.stringify(sc.meals)); MEALS.forEach(k=>{if(!S.meals[k])S.meals[k]=[];}); S.bw=sc.bw; document.getElementById("bw").value=S.bw; setView("diet"); update(); }
  if(d!==undefined){ S.scen.splice(+d,1); update(); }
});
document.getElementById("scenList").addEventListener("change", e => { if(e.target.dataset.i!==undefined){ S.scen[+e.target.dataset.i].name = e.target.value; update(); } });
document.getElementById("btnExport").addEventListener("click", () => {
  const pack = m => { const o={}; MEALS.forEach(k=>o[k]=(m[k]||[]).map(it=>({food:byId[it.id].fr, g:+it.g}))); return o; };
  download("mixexpo_diet.json", JSON.stringify({app:"MixExpo", version:"v1 (25.11.2026)", author:"German Cano-Sancho", note:"For pedagogical purposes only", bw:S.bw, meals:pack(S.meals), scenarios:S.scen.map(s=>({name:s.name,bw:s.bw,meals:pack(s.meals)}))}, null, 1), "application/json");
});
document.getElementById("fileIn").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { try{
    const d = JSON.parse(rd.result);
    const unpack = m => { const o=emptyMeals(); MEALS.forEach(k=>(m&&m[k]||[]).forEach(it=>{ const fd=byFr[it.food]; if(fd) o[k].push({id:fd.id, g:+it.g||0}); })); return o; };
    S.meals = unpack(d.meals); S.bw = +d.bw||70; S.scen = (d.scenarios||[]).slice(0,4).map(s=>({name:String(s.name||"?"), bw:+s.bw||70, meals:unpack(s.meals)}));
    document.getElementById("bw").value=S.bw; update(); ioMsg(t("imported"));
  }catch(err){ ioMsg(t("import_err")); } };
  rd.readAsText(f); e.target.value="";
});

/* ---------------------------------------------------------------- 6 · methods */
function renderMethods(){
  const SU = subs();
  let h = `<thead><tr><th>${t("th_sub")}</th><th>${t("th_type")}</th><th class="num">${t("th_value")}</th><th>${t("th_unit")}</th><th class="num">${t("th_thr")}</th><th>${t("th_endpoint")}</th><th>${t("th_conf")}</th></tr></thead><tbody>`;
  SU.forEach(s => {
    h += `<tr><td><b>${esc(sname(s.k))}</b></td><td><span class="pill">${s.type==="HBGV"?(S.lang==="en"?"HBGV":(S.lang==="fr"?"VTR":"VBS")):"MOE"}</span></td>
      <td class="num"><input class="rpin" type="number" step="any" min="0" data-k="${s.k}" data-f="rp" value="${+s.rp.toPrecision(4)}"></td>
      <td class="small muted">${unitOf(s)}</td>
      <td class="num">${s.type==="MOE"?`<input class="rpin" style="width:90px!important" type="number" step="any" min="0" data-k="${s.k}" data-f="thr" value="${s.thr}">`:"–"}</td>
      <td class="small">${esc(SUBTXT[s.k].ep[S.lang])}</td><td class="small">${t("conf_"+s.conf)}</td></tr>`;
  });
  document.getElementById("refTable").innerHTML = h + "</tbody>";
  // coverage
  const n = FOODS.length;
  document.getElementById("covMatrix").innerHTML = `<table class="t" style="max-width:520px"><tbody>${SU.map(s=>{ const c = FOODS.filter(f=>f.c[s.k]).length; return `<tr><td>${esc(sname(s.k))}</td><td class="num">${c} / ${n}</td><td style="width:220px"><div style="height:10px;border-radius:3px;background:var(--surface-2)"><div style="height:10px;border-radius:3px;width:${c/n*100}%;background:var(--series-1)"></div></div></td></tr>`; }).join("")}</tbody></table>`;
}
document.getElementById("refTable").addEventListener("change", e => {
  const el = e.target; if(!el.dataset.k) return;
  const v = +el.value; if(!(v>0)) { el.value = subs().find(s=>s.k===el.dataset.k)[el.dataset.f]; return; }
  S.rp[el.dataset.k] = Object.assign(S.rp[el.dataset.k]||{}, {[el.dataset.f]: v});
  update();
});
document.getElementById("btnResetRP").addEventListener("click", () => { S.rp = {}; update(); });

/* ---------------------------------------------------------------- navigation & global controls */
function setView(v){
  S.view = v;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.v===v));
  document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on", s.id==="v-"+v));
  update(false);
}
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if(b){ setView(b.dataset.v); window.scrollTo({top:0}); } });
document.getElementById("langSeg").addEventListener("click", e => { const b=e.target.closest("button"); if(b){ S.lang=b.dataset.l; applyI18n(); update(); } });
document.getElementById("boundSeg").addEventListener("click", e => { const b=e.target.closest("button"); if(b){ S.bound=b.dataset.b; applyI18n(); update(false); } });
document.getElementById("bw").addEventListener("input", e => { const v=+e.target.value; if(v>=10 && v<=250){ S.bw=v; update(false); } });
document.getElementById("allFoods").addEventListener("change", e => { S.all = e.target.checked; store(); });
let clearArmed = 0;
document.getElementById("btnClear").addEventListener("click", e => {
  const btn = e.currentTarget;
  if(Date.now() - clearArmed < 4000){ clearArmed = 0; btn.textContent = t("clear"); S.meals = emptyMeals(); update(); return; }
  clearArmed = Date.now(); btn.textContent = t("confirm_clear");
  setTimeout(()=>{ if(clearArmed && Date.now()-clearArmed>=3900){ clearArmed=0; btn.textContent=t("clear"); } }, 4000);
});
document.getElementById("preset").addEventListener("change", e => {
  const p = PRESETS[e.target.value]; if(!p) return;
  S.meals = emptyMeals();
  MEALS.forEach(m => (p[m]||[]).forEach(([fr,g]) => { const f = byFr[fr]; if(f) S.meals[m].push({id:f.id, g}); }));
  e.target.value = ""; update();
});
document.getElementById("btnCSV").addEventListener("click", csvExport);
document.getElementById("sortSeg").addEventListener("click", e => { const x=e.target.closest("button"); if(x){ S.sort=x.dataset.s; update(false); } });
document.getElementById("btnPrint").addEventListener("click", () => { try{ window.print(); }catch(e){} });
function ioMsg(m){ const el = document.getElementById("ioMsg"); el.textContent = m; setTimeout(()=>{ if(el.textContent===m) el.textContent=""; }, 5000); }

function update(full=true){
  const res = compute(S.meals, S.bw);
  if(full) renderMeals();
  renderLive(res);
  if(S.view==="expo") renderExpo(res);
  if(S.view==="contrib") renderContrib(res);
  if(S.view==="risk") renderRisk(res);
  if(S.view==="compare") renderCompare(res);
  if(S.view==="methods") renderMethods();
  store();
}

let rzT; addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(()=>update(false), 150); });
/* ---------------------------------------------------------------- boot */
if(!Object.values(S.meals).some(a=>a.length)){
  const p = PRESETS.p_excel; MEALS.forEach(m => (p[m]||[]).forEach(([fr,g]) => { const f=byFr[fr]; if(f) S.meals[m].push({id:f.id,g}); }));
}
document.getElementById("bw").value = S.bw;
document.getElementById("allFoods").checked = !!S.all;
applyI18n();
setView("diet");
update();
</script>
</body>
</html>
