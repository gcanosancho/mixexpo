<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MixExpo v1.3 · Chemical mixture exposure calculator (French TDS2) · G. Cano-Sancho</title>
<meta name="author" content="German Cano-Sancho">
<meta name="description" content="MixExpo v1.3 (26.11.2026) – pedagogical chemical mixture exposure calculator based on French TDS2 data. Author: German Cano-Sancho. For teaching purposes only.">
<style>
:root{
  color-scheme: light;
  --bg:#f6f5f1; --surface-1:#ffffff; --surface-2:#f1f0eb; --line:#e3e1da; --line-strong:#cfccc2;
  --text-primary:#1d1d1b; --text-secondary:#5f5e58; --text-muted:#8a887f;
  --accent:#1b64be; --accent-soft:#e6f0fc;
  --series-1:#257de0; --series-2:#f47230; --series-3:#00b894; --series-4:#f2a600;
  --good:#0aac23; --good-ink:#006c10; --warning:#fbb315; --warning-ink:#8a5a00; --critical:#dc3c3d; --critical-ink:#b0282a;
  --seq-0:#f3f7fc; --seq-1:#cce3fd; --seq-2:#9dc8f7; --seq-3:#6aabf1; --seq-4:#338ced; --seq-5:#2370cd; --seq-6:#1757ac; --seq-7:#0e3d7e;
  --grid:#ecebe6; --radius:10px;
  /* chemical families (validated categorical order: blue, orange, aqua, violet, magenta, brown, cyan, olive) */
  --fam-metal:#257de0; --fam-proc:#f47230; --fam-myco:#00b894; --fam-pop:#6a4ce2; --fam-pest:#ee7fac; --fam-fcm:#9a6b1f; --fam-add:#1fa2c4; --fam-phyto:#86a000;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121212; --surface-1:#1b1b1b; --surface-2:#232323; --line:#2e2e2e; --line-strong:#3c3c3c;
    --text-primary:#efefef; --text-secondary:#a9a9a9; --text-muted:#7d7d7d;
    --accent:#519ced; --accent-soft:#1a2a3d;
    --series-1:#338ced; --series-2:#e76624; --series-3:#00a888; --series-4:#d28e05;
    --good-ink:#3fcf55; --warning-ink:#fbb315; --critical-ink:#f07071;
    --seq-0:#1d232b; --seq-1:#0e3d7e; --seq-2:#0f4a96; --seq-3:#1757ac; --seq-4:#2370cd; --seq-5:#338ced; --seq-6:#6aabf1; --seq-7:#b6d5f8;
    --grid:#2a2a2a;
    --fam-metal:#338ced; --fam-proc:#e76624; --fam-myco:#00a888; --fam-pop:#9887ef; --fam-pest:#e24d8b; --fam-fcm:#c98a3a; --fam-add:#1f9cc0; --fam-phyto:#7f9a10;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface-1);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;gap:18px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand b{font-size:18px;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--text-secondary)}
.brand .ver{font-size:11.5px;font-weight:600;color:var(--text-secondary);background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.brand .byline{font-size:12px;color:var(--text-muted)}
.ctrl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)}
.ctrl input[type=number]{width:72px}
input[type=number],input[type=text],select{background:var(--surface-1);border:1px solid var(--line-strong);border-radius:7px;padding:5px 8px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--text-primary);color:var(--surface-1)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 14px 11px;cursor:pointer;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
nav.tabs button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-2);font-size:11.5px;margin-right:6px;color:var(--text-secondary)}
nav.tabs button[aria-selected=true]{color:var(--text-primary);border-bottom-color:var(--text-primary);font-weight:600}
nav.tabs button[aria-selected=true] .n{background:var(--text-primary);color:var(--surface-1)}
main{padding:22px 0 60px}
section.view{display:none}
section.view.on{display:block}
h2{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:15.5px;margin:0 0 10px}
p.lead{margin:0 0 18px;color:var(--text-secondary);max-width:80ch}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.grid-diet{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:18px;align-items:start}
.side{position:sticky;top:120px}
@media (max-width:980px){.grid-diet{grid-template-columns:1fr}.side{position:static}}
@media (max-width:700px){header.top{position:static}.top-row{gap:10px}.item{grid-template-columns:1fr 14px 1fr 28px}.item .nm{grid-column:1/-1}.kpi .v{font-size:20px}}
.stack{display:flex;flex-direction:column;gap:14px}
.meal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.meal-head h3{margin:0;display:flex;align-items:center;gap:8px}
.meal-head .tot{font-size:12.5px;color:var(--text-muted)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) 78px 18px 74px 28px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{min-width:0}
.item .nm b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm small{color:var(--text-muted);font-size:12px}
.item input{width:100%;padding:4px 6px;text-align:right}
.item .x{border:0;background:none;cursor:pointer;color:var(--text-muted);font-size:18px;line-height:1;border-radius:6px;padding:3px}
.item .x:hover{background:var(--surface-2);color:var(--critical-ink)}
.unitlbl{font-size:11px;color:var(--text-muted);text-align:center}
.empty{color:var(--text-muted);font-size:13px;padding:6px 0}
.adder{position:relative;margin-top:8px}
.adder input{width:100%;padding:7px 10px;border-style:dashed}
.dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface-1);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.14);max-height:340px;overflow:auto;z-index:30;display:none}
.dd.open{display:block}
.dd .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:8px 10px 3px;background:var(--surface-2);position:sticky;top:0}
.dd .opt{padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.dd .opt small{color:var(--text-muted);white-space:nowrap}
.dd .opt.act,.dd .opt:hover{background:var(--accent-soft)}
.fdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;flex:none}
.famleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-secondary);margin:6px 0 2px}
.famleg span{display:inline-flex;align-items:center}
.cov{display:inline-flex;gap:1px;vertical-align:middle;margin-left:4px}
.cov i{width:4px;height:9px;border-radius:1px;background:var(--line-strong)}
.cov i.y{background:var(--text-secondary)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar select{max-width:100%;min-width:0}
#trajSel,#presetDays,#preset,#subSel{max-width:min(100%,420px)}
@media (max-width:700px){.toolbar select{width:100%}}
.btn{border:1px solid var(--line-strong);background:var(--surface-1);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
.btn.small{padding:3px 9px;font-size:12.5px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--text-secondary)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:550;white-space:nowrap}
.status .dot{width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.st-ok{color:var(--good-ink)} .st-ok .dot{background:var(--good)}
.st-unc{color:var(--warning-ink)} .st-unc .dot{background:var(--warning);color:#3a2700}
.st-hi{color:var(--critical-ink)} .st-hi .dot{background:var(--critical)}
.st-na{color:var(--text-muted)} .st-na .dot{background:var(--line-strong);color:var(--text-primary)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--text-secondary);font-size:12px;border-bottom:1px solid var(--line-strong);padding:7px 8px;vertical-align:bottom}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.fam td{background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:4px 8px}
.muted{color:var(--text-muted)} .sec{color:var(--text-secondary)}
.small{font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two>*,.grid-diet>*,.stack>*{min-width:0}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--text-secondary);font-size:11.5px}
.chart .lbl{fill:var(--text-primary);font-size:12.5px}
.chart .ax{stroke:var(--line-strong)}
.chart .gl{stroke:var(--grid)}
.chart .thr{stroke:var(--text-primary);stroke-dasharray:4 3;stroke-width:1.5}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:var(--text-primary);fill-opacity:.04}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--text-secondary);margin:4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
#tip{position:fixed;pointer-events:none;background:var(--text-primary);color:var(--surface-1);font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:7px;max-width:300px;z-index:100;opacity:0;transition:opacity .08s}
#tip b{font-weight:650}
.heat{overflow:auto}
.heat table{border-collapse:separate;border-spacing:2px;font-size:12px}
.heat th{font-weight:550;color:var(--text-secondary);padding:2px 4px;white-space:nowrap}
.heat th.sub{writing-mode:vertical-rl;transform:rotate(180deg);height:160px;vertical-align:bottom;text-align:left;cursor:pointer}
.heat th.sub.sel{color:var(--text-primary);text-decoration:underline}
.heat th.fd{text-align:right;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.heat td{width:44px;min-width:44px;height:26px;text-align:center;border-radius:4px;font-variant-numeric:tabular-nums;cursor:default}
.heat td.na{background:repeating-linear-gradient(135deg,var(--surface-2) 0 3px,var(--surface-1) 3px 6px);color:var(--text-muted)}
.scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);margin-top:8px}
.scale .bar{display:flex;height:10px;border-radius:3px;overflow:hidden}
.scale .bar i{width:26px}
.note{background:var(--surface-2);border-left:3px solid var(--line-strong);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13.5px;color:var(--text-secondary);margin:12px 0}
.note.warn{border-left-color:var(--warning)}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:20px;background:var(--surface-2);color:var(--text-secondary);white-space:nowrap}
.mix-row{display:grid;grid-template-columns:210px minmax(0,1fr) 150px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mix-row:first-of-type{border-top:0}
.mix-row .gname b{display:block;font-weight:600}
.mix-row .gname small{color:var(--text-muted)}
@media (max-width:760px){.mix-row{grid-template-columns:1fr}}
.scen-list{display:flex;flex-direction:column;gap:6px}
.scen{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.scen i{width:12px;height:12px;border-radius:3px;flex:none}
.scen input{flex:1;min-width:0;border:0;background:transparent;padding:2px 0;font-weight:550}
.scen small{color:var(--text-muted);white-space:nowrap}
details.method{border-top:1px solid var(--line);padding:10px 0}
details.method summary{cursor:pointer;font-weight:600}
details.method[open] summary{margin-bottom:8px}
.rpin{width:110px!important;text-align:right}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin:6px 0 18px}
.step{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.step .num{width:30px;height:30px;border-radius:50%;background:var(--text-primary);color:var(--surface-1);display:grid;place-items:center;font-weight:700;font-size:14px}
.step h3{margin:0;font-size:16px}
.step p{margin:0;color:var(--text-secondary);font-size:14px;flex:1}
.step .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.step label{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-secondary)}
.step input{width:80px}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips button{border:1px solid var(--line-strong);background:var(--surface-1);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13.5px}
.daychips button[aria-pressed=true]{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
table.dgrid{border-collapse:separate;border-spacing:2px;font-size:11.5px;width:100%}
table.dgrid th{font-weight:600;color:var(--text-secondary);padding:2px 3px;white-space:nowrap}
table.dgrid th.sub{text-align:right;font-weight:500;color:var(--text-primary);max-width:190px;overflow:hidden;text-overflow:ellipsis}
table.dgrid td{text-align:center;padding:3px 2px;border-radius:4px;font-variant-numeric:tabular-nums;min-width:34px}
table.dgrid td.ok{background:color-mix(in srgb,var(--good) 14%,transparent)}
table.dgrid td.unc{background:color-mix(in srgb,var(--warning) 30%,transparent)}
table.dgrid td.hi{background:color-mix(in srgb,var(--critical) 25%,transparent);font-weight:600}
table.dgrid td.na{color:var(--text-muted)}
table.dgrid td.mean,table.dgrid th.mean{border-left:2px solid var(--text-primary)}
table.dgrid tr.tot th,table.dgrid tr.tot td{border-top:1px solid var(--line-strong);font-weight:650}
#basisBanner{display:none;margin:0 0 14px}
footer{color:var(--text-muted);font-size:12px;padding:24px 0;border-top:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:700px){.item{grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr) 28px}.item .nm{grid-column:1/-1}}
@media print{
  header.top{position:static} nav.tabs,.toolbar,.adder,.item .x,#tip{display:none!important}
  section.view{display:block!important;page-break-after:always} body{background:#fff}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><b>MixExpo <span class="ver">v1.3 · 26.11.2026</span></b><span data-i18n="subtitle"></span><span class="byline">German Cano-Sancho · <span data-i18n="peda_only"></span></span></div>
      <label class="ctrl"><span data-i18n="bw"></span> <input id="bw" type="number" min="10" max="200" step="1" value="70"> kg</label>
      <label class="ctrl"><span data-i18n="age"></span> <input id="age" type="number" min="1" max="110" step="1" placeholder="–" style="width:62px"> <span data-i18n="yrs"></span></label>
      <div class="ctrl" id="basisCtrl"><span data-i18n="basis"></span>
        <div class="seg" id="basisSeg" role="group"><button data-x="day" data-i18n="basis_day"></button><button data-x="mean" id="basisMeanBtn"></button></div>
      </div>
      <div class="ctrl"><span data-i18n="bound"></span>
        <div class="seg" id="boundSeg" role="group">
          <button data-b="lb">LB</button><button data-b="mb">MB</button><button data-b="ub">UB</button>
        </div>
      </div>
      <div class="ctrl">
        <div class="seg" id="langSeg" role="group" aria-label="Language">
          <button data-l="es">ES</button><button data-l="fr">FR</button><button data-l="en">EN</button>
        </div>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-v="intro"><span class="n">0</span><span data-i18n="tab_intro"></span></button>
      <button role="tab" data-v="diet"><span class="n">1</span><span data-i18n="tab_diet"></span></button>
      <button role="tab" data-v="days"><span class="n">2</span><span data-i18n="tab_days"></span></button>
      <button role="tab" data-v="expo"><span class="n">3</span><span data-i18n="tab_expo"></span></button>
      <button role="tab" data-v="contrib"><span class="n">4</span><span data-i18n="tab_contrib"></span></button>
      <button role="tab" data-v="risk"><span class="n">5</span><span data-i18n="tab_risk"></span></button>
      <button role="tab" data-v="compare"><span class="n">6</span><span data-i18n="tab_compare"></span></button>
      <button role="tab" data-v="methods"><span class="n">i</span><span data-i18n="tab_methods"></span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="note" id="basisBanner"></div>
  <!-- 0 INTRO -->
  <section class="view" id="v-intro">
    <h2 data-i18n="intro_h"></h2>
    <p class="lead" data-i18n-html="intro_lead"></p>
    <div class="steps">
      <div class="step"><div class="num">1</div><h3 data-i18n="s1_t"></h3><p data-i18n-html="s1_d"></p>
        <div class="row"><label><span data-i18n="bw"></span> <input id="introBw" type="number" min="10" max="200" step="1"> kg</label><label><span data-i18n="age"></span> <input id="introAge" type="number" min="1" max="110" step="1" placeholder="–"> <span data-i18n="yrs"></span></label></div></div>
      <div class="step"><div class="num">2</div><h3 data-i18n="s2_t"></h3><p data-i18n-html="s2_d"></p><div class="row"><button class="btn primary" data-go="diet" data-i18n="s2_b"></button></div></div>
      <div class="step"><div class="num">3</div><h3 data-i18n="s3_t"></h3><p data-i18n-html="s3_d"></p><div class="row"><button class="btn" data-go="days" data-i18n="s3_b"></button></div></div>
      <div class="step"><div class="num">4</div><h3 data-i18n="s4_t"></h3><p data-i18n-html="s4_d"></p><div class="row"><button class="btn" data-go="expo" data-i18n="s4_b"></button></div></div>
      <div class="step"><div class="num">5</div><h3 data-i18n="s5_t"></h3><p data-i18n-html="s5_d"></p><div class="row"><button class="btn" data-go="contrib" data-i18n="s5_b"></button></div></div>
      <div class="step"><div class="num">6</div><h3 data-i18n="s6_t"></h3><p data-i18n-html="s6_d"></p><div class="row"><button class="btn" data-go="risk" data-i18n="s6_b"></button></div></div>
      <div class="step"><div class="num">7</div><h3 data-i18n="s7_t"></h3><p data-i18n-html="s7_d"></p><div class="row"><button class="btn" data-go="compare" data-i18n="s7_b"></button></div></div>
      <div class="step"><div class="num">8</div><h3 data-i18n="s8_t"></h3><p data-i18n-html="s8_d"></p><div class="row"><button class="btn" data-go="methods" data-i18n="s8_b"></button></div></div>
    </div>
    <div class="two">
      <div class="card small sec" data-i18n-html="good_html"></div>
      <div class="card small sec" data-i18n-html="discuss_html"></div>
    </div>
  </section>

  <!-- 1 DIET -->
  <section class="view" id="v-diet">
    <h2 data-i18n="diet_h"></h2>

 m1:"<p>Para cada sustancia <i>s</i>: <code>E<sub>s</sub> = Σ<sub>f</sub> (consumo<sub>f</sub> [g/día] × C<sub>f,s</sub> [ng/g]) / peso [kg]</code>. C<sub>f,s</sub> es la media de todas las muestras regionales/nacionales de EAT2 para ese alimento. Las sumas de congéneres (HAP4, PFAS4, PBDE, EQT) se calculan muestra a muestra antes de promediar.</p>",

 m2:"<p>«ND (x)», «&lt; x» → no detectado (x = LOD): LB = 0, MB = LOD/2, UB = LOD. «NQ (x)» → detectado no cuantificado (x = LOQ): LB = 0, MB = LOQ/2, UB = LOQ. Cuando no se indica el límite se usa el de la hoja «Limites analytiques» (acrilamida LOD 4 / LOQ 10 µg/kg; DON 3/10 µg/kg en sólidos y 0,3/1 en líquidos). «NR» o celda vacía = no analizado (se excluye, no se pone a 0).</p>",
 m3_s:"3. Selección de sustancias y agregación",
 m3:"<p><b>Criterio de selección:</b> sustancias cuantificadas en al menos el 10 % de las muestras analizadas en la EAT2 (para los metales, el 10 % de los alimentos de la hoja docente). Quedan fuera por baja frecuencia: PFAS (PFOS 9 %, resto &lt; 5 %), ocratoxina A (0,5 %), clorpirifós (1,2 %), carbendazima (0,5 %), dimetoato (0,3 %) y nitritos (3,7 %). El arsénico total, aunque frecuente, no se evalúa porque en el pescado es casi todo arsenobetaína, no tóxica.</p><ul><li><b>Cd, Hg, Pb</b>: valores de elementos traza de EAT2 incluidos en la calculadora original (45 alimentos, µg/kg). Celdas vacías interpretadas como &lt; LOD (Cd 0,5; Hg 5; Pb 2,5 µg/kg). El Hg total se compara con la TWI del metilmercurio (conservador fuera del pescado).</li><li><b>Sumas</b>: HAP4 = BaP + BaA + BbF + CHR; PBDE = Σ BDE-28, 47, 99, 100, 153, 154, 183; HBCDD = α + β + γ; PCB no dioxínicos = PCB 28, 52, 101, 138, 153, 180; dioxinas + PCB-DL en EQT-OMS 2005; isoflavonas = daidzeína + genisteína + gliciteína; lignanos = secoisolariciresinol + enterolactona.</li><li><b>Plaguicidas y aditivos</b> (mg/kg × 1000). Sulfitos expresados como SO₂. Para los fitoestrógenos solo se indica «NQ»: se usa el extremo superior del rango de LOQ (estimación UB conservadora).</li><li><b>Bisfenol A</b>: campaña ANSES/LABERCA sobre las muestras EAT2 + aguas embotelladas (LHN). Muestras de 2007–2009, anteriores a la prohibición francesa del BPA en envases alimentarios (2015).</li></ul>",
 m4_s:"4. Caracterización del riesgo y mezclas",
 m4:"<p>Sustancias con valor basado en salud (TDI/TWI/ADI): RQ = E / VBS; se muestra el % del VBS. Sustancias evaluadas con margen de exposición: MOE = BMDL / E; preocupación si MOE &lt; umbral (10 000 para carcinógenos genotóxicos, 10 para Pb, 25 para PBDE según EFSA 2024). Para combinarlas se usa RQ = umbral / MOE. HI = Σ RQ de las sustancias con umbral (nivel 0, guía MixTox de EFSA 2019); los carcinógenos genotóxicos no se suman al HI sino que se combinan con MOE<sub>T</sub> = 1/Σ(1/MOE<sub>i</sub>). Los grupos de nivel 1 son una simplificación pedagógica de los grupos de evaluación acumulativa.</p><p><b>Limitaciones:</b> 1 día ≠ exposición habitual; datos de 2007–2009; no todas las sustancias se analizaron en todos los alimentos; solo exposición alimentaria (sin agua de bebida para la mayoría de sustancias, aire, polvo…).</p>",

 intro_h:"Bienvenido/a a MixExpo",
 intro_lead:"MixExpo estima cuánto ingieres de 17 sustancias químicas a través de la dieta y qué significa para la salud cuando se combinan. Utiliza las concentraciones medidas en el <b>segundo Estudio de Dieta Total francés</b> (ANSES), en alimentos preparados «tal como se consumen». Sigue los pasos; todo funciona en tu navegador y no se envía nada.",
 s1_t:"Descríbete",
 s1_d:"La exposición se expresa por kilo de peso corporal: indica tu <b>peso</b>. La <b>edad</b> es opcional: por debajo de 12 años se usa el valor más estricto de isoflavonas para niños. Las porciones y los ejemplos están pensados para adultos.",
 s2_t:"Registra tu dieta de 24 h",
 s2_d:"En <b>Mi dieta 24 h</b>, anota todo lo que comiste y bebiste ayer, comida por comida: busca un alimento e indica porciones o gramos. Para empezar se carga un ejemplo equilibrado (PNNS); vacíalo o carga otro ejemplo.",

 s8_b:"Ir a Métodos y datos",
 good_html:"<h3>Para tener en cuenta</h3><ul><li>Uso <b>exclusivamente docente</b>: no es una herramienta de diagnóstico.</li><li>Tus datos se quedan en <b>este navegador</b>; en un ordenador compartido, vacía la dieta al terminar.</li><li>Las concentraciones son de <b>2007–2009</b> y se midieron en alimentos preparados para su consumo.</li><li>Las 17 sustancias se eligieron porque se <b>cuantificaron en al menos el 10 %</b> de las muestras del estudio.</li><li>Los valores de referencia son para una <b>exposición de por vida</b>: un día por encima no supone, en sí mismo, un riesgo.</li></ul>",
 discuss_html:"<h3>Preguntas para explorar</h3><ul><li>¿La sustancia a la que más te expones es también la más peligrosa? ¿Por qué no?</li><li>¿Qué conclusiones cambian entre LB y UB? ¿Qué dice eso de los métodos analíticos?</li><li>Sustituye un alimento (p. ej. conserva por fresco, atún por otro pescado): ¿qué cambia y qué no?</li><li>¿Cómo se compara tu media de varios días con tu peor día?</li><li>Cambia el valor de referencia del bisfenol A del BfR a la EFSA: ¿cuánto depende la conclusión de la caracterización del peligro?</li></ul>",
},

 censor_note:"<b>LB / MB / UB.</b> When an analysis does not detect a substance (&lt; LOD) or cannot quantify it (&lt; LOQ), its true value is unknown. <b>LB</b> (lower bound) replaces it by 0, <b>MB</b> by LOD/2 (or LOQ/2) and <b>UB</b> (upper bound) by the LOD (or LOQ). A result that exceeds the reference only under UB is <i>uncertain</i>: it reflects analytical sensitivity more than actual contamination.",

 risk_lead:"Substances do not act in isolation. EFSA’s 2019 guidance on combined exposure proposes a tiered approach: first add up the risk quotients of everything (<b>hazard index, HI</b>, very conservative) and, if HI ≥ 1, refine by grouping substances that share a toxic effect (<b>assessment groups</b>).",

 m_lead:"Concentrations: <b>Second French Total Diet Study (TDS2 / EAT2, ANSES 2011)</b>, 2007–2009, foods analysed “as consumed” (composite samples of 15 sub-samples, 8 regions). Open data: <a href='https://www.data.gouv.fr/datasets/donnees-regionales-eat2-etude-de-l-alimentation-totale/' target='_blank' rel='noopener'>data.gouv.fr</a>. Bisphenol A: <a href='https://www.data.gouv.fr/datasets/bisphenol-a' target='_blank' rel='noopener'>ANSES/LABERCA, data.gouv.fr</a>.",

 m1_s:"1. Exposure calculation",
 m1:"<p>For each substance <i>s</i>: <code>E<sub>s</sub> = Σ<sub>f</sub> (intake<sub>f</sub> [g/day] × C<sub>f,s</sub> [ng/g]) / body weight [kg]</code>. C<sub>f,s</sub> is the mean of all regional/national TDS2 samples of that food. Congener sums (PAH4, PFAS4, PBDE, TEQ) are computed sample by sample before averaging.</p>",
 m2_s:"2. Left-censored data (LB / MB / UB)",
 m2:"<p>“ND (x)”, “&lt; x” → not detected (x = LOD): LB = 0, MB = LOD/2, UB = LOD. “NQ (x)” → detected, not quantified (x = LOQ): LB = 0, MB = LOQ/2, UB = LOQ. When no limit is given, the “Limites analytiques” sheet is used (acrylamide LOD 4 / LOQ 10 µg/kg; DON 3/10 µg/kg in solids, 0.3/1 in liquids). “NR” or empty = not analysed (excluded, not set to 0).</p>",
 m3_s:"3. Selection of substances and aggregation",
 m3:"<p><b>Selection criterion:</b> substances quantified in at least 10 % of the samples analysed in TDS2 (for metals, 10 % of the foods in the teaching sheet). Left out because rarely quantified: PFAS (PFOS 9 %, others &lt; 5 %), ochratoxin A (0.5 %), chlorpyrifos (1.2 %), carbendazim (0.5 %), dimethoate (0.3 %) and nitrites (3.7 %). Total arsenic, although frequent, is not assessed because in fish it is almost entirely non-toxic arsenobetaine.</p><ul><li><b>Cd, Hg, Pb</b>: TDS2 trace-element values included in the original spreadsheet calculator (45 foods, µg/kg). Empty cells taken as &lt; LOD (Cd 0.5; Hg 5; Pb 2.5 µg/kg). Total Hg is compared with the methylmercury TWI (conservative outside fish).</li><li><b>Sums</b>: PAH4 = BaP + BaA + BbF + CHR; PBDEs = Σ BDE-28, 47, 99, 100, 153, 154, 183; HBCDD = α + β + γ; non-dioxin-like PCBs = PCB 28, 52, 101, 138, 153, 180; dioxins + dl-PCBs as WHO-2005 TEQ; isoflavones = daidzein + genistein + glycitein; lignans = secoisolariciresinol + enterolactone.</li><li><b>Pesticides and additives</b> (mg/kg × 1000). Sulfites expressed as SO₂. For phytoestrogens only “NQ” is reported: the upper end of the LOQ range is used (conservative UB).</li><li><b>Bisphenol A</b>: ANSES/LABERCA campaign on TDS2 samples + bottled waters (LHN). Samples from 2007–2009, before the French ban of BPA in food packaging (2015).</li></ul>",
 m4_s:"4. Risk characterisation and mixtures",
 m4:"<p>Substances with a health-based guidance value (TDI/TWI/ADI): RQ = E / HBGV; shown as % of HBGV. Substances assessed by margin of exposure: MOE = BMDL / E; concern if MOE &lt; threshold (10,000 for genotoxic carcinogens, 10 for Pb, 25 for PBDEs per EFSA 2024). To combine them, RQ = threshold / MOE. HI = Σ RQ of threshold substances (tier 0, EFSA 2019 MixTox guidance); genotoxic carcinogens are not added to the HI but combined as MOE<sub>T</sub> = 1/Σ(1/MOE<sub>i</sub>). Tier-1 groups are a teaching simplification of cumulative assessment groups.</p><p><b>Limitations:</b> 1 day ≠ usual exposure; data from 2007–2009; not every substance was analysed in every food; diet only (no drinking water for most substances, air, dust…).</p>",
 m5_s:"5. Analytical coverage of the catalogue",
 m5:"<p>Number of foods in this tool’s TDS2 catalogue with data for each substance.</p>",

 intro_h:"Welcome to MixExpo",
 intro_lead:"MixExpo estimates how much of 17 food chemicals you take in through your diet, and what this means for health when they are combined. It uses the concentrations measured in the <b>second French Total Diet Study</b> (ANSES), in foods prepared “as eaten”. Follow the steps below; everything runs in your browser and nothing is sent anywhere.",
 s1_t:"Describe yourself",
 s1_d:"Exposure is expressed per kilogram of body weight, so enter your <b>weight</b>. Your <b>age</b> is optional: under 12, the stricter isoflavone value for children is used. Portions and examples are designed for adults.",
 s2_t:"Record your 24 h diet",
 s2_d:"In <b>My 24 h diet</b>, list everything you ate and drank yesterday, meal by meal: search a food, then set portions or grams. A balanced example (PNNS) is loaded to start with; clear it or load another example.",
 s2_b:"Go to My 24 h diet",
 s3_t:"Add more days (optional)",
 s3_d:"In <b>Several days</b>, add up to 7 days to approach your usual (chronic) intake, follow the trajectory day by day and compare each day with the mean.",
 s3_b:"Go to Several days",
 s4_t:"Look at your exposure",
 s4_d:"<b>Exposure</b> shows how much of each chemical you take in (left) and how this compares with its reference value (right). Switch between LB, MB and UB to see the effect of non-detected results.",
 s4_b:"Go to Exposure",
 s5_t:"Find the foods responsible",
 s5_d:"<b>Contributing foods</b> shows which foods drive each exposure. Hatched cells mean the chemical was not analysed in that food.",
 s5_b:"Go to Contributing foods",
 s6_t:"Assess the mixture",
 s6_d:"<b>Risk & mixtures</b> adds up the risk quotients (hazard index), groups chemicals with a common effect, and combines the genotoxic carcinogens.",
 s6_b:"Go to Risk & mixtures",
 s7_t:"Change your choices",
 s7_d:"In <b>Compare scenarios</b>, save your diet, modify it (fish, bread, canned or fresh foods, drinks…) and compare up to 4 versions.",
 s7_b:"Go to Compare scenarios",
 s8_t:"Save and understand",
 s8_d:"Export your results (CSV) or your diet (JSON) from the Compare tab, and read <b>Methods & data</b> for the sources, assumptions and reference values.",
 s8_b:"Go to Methods & data",
 good_html:"<h3>Good to know</h3><ul><li>For <b>teaching only</b>: not a diagnostic tool.</li><li>Your data stay in <b>this browser</b>; on a shared computer, clear the diet when you finish.</li><li>Concentrations date from <b>2007–2009</b> and were measured in foods as prepared for eating.</li><li>The 17 chemicals were chosen because they were <b>quantified in at least 10 %</b> of the study’s samples.</li><li>Reference values are for <b>lifetime exposure</b>: one day above a reference value is not, in itself, a health risk.</li></ul>",
 discuss_html:"<h3>Questions to explore</h3><ul><li>Is the chemical you are most exposed to also the riskiest one? Why not?</li><li>Which conclusions change between LB and UB? What does that say about analytical methods?</li><li>Replace one food (e.g. canned by fresh, tuna by another fish): what changes, and what does not?</li><li>How does your mean over several days compare with your worst day?</li><li>Change the bisphenol A reference value from BfR to EFSA: how much does the conclusion depend on hazard characterisation?</li></ul>",

 m1_s:"1. Calcul de l’exposition",
 m1:"<p>Pour chaque substance <i>s</i> : <code>E<sub>s</sub> = Σ<sub>f</sub> (consommation<sub>f</sub> [g/j] × C<sub>f,s</sub> [ng/g]) / poids [kg]</code>. C<sub>f,s</sub> est la moyenne de tous les échantillons régionaux/nationaux EAT2 de l’aliment. Les sommes de congénères (HAP4, PFAS4, PBDE, TEQ) sont calculées échantillon par échantillon avant moyenne.</p>",
 m2_s:"2. Données censurées (LB / MB / UB)",
 m2:"<p>« ND (x) », « &lt; x » → non détecté (x = LD) : LB = 0, MB = LD/2, UB = LD. « NQ (x) » → détecté non quantifié (x = LQ) : LB = 0, MB = LQ/2, UB = LQ. Si la limite n’est pas indiquée, on utilise l’onglet « Limites analytiques » (acrylamide LD 4 / LQ 10 µg/kg ; DON 3/10 µg/kg en solide, 0,3/1 en liquide). « NR » ou vide = non analysé (exclu, pas mis à 0).</p>",
 m3_s:"3. Sélection des substances et agrégation",
 m3:"<p><b>Critère de sélection :</b> substances quantifiées dans au moins 10 % des échantillons analysés dans l’EAT2 (pour les métaux, 10 % des aliments de la feuille pédagogique). Écartés car rarement quantifiés : PFAS (PFOS 9 %, autres &lt; 5 %), ochratoxine A (0,5 %), chlorpyriphos (1,2 %), carbendazime (0,5 %), diméthoate (0,3 %) et nitrites (3,7 %). L’arsenic total, bien que fréquent, n’est pas évalué car dans le poisson il s’agit presque entièrement d’arsénobétaïne, non toxique.</p><ul><li><b>Cd, Hg, Pb</b> : valeurs d’éléments traces EAT2 incluses dans le calculateur Excel d’origine (45 aliments, µg/kg). Cellules vides considérées &lt; LD (Cd 0,5 ; Hg 5 ; Pb 2,5 µg/kg). Le Hg total est comparé à la DHT du méthylmercure (conservateur hors poisson).</li><li><b>Sommes</b> : HAP4 = BaP + BaA + BbF + CHR ; PBDE = Σ BDE-28, 47, 99, 100, 153, 154, 183 ; HBCDD = α + β + γ ; PCB non dioxine-like = PCB 28, 52, 101, 138, 153, 180 ; dioxines + PCB-DL en TEQ-OMS 2005 ; isoflavones = daidzéine + génistéine + glycitéine ; lignanes = sécoisolaricirésinol + entérolactone.</li><li><b>Pesticides et additifs</b> (mg/kg × 1000). Sulfites exprimés en SO₂. Pour les phyto-œstrogènes seul « NQ » est indiqué : on retient la borne haute de la plage de LQ (UB conservatrice).</li><li><b>Bisphénol A</b> : campagne ANSES/LABERCA sur les échantillons EAT2 + eaux embouteillées (LHN). Échantillons 2007–2009, antérieurs à l’interdiction française du BPA dans les contenants alimentaires (2015).</li></ul>",
 m4_s:"4. Caractérisation du risque et mélanges",
 m4:"<p>Substances avec valeur toxicologique de référence (DJT/DHT/DJA) : QR = E / VTR ; affiché en % de la VTR. Substances évaluées par marge d’exposition : MOE = BMDL / E ; préoccupation si MOE &lt; seuil (10 000 pour les cancérogènes génotoxiques, 10 pour le Pb, 25 pour les PBDE selon l’EFSA 2024). Pour les combiner : QR = seuil / MOE. HI = Σ QR des substances à seuil (palier 0, guide MixTox EFSA 2019) ; les cancérogènes génotoxiques ne sont pas ajoutés au HI mais combinés via MOE<sub>T</sub> = 1/Σ(1/MOE<sub>i</sub>). Les groupes du palier 1 sont une simplification pédagogique des groupes d’évaluation cumulée.</p><p><b>Limites :</b> 1 jour ≠ exposition habituelle ; données 2007–2009 ; toutes les substances n’ont pas été analysées dans tous les aliments ; voie alimentaire uniquement (pas d’eau de boisson pour la plupart des substances, air, poussières…).</p>",

/* ---------------------------------------------------------------- state */
const PRESETS_DAYS = {

const byFr = {}; FOODS.forEach(f => byFr[f.fr] = f);
const byId = {}; FOODS.forEach(f => byId[f.id] = f);
const LS = "mixexpo.v2";
const packM = m => { const o={}; MEALS.forEach(k=>o[k]=(m[k]||[]).map(it=>({fr:byId[it.id].fr, g:+it.g}))); return o; };
const unpackM = m => { const o={}; MEALS.forEach(k=>o[k]=[]); MEALS.forEach(k=>((m&&m[k])||[]).forEach(it=>{ const f=byFr[it.fr||it.food]; if(f) o[k].push({id:f.id, g:+it.g||0}); })); return o; };
function store(){ try{ localStorage.setItem(LS, JSON.stringify({bw:S.bw,age:S.age,basis:S.basis,traj:S.traj,extra:S.extra.map(packM),bound:S.bound,meals:packM(S.meals),scen:S.scen.map(x=>({name:x.name,bw:x.bw,meals:packM(x.meals)})),rp:S.rp,all:S.all,sort:S.sort})); }catch(e){} }
function emptyMeals(){ const m={}; MEALS.forEach(k=>m[k]=[]); return m; }
const MAXDAYS = 7;
let S = {lang:"en", bw:70, bound:"lb", meals:emptyMeals(), scen:[], rp:{}, all:false, view:"intro", sel:"Cd", sort:"fam", extra:[], dsel:0, basis:"day", age:null, traj:"HI"};
try{ const s = JSON.parse(localStorage.getItem(LS)||"null"); if(s){ Object.assign(S, s); S.meals = unpackM(s.meals); S.scen = (s.scen||[]).map(x=>({name:x.name,bw:x.bw,meals:unpackM(x.meals)})); S.extra = (s.extra||[]).slice(0,MAXDAYS-1).map(unpackM); S.view="intro"; S.dsel=0; } }catch(e){ S.meals = emptyMeals(); S.scen = []; S.extra = []; }
if(!S.meals || !Object.values(S.meals).some(a=>a.length)) { if(!localStorage.getItem || true) {} }

function subs(){
  return SUBS_DEFAULT.map(s => {
    const o = Object.assign({}, s);
    if(s.k==="ISO" && S.age && S.age < 12) o.rp = 10000;   // ANSES 2025: 0.01 mg/kg bw/day for prepubertal children
    return Object.assign(o, S.rp[s.k]||{});

}
const allDays = () => [S.meals, ...S.extra];
function dayMeals(d){ return d===0 ? S.meals : S.extra[d-1]; }
function meanMeals(){
  const D = allDays(), N = D.length, o = emptyMeals();
  D.forEach(m => MEALS.forEach(k => (m[k]||[]).forEach(it => o[k].push({id:it.id, g:it.g/N}))));
  return o;
}
const useMean = () => S.basis==="mean" && S.extra.length>0;
const analysed = () => useMean() ? meanMeals() : S.meals;
function loadPreset(p){ const o = emptyMeals(); MEALS.forEach(m => (p[m]||[]).forEach(([fr,g]) => { const f = byFr[fr]; if(f) o[m].push({id:f.id, g}); })); return o; }
const t = k => (I18N[S.lang][k] ?? I18N.en[k] ?? k);
const fname = f => f[S.lang] || f.fr;
const sname = k => SUBTXT[k].n[S.lang];
const shname = k => SUBTXT[k].sh ? SUBTXT[k].sh[S.lang] : SUBTXT[k].n[S.lang];
const famOf = k => SUBS_DEFAULT.find(x=>x.k===k).fam;
const famColor = f => `var(--fam-${f})`;
const fdot = k => `<i class="fdot" style="background:${famColor(famOf(k))}"></i>`;
const famLegend = () => `<div class="famleg">${FAMS.map(f=>`<span><i class="fdot" style="background:${famColor(f)}"></i>${esc(t("fam_"+f))}</span>`).join("")}</div>`;
const unitOf = s => (s.u==="pg" ? "pg TEQ/kg bw/d" : "ng/kg bw/d").replace("bw", S.lang==="en"?"bw":"pc").replace("/d", S.lang==="en"?"/day":(S.lang==="es"?"/día":"/j"));

/* ---------------------------------------------------------------- core computation */
// TDS2 occurrence: % of analysed samples with a quantified value (any component for sums)
function occurrence(k){ let n=0, q=0; FOODS.forEach(f=>{ const c=f.c[k]; if(c){ n+=c[3]; q+=c[4]; } }); return n ? q/n*100 : null; }
function compute(meals, bw){
  const SU = subs();
  const intake = {};           // food id -> grams
  MEALS.forEach(m => (meals[m]||[]).forEach(it => { if(it.g>0) intake[it.id] = (intake[it.id]||0) + it.g; }));
  const foods = Object.keys(intake).map(Number);
  const res = {intake, foods, grams: foods.reduce((a,id)=>a+intake[id],0), S:{}};
  SU.forEach(s => {
    const E = {lb:0, mb:0, ub:0}, contrib = {}, missing = [];
    foods.forEach(id => {
      const c = byId[id].c[s.k];
      if(!c){ missing.push(id); return; }
      const g = intake[id];
      E.lb += g*c[0]/bw; E.mb += g*c[1]/bw; E.ub += g*c[2]/bw;
      contrib[id] = {lb:g*c[0]/bw, mb:g*c[1]/bw, ub:g*c[2]/bw};
    });
    const rq = b => s.type==="NONE" ? 0 : (s.type==="HBGV" ? E[b]/s.rp : E[b]*s.thr/s.rp);
    const RQ = {lb:rq("lb"), mb:rq("mb"), ub:rq("ub")};
    const status = s.type==="NONE" ? "na" : (RQ.ub < 1 ? "ok" : (RQ.lb >= 1 ? "hi" : "unc"));
    res.S[s.k] = {s, E, RQ, contrib, missing, status};
  });
  return res;
}
// Tier-0 hazard index: threshold substances only (genotoxic carcinogens are combined with MOET instead)
function hi(res, b, keys){ return (keys||Object.keys(res.S).filter(k=>res.S[k].s.grp!=="carc")).reduce((a,k)=>a+res.S[k].RQ[b],0); }
function moet(res, b){ const inv = Object.values(res.S).filter(r=>r.s.grp==="carc").reduce((a,r)=>a + r.E[b]/r.s.rp, 0); return inv>0 ? 1/inv : Infinity; }
function moetStatus(res){ const thr = 10000; return moet(res,"ub")>=thr ? "ok" : (moet(res,"lb")<thr ? "hi" : "unc"); }
function hiStatus(res, keys){ return hi(res,"ub",keys)<1 ? "ok" : (hi(res,"lb",keys)>=1 ? "hi" : "unc"); }
function cw(el, fallback){ const w = el.clientWidth; return w>200 ? Math.round(w) : fallback; }

/* ---------------------------------------------------------------- formatting */
function fmt(x, d){
  if(!isFinite(x)) return "∞";
  if(x===0) return "0";
  const loc = S.lang==="en" ? "en-GB" : (S.lang==="fr"?"fr-FR":"es-ES");
  const a = Math.abs(x);
  let opts;
  if(d!==undefined) opts={maximumFractionDigits:d, minimumFractionDigits:0};
  else if(a>=1000) opts={maximumFractionDigits:0};
  else if(a>=10) opts={maximumFractionDigits:1};
  else if(a>=0.01) opts={maximumSignificantDigits:3};
  else opts={maximumSignificantDigits:2};
  return x.toLocaleString(loc, opts);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function statusHTML(st){ const ic={ok:"✓",unc:"?",hi:"!",na:"–"}[st]; return `<span class="status st-${st}"><span class="dot">${ic}</span>${t("st_"+st)}</span>`; }
function metricText(r){
  const s=r.s, b=S.bound;
  if(s.type==="NONE") return "–";
  if(s.type==="HBGV") return fmt(r.RQ[b]*100) + " %";
  const moe = s.rp / r.E[b];
  return "MOE " + (isFinite(moe) ? fmt(moe) : "–");
}
function refText(s){
  if(s.type==="NONE") return `<span class="muted">${esc(t("no_ref"))}</span>`;
  if(s.type==="HBGV") return `${fmt(s.rp)} ${unitOf(s)}`;
  return `BMDL ${fmt(s.rp)} ${unitOf(s)} · MOE ≥ ${fmt(s.thr)}`;
}

/* ---------------------------------------------------------------- tooltip */
const tip = document.getElementById("tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest("[data-tip]");
  if(!el){ tip.style.opacity=0; return; }
  tip.innerHTML = el.getAttribute("data-tip");
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if(x + w > innerWidth - 8) x = e.clientX - w - 14;
  if(y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x+"px"; tip.style.top = y+"px"; tip.style.opacity = 1;
});

/* ---------------------------------------------------------------- charts (hand-made SVG, no dependencies) */
const LOGMIN = -3, LOGMAX = 3;   // RQ axis 0.001 … 100
function lx(v, x0, w){ const l = Math.log10(Math.max(v, Math.pow(10,LOGMIN))); return x0 + (Math.min(l,LOGMAX)-LOGMIN)/(LOGMAX-LOGMIN)*w; }
function logAxis(x0, w, y0, y1, compact){
  let g = "";
  for(let p=LOGMIN; p<=LOGMAX; p++){
    const x = lx(Math.pow(10,p), x0, w);
    g += `<line class="gl" x1="${x}" x2="${x}" y1="${y0}" y2="${y1}"/>`;
    const lab = p<0 ? (compact? "10"+superscript(p) : fmt(Math.pow(10,p))) : fmt(Math.pow(10,p));
    g += `<text x="${x}" y="${y1+14}" text-anchor="middle">${lab}</text>`;
  }
  const xt = lx(1, x0, w);
  g += `<line class="thr" x1="${xt}" x2="${xt}" y1="${y0-4}" y2="${y1}"/>`;
  return g;
}
function superscript(n){ const m={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"}; return String(n).split("").map(c=>m[c]).join(""); }
const STC = {ok:"var(--good)", unc:"var(--warning)", hi:"var(--critical)"};

function expoNg(r, b){ return r.E[b] * (r.s.u==="pg" ? 0.001 : 1); }   // dioxin TEQ pg -> ng for a common axis
function sortedSubs(res, mode){
  const SU = subs(), b = S.bound;
  if(mode==="expo") return SU.slice().sort((x,y)=>expoNg(res.S[y.k],b)-expoNg(res.S[x.k],b));
  if(mode==="rq")   return SU.slice().sort((x,y)=>res.S[y.k].RQ[b]-res.S[x.k].RQ[b]);
  return SU;
}
function lpos(v, lo, hi, x0, w){ const l = Math.log10(Math.max(v, Math.pow(10,lo))); return x0 + (Math.min(l,hi)-lo)/(hi-lo)*w; }
function decAxis(lo, hi, x0, w, y0, y1, compact){
  const step = (compact || (hi-lo) > 6) ? 2 : 1; let g = "";
  for(let p=Math.ceil(lo/step)*step; p<=hi; p+=step){
    const x = lpos(Math.pow(10,p), lo, hi, x0, w);
    const lab = p===0 ? "1" : ((compact || p<-2 || p>3) ? "10"+superscript(p) : fmt(Math.pow(10,p)));
    g += `<line class="gl" x1="${x}" x2="${x}" y1="${y0}" y2="${y1}"/><text x="${x}" y="${y1+14}" text-anchor="middle">${lab}</text>`;
  }
  return g;
}
function whisker(x1, x2, cy, dashed){
  if(x2-x1 <= 1) return "";
  const st = `stroke="var(--text-primary)" stroke-width="1.2" pointer-events="none"`;
  return `<line x1="${x1}" x2="${x2}" y1="${cy}" y2="${cy}" ${st} ${dashed?'stroke-dasharray="3 2"':""}/>` + (dashed ? "" : `<line x1="${x1}" x2="${x1}" y1="${cy-4}" y2="${cy+4}" ${st}/>`) + `<line x1="${x2}" x2="${x2}" y1="${cy-4}" y2="${cy+4}" ${st}/>`;
}
/* Two aligned panels sharing the substance labels: left = how much (exposure, coloured by chemical family),
   right = how risky (RQ, coloured by status). When sorted by family, rows are grouped with a family header. */
function dualChart(el, res, opts={}){
  const b = S.bound, sort = opts.sort||"fam", SU = sortedSubs(res, sort), compact = !!opts.compact;
  const W = cw(el, opts.w || 760), lab = opts.labW || 190, gap = compact ? 18 : 48, padR = 12;
  const rowH = opts.rowH || 26, headH = sort==="fam" ? (compact ? 6 : 22) : 0, top = compact ? 22 : 40;
  // layout rows (with family headers / gaps)
  const rows = []; let y = top, prevFam = null;
  SU.forEach(s => { if(sort==="fam" && s.fam!==prevFam){ rows.push({head:s.fam, y}); y += headH; prevFam = s.fam; } rows.push({s, y}); y += rowH; });
  const yEnd = y, H = yEnd + 22;
  const colW = (W - lab - gap - padR) / 2, xa = lab, xb = lab + colW + gap;
  const vals = SU.flatMap(s => ["lb","ub",b].map(k => expoNg(res.S[s.k], k))).filter(v => v > 0);
  let lo = vals.length ? Math.floor(Math.log10(Math.min(...vals))) : -3, hi = vals.length ? Math.ceil(Math.log10(Math.max(...vals))) : 3;
  lo = Math.max(lo, -7); if(hi - lo < 4) lo = hi - 4;
  const rlo = LOGMIN, rhi = LOGMAX;
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("dual_expo")+" / "+t("dual_rq"))}">`;
  g += `<text class="lbl" x="${xa}" y="14" style="font-weight:600">${esc(t(compact?"dual_expo_s":"dual_expo"))}</text>`;
  g += `<text class="lbl" x="${xb}" y="14" style="font-weight:600">${esc(t(compact?"dual_rq_s":"dual_rq"))}</text>`;
  if(!compact) g += `<text x="${xa}" y="29">${esc(t("dual_expo_sub"))}</text><text x="${xb}" y="29">${esc(t("dual_rq_sub"))}</text>`;
  g += decAxis(lo, hi, xa, colW, top, yEnd, compact) + decAxis(rlo, rhi, xb, colW, top, yEnd, compact);
  const x1 = lpos(1, rlo, rhi, xb, colW);
  g += `<line class="thr" x1="${x1}" x2="${x1}" y1="${top-4}" y2="${yEnd}"/>`;
  rows.forEach(row => {
    if(row.head){
      if(!compact) g += `<rect x="0" y="${row.y+6}" width="10" height="10" rx="3" fill="${famColor(row.head)}"/><text x="16" y="${row.y+15}" style="font-size:11px;font-weight:600;letter-spacing:.02em">${esc(t("fam_"+row.head))}</text>`;
      return;
    }
    const s = row.s, r = res.S[s.k], cy = row.y + rowH/2, bh = Math.min(12, rowH - 9);
    const e = expoNg(r, b), q = r.RQ[b], fc = famColor(s.fam), lbZero = r.RQ.lb === 0 && r.RQ.ub > 0;
    const tipTxt = `<b>${esc(sname(s.k))}</b> · ${esc(t("fam_"+s.fam))}<br>${t("tip_expo")} (${b.toUpperCase()}): ${fmt(r.E[b])} ${unitOf(s)}<br>LB–UB: ${fmt(r.E.lb)} – ${fmt(r.E.ub)}<br>${t("tip_rq")}: ${fmt(q)} · ${metricText(r)}<br>${t("st_"+r.status)}${lbZero?"<br><i>"+esc(t("lb_zero"))+"</i>":""}`;
    g += `<rect class="hit" x="0" y="${row.y}" width="${W}" height="${rowH}" data-tip="${esc(tipTxt)}"/>`;
    g += `<text class="lbl" x="${lab-22}" y="${cy+4}" text-anchor="end" pointer-events="none">${esc(compact ? trunc(shname(s.k),26) : shname(s.k))}</text>`;
    g += `<rect x="${lab-16}" y="${cy-5}" width="10" height="10" rx="3" fill="${fc}" pointer-events="none"/>`;
    // exposure panel (family colour)
    if(res.foods.length && r.missing.length === res.foods.length){
      g += `<text x="${xa+4}" y="${cy+4}" style="font-style:italic">${esc(t(compact?"not_in_diet_s":"not_in_diet"))}</text>`;
      if(s.type!=="NONE") g += `<text x="${xb+4}" y="${cy+4}" style="font-style:italic">–</text>`;
      return;
    }
    const xa0 = lpos(Math.pow(10,lo), lo, hi, xa, colW), xe = lpos(e, lo, hi, xa, colW);
    if(e > 0) g += `<rect x="${xa0}" y="${cy-bh/2}" width="${Math.max(2, xe-xa0)}" height="${bh}" rx="3" fill="${fc}" pointer-events="none"/>`;
    const eub = lpos(expoNg(r,"ub")||Math.pow(10,lo), lo, hi, xa, colW);
    g += whisker(lpos(expoNg(r,"lb")||Math.pow(10,lo), lo, hi, xa, colW), eub, cy, lbZero);
    if(lbZero && e === 0) g += `<circle cx="${eub}" cy="${cy}" r="4" fill="${fc}" stroke="var(--surface-1)" stroke-width="1.5" pointer-events="none"/>`;
    // risk panel (status colour)
    if(s.type==="NONE"){ g += `<text x="${xb+4}" y="${cy+4}" style="font-style:italic">${esc(t("no_ref"))}</text>`; return; }
    const xb0 = lpos(Math.pow(10,rlo), rlo, rhi, xb, colW), xq = lpos(q, rlo, rhi, xb, colW);
    if(q > 0) g += `<rect x="${xb0}" y="${cy-bh/2}" width="${Math.max(2, xq-xb0)}" height="${bh}" rx="3" fill="${STC[r.status]}" pointer-events="none"/>`;
    const rub = lpos(r.RQ.ub||Math.pow(10,rlo), rlo, rhi, xb, colW);
    g += whisker(lpos(r.RQ.lb||Math.pow(10,rlo), rlo, rhi, xb, colW), rub, cy, lbZero);
    if(lbZero && q === 0) g += `<circle cx="${rub}" cy="${cy}" r="4.5" fill="${STC[r.status]}" stroke="var(--surface-1)" stroke-width="1.5" pointer-events="none"/>`;
  });
  el.innerHTML = g + `</svg>`;
}
function bpaWarn(res, short){
  const s = subs().find(x=>x.k==="BPA"), E = res.S.BPA.E[S.bound];
  const EFSA = 0.2, BFR = 200, rqE = E/EFSA, rqB = E/BFR;
  const isEfsa = Math.abs(s.rp-EFSA) < 1e-9;
  if(short) return t(isEfsa ? "bpa_short_efsa" : "bpa_short");
  let h = t(isEfsa ? "bpa_warn_efsa" : "bpa_warn").replace("{rp}", fmt(s.rp));
  if(res.foods.length) h += " " + t("bpa_rq").replace("{rb}", fmt(rqB)).replace("{re}", fmt(rqE));
  return h;
}
function rankNote(res){
  const b = S.bound, SU = subs();
  const topE = SU.slice().sort((x,y)=>expoNg(res.S[y.k],b)-expoNg(res.S[x.k],b))[0];
  const topR = SU.slice().sort((x,y)=>res.S[y.k].RQ[b]-res.S[x.k].RQ[b])[0];
  if(!res.foods.length) return "";
  let h = t("rank_note").replace("{a}", esc(sname(topE.k))).replace("{ea}", fmt(res.S[topE.k].E[b])+" "+unitOf(topE)).replace("{b}", esc(sname(topR.k))).replace("{rb}", fmt(res.S[topR.k].RQ[b]));
  if(topE.k !== topR.k) h += " " + t("rank_diff");
  return h;
}
function barList(el, rows, opts={}){
  // rows: [{label, v (0..1 share or value), txt, tip}]
  const W = cw(el, opts.w || 520), lab = opts.labW || 200, rowH = 24, padR = 56, x0 = lab, w = W-lab-padR;
  const max = opts.max || Math.max(...rows.map(r=>r.v), 1e-12);
  const H = rows.length*rowH + 6;
  let g = `<svg viewBox="0 0 ${W} ${H}">`;
  rows.forEach((r,i)=>{
    const y = i*rowH, cy = y+rowH/2, bw = Math.max(2, r.v/max*w);
    g += `<rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}" ${r.tip?`data-tip="${esc(r.tip)}"`:""}/>`;
    g += `<text class="lbl" x="${lab-10}" y="${cy+4}" text-anchor="end" pointer-events="none">${esc(trunc(r.label, opts.trunc||30))}</text>`;
    g += `<rect x="${x0}" y="${cy-6}" width="${bw}" height="12" rx="3" fill="${r.color||"var(--series-1)"}" pointer-events="none"/>`;
    g += `<text x="${x0+bw+6}" y="${cy+4}" pointer-events="none">${esc(r.txt)}</text>`;
  });
  g += `</svg>`;
  el.innerHTML = g;
}
const trunc = (s,n) => s.length>n ? s.slice(0,n-1)+"…" : s;

/* ---------------------------------------------------------------- rendering: static text */
function applyI18n(){
  document.documentElement.lang = S.lang;

function covHTML(f){

}
function renderMeals(box, meals){
  box = box || document.getElementById("meals"); meals = meals || S.meals;
  box.innerHTML = MEALS.map(m => {
    const items = meals[m];
    const tot = items.reduce((a,it)=>a+(+it.g||0),0);

        return `<div class="item" data-i="${i}">
          <div class="nm"><b title="${esc(fname(f))}">${esc(fname(f))}</b><small>${esc(t("u_"+f.u))} ≈ ${f.g} g ${covHTML(f)}</small></div>
          <input type="number" class="por" min="0" step="0.5" value="${+por.toFixed(2)}" aria-label="${esc(t("portions"))}">
          <span class="unitlbl">×</span>
          <input type="number" class="gr" min="0" step="5" value="${Math.round(it.g*10)/10}" aria-label="${esc(t("grams"))}">
          <button class="x" title="${esc(t("remove"))}" aria-label="${esc(t("remove"))}">×</button></div>`; }).join("")
        : `<div class="empty">${esc(t("no_items"))}</div>`}</div>
      <div class="adder"><input type="text" class="search" placeholder="${esc(t("add_food"))}" autocomplete="off"><div class="dd"></div></div>
    </div>`;
  }).join("");
}
function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function searchFoods(q){
  const nq = norm(q.trim());
  let list = FOODS.filter(f => S.all || f.core);
  if(nq) list = FOODS.filter(f => (S.all||f.core||nq.length>=3) && [f.es,f.en,f.fr].some(n=>norm(n).includes(nq)));
  const out = {};
  CATS.forEach(c=>out[c]=[]);
  list.forEach(f=>out[f.cat].push(f));
  CATS.forEach(c=>out[c].sort((a,b)=>fname(a).localeCompare(fname(b))));
  return out;
}
function openDD(input){
  const dd = input.nextElementSibling;
  const groups = searchFoods(input.value);
  let h = "";
  CATS.forEach(c => { if(!groups[c].length) return;
    h += `<div class="grp">${esc(t("cat_"+c))}</div>` + groups[c].map(f=>`<div class="opt" data-id="${f.id}"><span>${esc(fname(f))}${S.lang!=="fr"?` <small>· ${esc(f.fr)}</small>`:""}</span><small>${f.g} g${f.c.Cd?"":" · ⚠"}</small></div>`).join("");
  });
  dd.innerHTML = h || `<div class="empty" style="padding:8px 10px">—</div>`;
  dd.classList.add("open");
  const first = dd.querySelector(".opt"); if(first) first.classList.add("act");
}
function closeDD(){ document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open")); }
const boxMeals = box => dayMeals(+box.dataset.day || 0);
function addFood(box, meal, id){
  const f = byId[id];
  boxMeals(box)[meal].push({id, g:f.g});
  update();
  const inp = box.querySelector(`[data-meal="${meal}"] .search`); if(inp){ inp.focus(); }
}
function bindEditor(box){
  box.addEventListener("focusin", e => { if(e.target.classList.contains("search")) openDD(e.target); });
  box.addEventListener("input", e => {
    const el = e.target, card = el.closest("[data-meal]"); if(!card) return;
    const meal = card.dataset.meal, M = boxMeals(box);
    if(el.classList.contains("search")) return openDD(el);
    const row = el.closest(".item"); if(!row) return;
    const it = M[meal][+row.dataset.i], f = byId[it.id];
    if(el.classList.contains("por")){ it.g = Math.max(0, (+el.value||0)*f.g); row.querySelector(".gr").value = Math.round(it.g*10)/10; }
    if(el.classList.contains("gr")){ it.g = Math.max(0, +el.value||0); row.querySelector(".por").value = +(it.g/f.g).toFixed(2); }
    card.querySelector(".tot").textContent = fmt(M[meal].reduce((a,x)=>a+(+x.g||0),0),0)+" g";
    update(false);
  });
  box.addEventListener("click", e => {
    const card = e.target.closest("[data-meal]"); if(!card) return;
    const meal = card.dataset.meal;
    const opt = e.target.closest(".opt");
    if(opt){ closeDD(); addFood(box, meal, +opt.dataset.id); return; }
    if(e.target.classList.contains("x")){ boxMeals(box)[meal].splice(+e.target.closest(".item").dataset.i,1); update(); }
  });
  box.addEventListener("keydown", e => {
    if(!e.target.classList.contains("search")) return;
    const dd = e.target.nextElementSibling, opts=[...dd.querySelectorAll(".opt")];
    let i = opts.findIndex(o=>o.classList.contains("act"));
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(i>=0) opts[i].classList.remove("act"); i = e.key==="ArrowDown"? Math.min(opts.length-1,i+1) : Math.max(0,i-1); if(opts[i]){opts[i].classList.add("act"); opts[i].scrollIntoView({block:"nearest"});} }
    if(e.key==="Enter" && opts[i]){ e.preventDefault(); const meal=e.target.closest("[data-meal]").dataset.meal; closeDD(); addFood(box, meal, +opts[i].dataset.id); }
    if(e.key==="Escape"){ closeDD(); e.target.blur(); }
  });
}

function dayStatus(r, b){ if(r.s.type==="NONE") return "na"; return r.RQ.ub < 1 ? "ok" : (r.RQ.lb >= 1 ? "hi" : "unc"); }
function renderDays(){
  const D = allDays(), N = D.length, b = S.bound;

  document.getElementById("dayChips").innerHTML = D.map((m,i)=>`<button data-d="${i}" aria-pressed="${i===S.dsel}">${esc(t("day_n"))} ${i+1}</button>`).join("");

  document.getElementById("btnDupDay").disabled = N >= MAXDAYS;

function renderDaysResults(){
  const D = allDays(), N = D.length, b = S.bound, SU = subs();
  const R = D.map(m => compute(m, S.bw)), M = compute(meanMeals(), S.bw);

  const mm = moet(M,b), kmm = document.getElementById("kMMOET"); kmm.textContent = isFinite(mm)?fmt(mm):"–"; kmm.style.color = mm<10000 ? "var(--critical-ink)" : "";
  // grid: substances x days (risk quotient), plus mean
  const cell = (r) => {
    if(r.s.type==="NONE") return `<td class="na" data-tip="${esc(t("no_ref"))}">–</td>`;
    const st = dayStatus(r,b), v = r.RQ[b];
    return `<td class="${st}" data-tip="<b>${esc(sname(r.s.k))}</b><br>RQ ${fmt(v)} · ${esc(t("st_"+st))}<br>${t("tip_expo")}: ${fmt(r.E[b])} ${unitOf(r.s)}">${v===0?"0":fmt(v, v<0.01?3:2)}</td>`;
  };
  let h = `<table class="dgrid"><thead><tr><th></th>${D.map((m,i)=>`<th>${esc(t("day_s"))}${i+1}</th>`).join("")}<th class="mean">${esc(t("mean_col"))}</th></tr></thead><tbody>`;
  FAMS.forEach(f => SU.filter(s=>s.fam===f).forEach(s => {
    h += `<tr><th class="sub" title="${esc(sname(s.k))}">${esc(trunc(shname(s.k),26))} ${fdot(s.k).replace('margin-right:6px','margin:0 0 0 4px')}</th>${R.map(r=>cell(r.S[s.k])).join("")}${cell(M.S[s.k]).replace("<td ","<td style=\"font-weight:650\" ").replace('class="','class="mean ')}</tr>`;
  }));
  const hiCell = (res) => { const v = hi(res,b), st = hiStatus(res); return `<td class="${st}">${fmt(v,2)}</td>`; };
  const moCell = (res) => { const v = moet(res,b), st = moetStatus(res); return `<td class="${st}">${isFinite(v)?fmt(v):"–"}</td>`; };
  h += `<tr class="tot"><th class="sub">${esc(t("row_hi"))}</th>${R.map(hiCell).join("")}${hiCell(M).replace('class="','class="mean ')}</tr>`;
  h += `<tr class="tot"><th class="sub">MOE<sub>T</sub></th>${R.map(moCell).join("")}${moCell(M).replace('class="','class="mean ')}</tr>`;

function renderTraj(R, M){
  const b = S.bound, N = R.length, SU = subs();
  const sel = document.getElementById("trajSel");
  sel.innerHTML = `<option value="HI">${esc(t("traj_hi"))}</option>` + FAMS.map(f=>`<optgroup label="${esc(t("fam_"+f))}">${SU.filter(s=>s.fam===f).map(s=>`<option value="${s.k}">${esc(sname(s.k))}</option>`).join("")}</optgroup>`).join("");
  if(![...sel.options].some(o=>o.value===S.traj)) S.traj = "HI";
  sel.value = S.traj;
  const k = S.traj, isHI = k==="HI", s = isHI ? null : SU.find(x=>x.k===k), noRef = s && s.type==="NONE";
  const val = res => isHI ? hi(res,b) : (noRef ? res.S[k].E[b] : res.S[k].RQ[b]);
  const daily = R.map(val);
  const run = daily.map((v,i)=> daily.slice(0,i+1).reduce((a,x)=>a+x,0)/(i+1));
  const color = isHI ? "var(--text-primary)" : famColor(s.fam);
  const yLab = isHI ? t("traj_y_hi") : (noRef ? `${t("th_expo")} (${unitOf(s)})` : t("traj_y_rq"));
  const el = document.getElementById("trajChart");
  document.getElementById("trajLegend").innerHTML = `<span><svg width="26" height="12"><line x1="1" x2="25" y1="6" y2="6" stroke="${color}" stroke-width="2"/><circle cx="13" cy="6" r="4" fill="${color}"/></svg>${esc(t("traj_daily"))}</span><span><svg width="26" height="12"><line x1="1" x2="25" y1="6" y2="6" stroke="var(--text-primary)" stroke-width="2" stroke-dasharray="5 3"/><circle cx="13" cy="6" r="4" fill="var(--surface-1)" stroke="var(--text-primary)" stroke-width="2"/></svg>${esc(t("traj_run"))}</span>` + (noRef ? "" : `<span><svg width="22" height="10"><line x1="1" x2="21" y1="5" y2="5" stroke="var(--critical)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>${esc(t("traj_ref"))}</span>`);
  if(N < 2){ el.innerHTML = `<p class="empty">${esc(t("traj_need2"))}</p>`; document.getElementById("trajNote").innerHTML = t("traj_explain"); return; }
  const W = cw(el, 900), H = 300, padL = 64, padR = 24, padT = 14, padB = 40, w = W-padL-padR, hgt = H-padT-padB;
  const vals = daily.concat(run, noRef ? [] : [1]).filter(v=>v>0);
  let lo = vals.length ? Math.floor(Math.log10(Math.min(...vals))) : -2, hiv = vals.length ? Math.ceil(Math.log10(Math.max(...vals))) : 1;
  if(hiv-lo < 2) lo = hiv-2;
  const y = v => padT + hgt - (Math.log10(Math.max(v, Math.pow(10,lo))) - lo)/(hiv-lo)*hgt;
  const x = i => padL + (N===1 ? w/2 : i/(N-1)*w);
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("traj_h"))}">`;
  for(let p=lo; p<=hiv; p++){ const yy=y(Math.pow(10,p)); g += `<line class="gl" x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}"/><text x="${padL-8}" y="${yy+4}" text-anchor="end">${p===0?"1":(p<-2||p>3?"10"+superscript(p):fmt(Math.pow(10,p)))}</text>`; }
  for(let i=0;i<N;i++) g += `<text x="${x(i)}" y="${H-padB+20}" text-anchor="middle">${esc(t("day_n"))} ${i+1}</text>`;
  g += `<text x="14" y="${padT+hgt/2}" transform="rotate(-90 14 ${padT+hgt/2})" text-anchor="middle">${esc(yLab)}</text>`;
  if(!noRef){ const y1 = y(1); g += `<line x1="${padL}" x2="${W-padR}" y1="${y1}" y2="${y1}" stroke="var(--critical)" stroke-width="1.5" stroke-dasharray="6 4"/>`; }
  const path = arr => arr.map((v,i)=>`${i?"L":"M"}${x(i)},${y(v)}`).join(" ");
  g += `<path d="${path(daily)}" fill="none" stroke="${color}" stroke-width="2"/>`;
  g += `<path d="${path(run)}" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-dasharray="6 4"/>`;
  const unitTxt = isHI ? "HI" : (noRef ? unitOf(s) : "RQ");
  daily.forEach((v,i)=>{ g += `<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="${color}" stroke="var(--surface-1)" stroke-width="2" data-tip="<b>${esc(t("day_n"))} ${i+1}</b><br>${esc(t("traj_daily"))}: ${fmt(v)} ${unitTxt}"/>`; });
  run.forEach((v,i)=>{ g += `<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="var(--surface-1)" stroke="var(--text-primary)" stroke-width="2" data-tip="<b>${esc(t("traj_run"))}</b> (${esc(t("day_n"))} 1–${i+1})<br>${fmt(v)} ${unitTxt}"/>`; });
  el.innerHTML = g + `</svg>`;
  const imax = daily.indexOf(Math.max(...daily)), mean = run[N-1];
  let note = t("traj_summary").replace("{max}", fmt(daily[imax])).replace("{d}", imax+1).replace("{mean}", fmt(mean)).replace("{n}", N).replace(/\{u\}/g, unitTxt);
  if(!noRef){
    const above = daily.filter(v=>v>=1).length;
    if(above && mean < 1) note += " " + t("traj_above_but_mean_ok").replace("{a}", above);
    else if(mean >= 1) note += " " + t("traj_mean_above");
  }
  document.getElementById("trajNote").innerHTML = note + " " + t("traj_explain");
}

/* ---------------------------------------------------------------- 3 · contributions */
const SEQ = ["--seq-0","--seq-1","--seq-2","--seq-3","--seq-4","--seq-5","--seq-6","--seq-7"];
function seqColor(p){ if(p<=0) return "var(--seq-0)"; const i = Math.min(7, 1+Math.floor(p/100*7)); return `var(${SEQ[i]})`; }
function renderContrib(res){
  const b = S.bound, SU = subs();
  const foods = res.foods.slice().sort((a,c)=>res.intake[c]-res.intake[a]);
  let h = `<table><thead><tr><th></th>${SU.map(s=>`<th class="sub ${s.k===S.sel?"sel":""}" data-k="${s.k}" title="${esc(sname(s.k))}">${fdot(s.k)}${esc(shname(s.k))}</th>`).join("")}</tr></thead><tbody>`;
  foods.forEach(id => {
    const f = byId[id];
    h += `<tr><th class="fd" title="${esc(fname(f))}">${esc(trunc(fname(f),28))} <span class="muted">${fmt(res.intake[id],0)} g</span></th>`;
    SU.forEach(s => {
      const r = res.S[s.k], c = r.contrib[id];
      if(!c){ h += `<td class="na" data-tip="<b>${esc(fname(f))}</b> · ${esc(sname(s.k))}<br>${esc(t("not_analysed"))}">·</td>`; return; }
      const tot = r.E[b], p = tot>0 ? c[b]/tot*100 : 0;
      const dark = p > 57;
      h += `<td style="background:${seqColor(p)};color:${dark?"#fff":"var(--text-primary)"}" data-tip="<b>${esc(fname(f))}</b> · ${esc(sname(s.k))}<br>${fmt(p,1)} % · ${fmt(c[b])} ${unitOf(s)}">${p>=0.5?Math.round(p):(p>0?"<1":"0")}</td>`;
    });
    h += `</tr>`;
  });
  if(!foods.length) h += `<tr><td class="empty" colspan="13">${esc(t("no_items"))}</td></tr>`;
  document.getElementById("heat").innerHTML = famLegend() + h + "</tbody></table>";
  document.getElementById("heatScale").innerHTML = `0 %<span class="bar">${SEQ.slice(1).map(v=>`<i style="background:var(${v})"></i>`).join("")}</span>100 % <span class="muted" style="margin-left:10px"><span class="cov" style="width:22px;height:10px;background:repeating-linear-gradient(135deg,var(--line-strong) 0 3px,var(--surface-1) 3px 6px);border-radius:2px"></span> ${esc(t("not_analysed"))}</span>`;
  // detail
  const s = SU.find(x=>x.k===S.sel), r = res.S[S.sel];
  document.getElementById("detailH").textContent = t("detail_h");
  const rows = Object.entries(r.contrib).map(([id,c])=>({id:+id, v:c[b]})).filter(x=>x.v>0).sort((a,c)=>c.v-a.v);
  const tot = r.E[b];
  if(!rows.length) { document.getElementById("contribChart").innerHTML = `<p class="empty">${esc(t("contrib_none"))}</p>`; }
  else barList(document.getElementById("contribChart"), rows.slice(0,15).map(x=>({label:fname(byId[x.id]), v:x.v/tot, txt:fmt(x.v/tot*100,1)+" %", color:famColor(s.fam), tip:`<b>${esc(fname(byId[x.id]))}</b><br>${fmt(res.intake[x.id],0)} g × ${fmt(byId[x.id].c[s.k][{lb:0,mb:1,ub:2}[b]])} ${s.u==="pg"?"pg TEQ/g":"ng/g"}<br>= ${fmt(x.v)} ${unitOf(s)} (${fmt(x.v/tot*100,1)} %)`})), {w:560, labW:220});
  const n = document.getElementById("contribNote");
  n.innerHTML = r.missing.length ? t("contrib_cov") + r.missing.map(id=>esc(fname(byId[id]))).join(", ") : `<b>${esc(sname(s.k))}</b> · ${esc(SUBTXT[s.k].ep[S.lang])}`;
}

/* ---------------------------------------------------------------- 4 · risk & mixtures */
function renderRisk(res){
  const b = S.bound, SU = subs();
  const H = hi(res,b);
  const e1 = document.getElementById("hiAll"); e1.innerHTML = `${fmt(H,2)} <span class="small" style="font-weight:500">${statusHTML(hiStatus(res))}</span>`;
  const carc = SU.filter(s=>s.grp==="carc");
  const MT = moet(res, b), stC = moetStatus(res);
  document.getElementById("moetCarc").innerHTML = `${isFinite(MT)?fmt(MT):"–"} <span class="small" style="font-weight:500">${statusHTML(stC)}</span>`;
  // drivers (threshold substances)
  const drv = SU.filter(s=>s.grp!=="carc").map(s=>({k:s.k, v:res.S[s.k].RQ[b]})).sort((a,c)=>c.v-a.v);
  if(H>0) barList(document.getElementById("driversChart"), drv.map(d=>({label:shname(d.k), color:famColor(famOf(d.k)), v:d.v/H, txt:fmt(d.v/H*100,1)+" %", tip:`<b>${esc(sname(d.k))}</b><br>RQ ${fmt(d.v)} / HI ${fmt(H,2)}`})), {w:520, labW:180});
  else document.getElementById("driversChart").innerHTML = `<p class="empty">${esc(t("no_items"))}</p>`;
  // groups (threshold substances); shared linear scale so rows are comparable
  const TG = GROUPS.filter(g=>g!=="carc");
  const maxG = Math.max(1.2, ...TG.map(g=>SU.filter(s=>s.grp===g).reduce((a,s)=>a+res.S[s.k].RQ[b],0)));
  const scaleMax = maxG<=1.2 ? 1.5 : Math.pow(10, Math.ceil(Math.log10(maxG)*4)/4);
  const box = document.getElementById("mixRows");
  const W = Math.max(260, (box.clientWidth||900) - 210 - 150 - 24), Hh=46, w=W-30;
  const short = k => (SUBTXT[k].sh ? SUBTXT[k].sh[S.lang] : sname(k));
  let h = "";
  TG.forEach(g => {
    const ss = SU.filter(s=>s.grp===g); if(!ss.length) return;
    const tot = ss.reduce((a,s)=>a+res.S[s.k].RQ[b],0);
    const st = hiStatus(res, ss.map(s=>s.k));
    let x=0, segs="";
    ss.slice().sort((a,c)=>res.S[c.k].RQ[b]-res.S[a.k].RQ[b]).forEach((s,i)=>{
      const v = res.S[s.k].RQ[b], ww = v/scaleMax*w;
      if(ww<=0) return;
      segs += `<rect x="${x}" y="6" width="${Math.max(1.5,ww-2)}" height="16" rx="3" fill="${famColor(s.fam)}" data-tip="<b>${esc(sname(s.k))}</b><br>RQ ${fmt(v)} (${fmt(tot>0?v/tot*100:0,0)} %)"/>`;
      x += ww;
    });
    const xt = 1/scaleMax*w;
    const axis = `<line class="thr" x1="${xt}" x2="${xt}" y1="2" y2="26"/><text x="${xt}" y="40" text-anchor="middle">1</text><text x="0" y="40">0</text><text x="${w}" y="40" text-anchor="end">${fmt(scaleMax)}</text>`;
    h += `<div class="mix-row"><div class="gname"><b>${esc(t("g_"+g))}</b><small>${esc(t("g_"+g+"_d"))} · ${ss.map(s=>fdot(s.k)+esc(shname(s.k))).join(" &nbsp;")}</small></div>
      <div class="chart"><svg viewBox="0 0 ${W} ${Hh}"><line class="gl" x1="0" x2="${w}" y1="14" y2="14"/>${segs}${axis}</svg></div>
      <div><div style="font-size:20px;font-weight:650;font-variant-numeric:tabular-nums">HI ${fmt(tot,2)}</div>${statusHTML(st)}</div></div>`;
  });
  // genotoxic carcinogens: MOE approach, no HI
  h += `<div class="mix-row"><div class="gname"><b>${esc(t("g_carc"))}</b><small>${esc(t("g_carc_d"))} · ${carc.map(s=>fdot(s.k)+esc(shname(s.k))).join(" &nbsp;")}</small></div>
    <div class="small sec">${t("carc_row")}:<br>${carc.map(s=>{ const m = s.rp/res.S[s.k].E[b]; return `<b>${esc(sname(s.k))}</b> MOE ${isFinite(m)?fmt(m):"–"} ${statusHTML(res.S[s.k].status)}`; }).join(" &nbsp;·&nbsp; ")}</div>
    <div><div style="font-size:20px;font-weight:650;font-variant-numeric:tabular-nums">MOE<sub>T</sub> ${isFinite(MT)?fmt(MT):"–"}</div>${statusHTML(stC)}</div></div>`;
  document.getElementById("mixRows").innerHTML = h;
  document.getElementById("bpaWarnRisk").innerHTML = bpaWarn(res);
}

/* ---------------------------------------------------------------- 5 · compare */
const SCOL = ["var(--series-1)","var(--series-2)","var(--series-3)","var(--series-4)","var(--text-secondary)"];
function renderCompare(res){
  const list = document.getElementById("scenList");
  list.innerHTML = S.scen.map((sc,i)=>`<div class="scen"><i style="background:${SCOL[i]}"></i><input value="${esc(sc.name)}" data-i="${i}" aria-label="name"><small>${fmt(sc.bw,0)} kg</small><button class="btn small" data-load="${i}">${esc(t("load"))}</button><button class="btn small" data-del="${i}" aria-label="${esc(t("del"))}">×</button></div>`).join("");
  document.getElementById("btnSave").disabled = S.scen.length>=4;
  const series = S.scen.map((sc,i)=>({name:sc.name, color:SCOL[i], res:compute(sc.meals, sc.bw)}));
  series.push({name:t("current"), color:SCOL[4], res, current:true});
  const lg = document.getElementById("cmpLegend"), ch = document.getElementById("cmpChart");
  lg.innerHTML = series.map(s=>`<span><i style="background:${s.color}${s.current?";background:repeating-linear-gradient(45deg,var(--text-secondary) 0 2px,transparent 2px 4px);border:1px solid var(--text-secondary)":""}"></i>${esc(s.name)}</span>`).join("");
  if(!S.scen.length){ ch.innerHTML = `<p class="empty">${esc(t("cmp_empty"))}</p>`; }
  const b = S.bound, SU = subs();
  // grouped log bars
  if(S.scen.length){
    const W=cw(ch,760), lab=200, padR=16, x0=lab, w=W-lab-padR, n=series.length, bh=6, gap=2, rowH = n*(bh+gap)+12, top=8, H = top+SU.length*rowH+24;
    let g = `<svg viewBox="0 0 ${W} ${H}">` + logAxis(x0, w, top, top+SU.length*rowH);
    SU.forEach((s,i)=>{
      const y = top+i*rowH;
      g += `<text class="lbl" x="${lab-22}" y="${y+rowH/2+4}" text-anchor="end">${esc(shname(s.k))}</text><rect x="${lab-16}" y="${y+rowH/2-5}" width="10" height="10" rx="3" fill="${famColor(s.fam)}"/>`;
      if(i>0) g += `<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}" stroke-dasharray="1 3"/>`;
      series.forEach((se,j)=>{
        const v = se.res.S[s.k].RQ[b], xs=lx(Math.pow(10,LOGMIN),x0,w), xv=lx(v,x0,w), yy = y+6+j*(bh+gap);
        const fill = se.current ? "url(#hatch)" : se.color;
        if(v>0) g += `<rect x="${xs}" y="${yy}" width="${Math.max(2,xv-xs)}" height="${bh}" rx="2" fill="${fill}" ${se.current?'stroke="var(--text-secondary)" stroke-width=".8"':""} data-tip="<b>${esc(se.name)}</b> · ${esc(sname(s.k))}<br>RQ ${fmt(v)} · ${metricText(se.res.S[s.k])}"/>`;
      });
    });
    g = g.replace("<svg ", `<svg `) + `<defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="var(--surface-1)"/><line x1="0" y1="0" x2="0" y2="4" stroke="var(--text-secondary)" stroke-width="2"/></pattern></defs></svg>`;
    ch.innerHTML = g;
  }
  // table
  let th = `<thead><tr><th></th>${series.map(s=>`<th class="num">${esc(s.name)}</th>`).join("")}</tr></thead><tbody>`;
  th += `<tr><td><b>${t("cmp_th_total")}</b></td>${series.map(s=>`<td class="num"><b>${fmt(hi(s.res,b),2)}</b></td>`).join("")}</tr>`;
  th += `<tr><td>MOE<sub>T</sub> ${esc(t("g_carc").toLowerCase())}</td>${series.map(s=>{const m=moet(s.res,b); return `<td class="num">${isFinite(m)?fmt(m):"–"}</td>`;}).join("")}</tr>`;
  th += `<tr><td>${t("cmp_th_exceed")}</td>${series.map(s=>`<td class="num">${Object.values(s.res.S).filter(r=>r.RQ[b]>=1).length}</td>`).join("")}</tr>`;
  th += `<tr><td>${t("cmp_th_g")}</td>${series.map(s=>`<td class="num">${fmt(s.res.grams,0)}</td>`).join("")}</tr>`;
  SU.forEach(s => th += `<tr><td class="small">${fdot(s.k)}${esc(shname(s.k))} <span class="muted">(${s.type==="HBGV"?"%":"MOE"})</span></td>${series.map(se=>`<td class="num small">${metricText(se.res.S[s.k]).replace("MOE ","")}</td>`).join("")}</tr>`);
  document.getElementById("cmpTable").innerHTML = th + "</tbody>";
}

function update(full=true){

}

  const ok = l => ["es","fr","en"].includes(l) ? l : null;
  const fromUrl = ok((new URLSearchParams(location.search).get("lang")||"").toLowerCase()) || ok(location.hash.replace("#","").toLowerCase());
  let saved = null; try{ saved = ok(localStorage.getItem(LS+".lang")); }catch(e){}   // only set by an explicit click
  S.lang = fromUrl || saved || "en";
})();
document.getElementById("bw").value = S.bw; document.getElementById("introBw").value = S.bw;
document.getElementById("age").value = S.age||""; document.getElementById("introAge").value = S.age||"";
document.getElementById("allFoods").checked = !!S.all;
applyI18n();
setView("intro");
update();
</script>
