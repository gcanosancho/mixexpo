<style>
:root{
  color-scheme: light;

}

    --accent:#519ced; --accent-soft:#1a2a3d;
    --series-1:#338ced; --series-2:#e76624; --series-3:#00a888; --series-4:#d28e05;
    --good-ink:#3fcf55; --warning-ink:#fbb315; --critical-ink:#f07071;
    --seq-0:#1d232b; --seq-1:#0e3d7e; --seq-2:#0f4a96; --seq-3:#1757ac; --seq-4:#2370cd; --seq-5:#338ced; --seq-6:#6aabf1; --seq-7:#b6d5f8;
    --grid:#2a2a2a;
    --fam-metal:#338ced; --fam-proc:#e76624; --fam-myco:#00a888; --fam-pop:#9887ef; --fam-pest:#e24d8b; --fam-fcm:#c98a3a; --fam-add:#1f9cc0; --fam-phyto:#7f9a10;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-primary);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}

a{color:var(--accent)}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
header.top{background:var(--surface-1);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}

.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}

main{padding:22px 0 60px}

@media (max-width:700px){header.top{position:static}.top-row{gap:10px}.item{grid-template-columns:1fr 14px 1fr 28px}.item .nm{grid-column:1/-1}.kpi .v{font-size:20px}}

.dd{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface-1);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.14);max-height:340px;overflow:auto;z-index:30;display:none}
.dd.open{display:block}

.dd .opt.act,.dd .opt:hover{background:var(--accent-soft)}
.fdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;flex:none}

.cov{display:inline-flex;gap:1px;vertical-align:middle;margin-left:4px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar select{max-width:100%;min-width:0}
#trajSel,#presetDays,#preset,#subSel{max-width:min(100%,420px)}
@media (max-width:700px){.toolbar select{width:100%}}
.btn{border:1px solid var(--line-strong);background:var(--surface-1);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}

.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--text-secondary)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:550;white-space:nowrap}
.status .dot{width:14px;height:14px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.st-ok{color:var(--good-ink)} .st-ok .dot{background:var(--good)}
.st-unc{color:var(--warning-ink)} .st-unc .dot{background:var(--warning);color:#3a2700}
.st-hi{color:var(--critical-ink)} .st-hi .dot{background:var(--critical)}
.st-na{color:var(--text-muted)} .st-na .dot{background:var(--line-strong);color:var(--text-primary)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:600;color:var(--text-secondary);font-size:12px;border-bottom:1px solid var(--line-strong);padding:7px 8px;vertical-align:bottom}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.fam td{background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:4px 8px}
.muted{color:var(--text-muted)} .sec{color:var(--text-secondary)}
.small{font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two>*,.grid-diet>*,.stack>*{min-width:0}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--text-secondary);font-size:11.5px}
.chart .lbl{fill:var(--text-primary);font-size:12.5px}
.chart .ax{stroke:var(--line-strong)}
.chart .gl{stroke:var(--grid)}
.chart .thr{stroke:var(--text-primary);stroke-dasharray:4 3;stroke-width:1.5}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:var(--text-primary);fill-opacity:.04}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--text-secondary);margin:4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
#tip{position:fixed;pointer-events:none;background:var(--text-primary);color:var(--surface-1);font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:7px;max-width:300px;z-index:100;opacity:0;transition:opacity .08s}
#tip b{font-weight:650}
.heat{overflow:auto}
.heat table{border-collapse:separate;border-spacing:2px;font-size:12px}
.heat th{font-weight:550;color:var(--text-secondary);padding:2px 4px;white-space:nowrap}
.heat th.sub{writing-mode:vertical-rl;transform:rotate(180deg);height:160px;vertical-align:bottom;text-align:left;cursor:pointer}

.heat th.fd{text-align:right;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.heat td{width:44px;min-width:44px;height:26px;text-align:center;border-radius:4px;font-variant-numeric:tabular-nums;cursor:default}

.hm{overflow:auto;max-height:78vh;border:1px solid var(--line);border-radius:8px}
.hm table{border-collapse:separate;border-spacing:1px;font-size:11.5px}
.hm thead th{position:sticky;top:0;background:var(--surface-1);z-index:2}
.hm th{font-weight:550;color:var(--text-secondary);padding:2px 4px;white-space:nowrap}
.hm th.g{writing-mode:vertical-rl;transform:rotate(180deg);height:180px;vertical-align:bottom;text-align:left;font-weight:500}
.hm th.g.big{color:var(--text-primary)}
.hm th.rl,.hm td.rl{position:sticky;left:0;background:var(--surface-1);z-index:1;text-align:left;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm thead th.rl{z-index:3}

.hm td.rl.out{font-style:italic;color:var(--text-muted)}

@media (max-width:640px){ .hm th.rl,.hm td.rl{max-width:130px} .hm td.rl.sub{padding-left:8px} .hm th.g{height:150px} }
.scale .bin{display:inline-flex;align-items:center;gap:4px}
.scale .bin i{width:18px;height:12px;border-radius:3px;display:inline-block}

.mix-row{display:grid;grid-template-columns:210px minmax(0,1fr) 150px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}

.mix-row .gname b{display:block;font-weight:600}

  header.top{position:static} nav.tabs,.toolbar,.adder,.item .x,#tip{display:none!important}

<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><b>MixExpo <span class="ver">v1.5 · 26.11.2026</span></b><span data-i18n="subtitle"></span><span class="byline">German Cano-Sancho · <span data-i18n="peda_only"></span></span></div>
      <div class="you" role="group" aria-labelledby="youH"><span class="you-h" id="youH"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3.2" fill="currentColor"/><path d="M1.8 15c.6-3.4 3.1-5.3 6.2-5.3s5.6 1.9 6.2 5.3z" fill="currentColor"/></svg><span data-i18n="you_h"></span></span>
        <label class="ctrl"><span data-i18n="bw"></span> <input id="bw" type="number" min="10" max="200" step="1" value="70"> kg</label>

      </div>
      <div class="ctrl" id="basisCtrl"><span data-i18n="basis"></span>
        <div class="seg" id="basisSeg" role="group"><button data-x="day" data-i18n="basis_day"></button><button data-x="mean" id="basisMeanBtn"></button></div>
      </div>
      <div class="ctrl"><span data-i18n="bound"></span>
        <div class="seg" id="boundSeg" role="group">
          <button data-b="lb">LB</button><button data-b="mb">MB</button><button data-b="ub">UB</button>
        </div>
      </div>

 m1_s:"1. Cálculo de la exposición",
 m1:"<p>Para cada sustancia <i>s</i>: <code>E<sub>s</sub> = Σ<sub>f</sub> (consumo<sub>f</sub> [g/día] × C<sub>f,s</sub> [ng/g]) / peso [kg]</code>. C<sub>f,s</sub> es la media de todas las muestras regionales/nacionales de EAT2 para ese alimento. Las sumas de congéneres (HAP4, PFAS4, PBDE, EQT) se calculan muestra a muestra antes de promediar.</p>",
 m2_s:"2. Datos censurados (LB / MB / UB)",
 m2:"<p>«ND (x)», «&lt; x» → no detectado (x = LOD): LB = 0, MB = LOD/2, UB = LOD. «NQ (x)» → detectado no cuantificado (x = LOQ): LB = 0, MB = LOQ/2, UB = LOQ. Cuando no se indica el límite se usa el de la hoja «Limites analytiques» (acrilamida LOD 4 / LOQ 10 µg/kg; DON 3/10 µg/kg en sólidos y 0,3/1 en líquidos). «NR» o celda vacía = no analizado (se excluye, no se pone a 0).</p>",
 m3_s:"3. Selección de sustancias y agregación",
 m3:"<p><b>Criterio de selección:</b> un analito se conserva si se cuantificó en al menos el 10 % del total de muestras de la EAT2, <b>o</b> en al menos el 10 % de las muestras de al menos un grupo de alimentos INCA2 con 10 o más muestras analizadas. La segunda condición conserva sustancias raras en el conjunto de la dieta pero frecuentes en algunos alimentos (plaguicidas en cereales almacenados y frutas, PFAS en pescado y vísceras). El mínimo de 10 muestras evita seleccionar una sustancia por 1 muestra positiva de 2. De los 425 analitos examinados, 102 cumplen la regla (ver la pestaña <b>Presencia</b>). Los <b>fitoestrógenos</b> (isoflavonas, lignanos: 8 analitos) también la cumplen pero <b>no se incluyen</b> desde la v1.5, porque sus valores de referencia sanitaria se basan en evidencia limitada. El resto se agrupa en las 33 sustancias de la calculadora. Tampoco se incluyen: los 14 HAP distintos de los HAP4 (visibles en Presencia; los HAP4 son el indicador de la EFSA) ni los analitos que no cumplen la regla, como la ocratoxina A (≥ 10 % solo en grupos con menos de 10 muestras), la carbendazima (8 % de las frutas), los nitritos (6 % de los embutidos) y el dimetoato. El arsénico total, aunque frecuente, no se evalúa porque en el pescado es casi todo arsenobetaína, no tóxica.</p><ul><li><b>Cd, Hg, Pb</b>: valores de elementos traza de EAT2 incluidos en la calculadora original (45 alimentos, µg/kg). Celdas vacías interpretadas como &lt; LOD (Cd 0,5; Hg 5; Pb 2,5 µg/kg). El Hg total se compara con la TWI del metilmercurio (conservador fuera del pescado).</li><li><b>Sumas</b>: HAP4 = BaP + BaA + BbF + CHR; PBDE = Σ BDE-28, 47, 99, 100, 153, 154, 183 (BDE-209 aparte); HBCDD = α + β + γ; PCB no dioxínicos = PCB 28, 52, 101, 138, 153, 180; dioxinas + PCB-DL en EQT-OMS 2005; PFAS4 = PFOS + PFOA + PFNA + PFHxS (definición EFSA 2020; el PFHxS apenas se cuantificó); otros PFAS de cadena larga = PFDA + PFUnDA + PFDoDA + PFTrDA; PBB = PBB 52 + 101 + 153.</li><li><b>Plaguicidas y aditivos</b> (mg/kg × 1000). Las ADI de los plaguicidas son las vigentes en la época de la EAT2 (compilación EFSA 2008), salvo el clorpirifós, para el que se usa el valor más bajo de la EFSA de 2014. Sulfitos expresados como SO₂.</li><li><b>Mezclas, nivel 1</b>: los tres organofosforados (pirimifós-metilo, clorpirifós-metilo, clorpirifós) comparten mecanismo (inhibición de la acetilcolinesterasa) y se agrupan en neurotoxicidad. Los demás plaguicidas se colocan en «otros efectos»: agruparlos por órgano diana requeriría los grupos de evaluación acumulativa de la EFSA, fuera del alcance de esta herramienta.</li><li><b>Bisfenol A</b>: campaña ANSES/LABERCA sobre las muestras EAT2 + aguas embotelladas (LHN). Muestras de 2007–2009, anteriores a la prohibición francesa del BPA en envases alimentarios (2015).</li></ul>",
 m4_s:"4. Caracterización del riesgo y mezclas",
 m4:"<p>Sustancias con valor basado en salud (TDI/TWI/ADI): RQ = E / VBS; se muestra el % del VBS. Sustancias evaluadas con margen de exposición: MOE = BMDL / E; preocupación si MOE &lt; umbral (10 000 para carcinógenos genotóxicos, 10 para Pb, 25 para PBDE según EFSA 2024). Para combinarlas se usa RQ = umbral / MOE. HI = Σ RQ de las sustancias con umbral (nivel 0, guía MixTox de EFSA 2019); los carcinógenos genotóxicos no se suman al HI sino que se combinan con MOE<sub>T</sub> = 1/Σ(1/MOE<sub>i</sub>). Los grupos de nivel 1 son una simplificación pedagógica de los grupos de evaluación acumulativa.</p><p><b>Limitaciones:</b> 1 día ≠ exposición habitual; datos de 2007–2009; no todas las sustancias se analizaron en todos los alimentos; solo exposición alimentaria (sin agua de bebida para la mayoría de sustancias, aire, polvo…).</p>",

 intro_h:"Bienvenido/a a MixExpo",
 intro_lead:"MixExpo estima cuánto ingieres de 33 sustancias químicas a través de la dieta, cómo se compara con la población francesa y qué significa para la salud cuando se combinan. Utiliza las concentraciones medidas en el <b>segundo Estudio de Dieta Total francés</b> (ANSES), en alimentos preparados «tal como se consumen». Sigue los pasos; todo funciona en tu navegador y no se envía nada.",

 good_html:"<h3>Para tener en cuenta</h3><ul><li>Uso <b>exclusivamente docente</b>: no es una herramienta de diagnóstico.</li><li>Tus datos se quedan en <b>este navegador</b>; en un ordenador compartido, vacía la dieta al terminar.</li><li>Las concentraciones son de <b>2007–2009</b> y se midieron en alimentos preparados para su consumo.</li><li>Las 33 sustancias se eligieron porque se <b>cuantificaron en al menos el 10 %</b> de las muestras del estudio, en total o en al menos un grupo de alimentos (ver <b>Presencia</b>).</li><li>Los valores de referencia son para una <b>exposición de por vida</b>: un día por encima no supone, en sí mismo, un riesgo.</li></ul>",
 discuss_html:"<h3>Preguntas para explorar</h3><ul><li>¿La sustancia a la que más te expones es también la más peligrosa? ¿Por qué no?</li><li>¿Qué conclusiones cambian entre LB y UB? ¿Qué dice eso de los métodos analíticos?</li><li>Sustituye un alimento (p. ej. conserva por fresco, atún por otro pescado): ¿qué cambia y qué no?</li><li>¿Cómo se compara tu media de varios días con tu peor día?</li><li>Cambia el valor de referencia del bisfenol A del BfR a la EFSA: ¿cuánto depende la conclusión de la caracterización del peligro?</li></ul>",
 tab_occ:"Presencia",
 occ_h:"¿Dónde se encuentran las sustancias? Presencia en los alimentos de la EAT2",
 occ_lead:"Cada celda indica el <b>porcentaje de muestras de la EAT2 en las que se cuantificó la sustancia</b> (por encima del límite de cuantificación), por grupo de alimentos. Así se eligieron las sustancias de MixExpo: un analito se conserva si se cuantificó en <b>≥ 10 % del total de muestras</b>, <b>o</b> en <b>≥ 10 % de las muestras de al menos un grupo de alimentos</b> con 10 o más muestras. La presencia indica con qué frecuencia aparece una sustancia, no cuánta hay: compárala con las pestañas Exposición y Alimentos que contribuyen.",

 m6_s:"6. Comparación con la población francesa",
 m6:"<p>La pestaña Exposición compara tu exposición con la media y el percentil 95 de la <b>exposición alimentaria habitual</b> de los adultos (18–79 años) o niños (3–17 años) franceses estimada en la EAT2. El grupo sigue la edad que indiques (menos de 18: niños) y puede cambiarse. Tu valor y el poblacional usan la misma hipótesis (LB, MB o UB) cuando ambas están publicadas. Las estimaciones poblacionales combinan las concentraciones de la EAT2 con los registros alimentarios individuales de 7 días de la encuesta INCA2, por lo que representan la ingesta a largo plazo: compáralas preferentemente con la <b>media de varios días</b>. Aún no se incluyen los valores de plaguicidas y aditivos (informe 2 de la EAT2).</p><ul class=\"small\"><li>ANSES (2011). Second French Total Diet Study (TDS 2), report 1: inorganic contaminants, minerals, persistent organic pollutants, mycotoxins and phytoestrogens. <a href=\"https://www.anses.fr/fr/system/files/PASER2006sa0361Ra1EN.pdf\" target=\"_blank\" rel=\"noopener\">PDF</a></li><li>Tard A. et al. (2012) Food Chem Toxicol 50(3–4) (acrylamide). <a href=\"https://doi.org/10.1016/j.fct.2011.12.033\" target=\"_blank\" rel=\"noopener\">doi</a></li><li>Veyrand B. et al. (2013) Environ Int 54:11 (PAHs). <a href=\"https://doi.org/10.1016/j.envint.2012.12.011\" target=\"_blank\" rel=\"noopener\">doi</a></li><li>Bemrah N. et al. (2014) Food Chem Toxicol 72:90 (bisphenol A). <a href=\"https://doi.org/10.1016/j.fct.2014.07.005\" target=\"_blank\" rel=\"noopener\">doi</a></li></ul>"

 risk_lead:"Substances do not act in isolation. EFSA’s 2019 guidance on combined exposure proposes a tiered approach: first add up the risk quotients of everything (<b>hazard index, HI</b>, very conservative) and, if HI ≥ 1, refine by grouping substances that share a toxic effect (<b>assessment groups</b>).",

 m1_s:"1. Exposure calculation",
 m1:"<p>For each substance <i>s</i>: <code>E<sub>s</sub> = Σ<sub>f</sub> (intake<sub>f</sub> [g/day] × C<sub>f,s</sub> [ng/g]) / body weight [kg]</code>. C<sub>f,s</sub> is the mean of all regional/national TDS2 samples of that food. Congener sums (PAH4, PFAS4, PBDE, TEQ) are computed sample by sample before averaging.</p>",
 m2_s:"2. Left-censored data (LB / MB / UB)",
 m2:"<p>“ND (x)”, “&lt; x” → not detected (x = LOD): LB = 0, MB = LOD/2, UB = LOD. “NQ (x)” → detected, not quantified (x = LOQ): LB = 0, MB = LOQ/2, UB = LOQ. When no limit is given, the “Limites analytiques” sheet is used (acrylamide LOD 4 / LOQ 10 µg/kg; DON 3/10 µg/kg in solids, 0.3/1 in liquids). “NR” or empty = not analysed (excluded, not set to 0).</p>",
 m3_s:"3. Selection of substances and aggregation",
 m3:"<p><b>Selection criterion:</b> an analyte is kept if it was quantified in at least 10 % of the TDS2 samples overall, <b>or</b> in at least 10 % of the samples of at least one INCA2 food group with at least 10 analysed samples. The second condition keeps chemicals that are rare in the diet as a whole but frequent in a few foods (pesticides on stored cereals and fruit, PFAS in fish and offal). The minimum of 10 samples avoids selecting a chemical because of 1 positive sample out of 2. Of the 425 analytes screened, 102 meet the rule (see the <b>Occurrence</b> tab). <b>Phytoestrogens</b> (isoflavones, lignans: 8 analytes) also meet it but are <b>not included</b> since v1.5, because their health reference values rest on limited evidence. The remaining analytes are combined into the 33 chemicals of the calculator. Also not included: the 14 PAHs other than PAH4 (shown in Occurrence; PAH4 is EFSA’s indicator) and analytes that do not meet the rule, such as ochratoxin A (≥ 10 % only in groups with fewer than 10 samples), carbendazim (8 % of fruit), nitrites (6 % of cured meats) and dimethoate. Total arsenic, although frequent, is not assessed because in fish it is almost entirely non-toxic arsenobetaine.</p><ul><li><b>Cd, Hg, Pb</b>: TDS2 trace-element values included in the original spreadsheet calculator (45 foods, µg/kg). Empty cells taken as &lt; LOD (Cd 0.5; Hg 5; Pb 2.5 µg/kg). Total Hg is compared with the methylmercury TWI (conservative outside fish).</li><li><b>Sums</b>: PAH4 = BaP + BaA + BbF + CHR; PBDEs = Σ BDE-28, 47, 99, 100, 153, 154, 183 (BDE-209 separate); HBCDD = α + β + γ; non-dioxin-like PCBs = PCB 28, 52, 101, 138, 153, 180; dioxins + dl-PCBs as WHO-2005 TEQ; PFAS4 = PFOS + PFOA + PFNA + PFHxS (EFSA 2020 definition; PFHxS itself was rarely quantified); other long-chain PFAS = PFDA + PFUnDA + PFDoDA + PFTrDA; PBBs = PBB 52 + 101 + 153.</li><li><b>Pesticides and additives</b> (mg/kg × 1000). Pesticide ADIs are those in force at the time of TDS2 (EFSA 2008 compilation), except chlorpyrifos, for which the lower 2014 EFSA value is used. Sulfites expressed as SO₂.</li><li><b>Mixtures, tier 1</b>: the three organophosphates (pirimiphos-methyl, chlorpyrifos-methyl, chlorpyrifos) share a mechanism (acetylcholinesterase inhibition) and are grouped under neurotoxicity. The other pesticides are placed under “other effects”: grouping them by target organ would need EFSA’s cumulative assessment groups, beyond the scope of this tool.</li><li><b>Bisphenol A</b>: ANSES/LABERCA campaign on TDS2 samples + bottled waters (LHN). Samples from 2007–2009, before the French ban of BPA in food packaging (2015).</li></ul>",
 m4_s:"4. Risk characterisation and mixtures",
 m4:"<p>Substances with a health-based guidance value (TDI/TWI/ADI): RQ = E / HBGV; shown as % of HBGV. Substances assessed by margin of exposure: MOE = BMDL / E; concern if MOE &lt; threshold (10,000 for genotoxic carcinogens, 10 for Pb, 25 for PBDEs per EFSA 2024). To combine them, RQ = threshold / MOE. HI = Σ RQ of threshold substances (tier 0, EFSA 2019 MixTox guidance); genotoxic carcinogens are not added to the HI but combined as MOE<sub>T</sub> = 1/Σ(1/MOE<sub>i</sub>). Tier-1 groups are a teaching simplification of cumulative assessment groups.</p><p><b>Limitations:</b> 1 day ≠ usual exposure; data from 2007–2009; not every substance was analysed in every food; diet only (no drinking water for most substances, air, dust…).</p>",

 good_html:"<h3>Good to know</h3><ul><li>For <b>teaching only</b>: not a diagnostic tool.</li><li>Your data stay in <b>this browser</b>; on a shared computer, clear the diet when you finish.</li><li>Concentrations date from <b>2007–2009</b> and were measured in foods as prepared for eating.</li><li>The 33 chemicals were chosen because they were <b>quantified in at least 10 %</b> of the study’s samples, overall or in at least one food group (see <b>Occurrence</b>).</li><li>Reference values are for <b>lifetime exposure</b>: one day above a reference value is not, in itself, a health risk.</li></ul>",
 discuss_html:"<h3>Questions to explore</h3><ul><li>Is the chemical you are most exposed to also the riskiest one? Why not?</li><li>Which conclusions change between LB and UB? What does that say about analytical methods?</li><li>Replace one food (e.g. canned by fresh, tuna by another fish): what changes, and what does not?</li><li>How does your mean over several days compare with your worst day?</li><li>Change the bisphenol A reference value from BfR to EFSA: how much does the conclusion depend on hazard characterisation?</li></ul>",

 m1_s:"1. Calcul de l’exposition",
 m1:"<p>Pour chaque substance <i>s</i> : <code>E<sub>s</sub> = Σ<sub>f</sub> (consommation<sub>f</sub> [g/j] × C<sub>f,s</sub> [ng/g]) / poids [kg]</code>. C<sub>f,s</sub> est la moyenne de tous les échantillons régionaux/nationaux EAT2 de l’aliment. Les sommes de congénères (HAP4, PFAS4, PBDE, TEQ) sont calculées échantillon par échantillon avant moyenne.</p>",
 m2_s:"2. Données censurées (LB / MB / UB)",
 m2:"<p>« ND (x) », « &lt; x » → non détecté (x = LD) : LB = 0, MB = LD/2, UB = LD. « NQ (x) » → détecté non quantifié (x = LQ) : LB = 0, MB = LQ/2, UB = LQ. Si la limite n’est pas indiquée, on utilise l’onglet « Limites analytiques » (acrylamide LD 4 / LQ 10 µg/kg ; DON 3/10 µg/kg en solide, 0,3/1 en liquide). « NR » ou vide = non analysé (exclu, pas mis à 0).</p>",
 m3_s:"3. Sélection des substances et agrégation",
 m3:"<p><b>Critère de sélection :</b> un analyte est retenu s’il a été quantifié dans au moins 10 % de l’ensemble des échantillons de l’EAT2, <b>ou</b> dans au moins 10 % des échantillons d’au moins un groupe d’aliments INCA2 comptant au moins 10 échantillons analysés. La seconde condition retient des substances rares dans l’alimentation globale mais fréquentes dans quelques aliments (pesticides sur céréales stockées et fruits, PFAS dans les poissons et abats). Le minimum de 10 échantillons évite de retenir une substance sur la base d’1 échantillon positif sur 2. Sur les 425 analytes examinés, 102 satisfont la règle (voir l’onglet <b>Occurrence</b>). Les <b>phyto-œstrogènes</b> (isoflavones, lignanes : 8 analytes) la satisfont aussi mais <b>ne sont plus inclus</b> depuis la v1.5, car leurs valeurs de référence sanitaires reposent sur des données limitées. Les autres analytes sont regroupés dans les 33 substances du calculateur. Ne sont pas inclus non plus : les 14 HAP autres que les HAP4 (visibles dans Occurrence ; les HAP4 sont l’indicateur de l’EFSA) et les analytes qui ne satisfont pas la règle, comme l’ochratoxine A (≥ 10 % seulement dans des groupes de moins de 10 échantillons), la carbendazime (8 % des fruits), les nitrites (6 % de la charcuterie) et le diméthoate. L’arsenic total, bien que fréquent, n’est pas évalué car dans le poisson il s’agit presque entièrement d’arsénobétaïne, non toxique.</p><ul><li><b>Cd, Hg, Pb</b> : valeurs d’éléments traces EAT2 incluses dans le calculateur Excel d’origine (45 aliments, µg/kg). Cellules vides considérées &lt; LD (Cd 0,5 ; Hg 5 ; Pb 2,5 µg/kg). Le Hg total est comparé à la DHT du méthylmercure (conservateur hors poisson).</li><li><b>Sommes</b> : HAP4 = BaP + BaA + BbF + CHR ; PBDE = Σ BDE-28, 47, 99, 100, 153, 154, 183 (BDE-209 à part) ; HBCDD = α + β + γ ; PCB non dioxine-like = PCB 28, 52, 101, 138, 153, 180 ; dioxines + PCB-DL en TEQ-OMS 2005 ; PFAS4 = PFOS + PFOA + PFNA + PFHxS (définition EFSA 2020 ; le PFHxS lui-même a rarement été quantifié) ; autres PFAS à chaîne longue = PFDA + PFUnDA + PFDoDA + PFTrDA ; PBB = PBB 52 + 101 + 153.</li><li><b>Pesticides et additifs</b> (mg/kg × 1000). Les DJA des pesticides sont celles en vigueur à l’époque de l’EAT2 (compilation EFSA 2008), sauf pour le chlorpyriphos, pour lequel la valeur plus basse de l’EFSA de 2014 est utilisée. Sulfites exprimés en SO₂.</li><li><b>Mélanges, palier 1</b> : les trois organophosphorés (pirimiphos-méthyl, chlorpyriphos-méthyl, chlorpyriphos) partagent un mécanisme (inhibition de l’acétylcholinestérase) et sont regroupés en neurotoxicité. Les autres pesticides sont placés dans « autres effets » : les regrouper par organe cible nécessiterait les groupes d’évaluation cumulative de l’EFSA, hors du champ de cet outil.</li><li><b>Bisphénol A</b> : campagne ANSES/LABERCA sur les échantillons EAT2 + eaux embouteillées (LHN). Échantillons 2007–2009, antérieurs à l’interdiction française du BPA dans les contenants alimentaires (2015).</li></ul>",
 m4_s:"4. Caractérisation du risque et mélanges",
 m4:"<p>Substances avec valeur toxicologique de référence (DJT/DHT/DJA) : QR = E / VTR ; affiché en % de la VTR. Substances évaluées par marge d’exposition : MOE = BMDL / E ; préoccupation si MOE &lt; seuil (10 000 pour les cancérogènes génotoxiques, 10 pour le Pb, 25 pour les PBDE selon l’EFSA 2024). Pour les combiner : QR = seuil / MOE. HI = Σ QR des substances à seuil (palier 0, guide MixTox EFSA 2019) ; les cancérogènes génotoxiques ne sont pas ajoutés au HI mais combinés via MOE<sub>T</sub> = 1/Σ(1/MOE<sub>i</sub>). Les groupes du palier 1 sont une simplification pédagogique des groupes d’évaluation cumulée.</p><p><b>Limites :</b> 1 jour ≠ exposition habituelle ; données 2007–2009 ; toutes les substances n’ont pas été analysées dans tous les aliments ; voie alimentaire uniquement (pas d’eau de boisson pour la plupart des substances, air, poussières…).</p>",

 intro_h:"Bienvenue dans MixExpo",
 intro_lead:"MixExpo estime la quantité de 33 substances chimiques que vous ingérez par l’alimentation, la compare à celle de la population française et indique ce que cela signifie pour la santé lorsqu’elles sont combinées. Il utilise les concentrations mesurées dans la <b>deuxième Étude de l’alimentation totale</b> (ANSES), sur des aliments préparés « tels que consommés ». Suivez les étapes ; tout fonctionne dans votre navigateur et rien n’est envoyé.",
 s1_t:"Décrivez-vous",
 s1_d:"L’exposition s’exprime par kilo de poids corporel : indiquez votre <b>poids</b>. L’<b>âge</b> est facultatif : en dessous de 12 ans, la valeur plus stricte des isoflavones pour les enfants est utilisée. Les portions et exemples sont conçus pour des adultes.",
 s2_t:"Saisissez votre alimentation de 24 h",
 s2_d:"Dans <b>Mon alimentation 24 h</b>, notez tout ce que vous avez mangé et bu hier, repas par repas : cherchez un aliment puis indiquez portions ou grammes. Un exemple équilibré (PNNS) est chargé pour commencer ; videz-le ou chargez un autre exemple.",
 s2_b:"Aller à Mon alimentation",
 s3_t:"Ajoutez des jours (facultatif)",
 s3_d:"Dans <b>Plusieurs jours</b>, ajoutez jusqu’à 7 jours pour approcher votre apport habituel (chronique), suivre la trajectoire jour après jour et comparer chaque jour à la moyenne.",
 s3_b:"Aller à Plusieurs jours",
 s4_t:"Observez votre exposition",
 s4_d:"<b>Exposition</b> montre la quantité de chaque substance ingérée, et la compare à sa valeur de référence et à la <b>population française</b>. Passez de LB à MB et UB pour voir l’effet des résultats non détectés.",
 s4_b:"Aller à Exposition",
 s5_t:"Repérez les aliments en cause",
 s5_d:"<b>Aliments contributeurs</b> montre quels aliments pilotent chaque exposition. Les cellules hachurées signifient que la substance n’a pas été analysée dans cet aliment.",
 s5_b:"Aller aux Aliments",
 s6_t:"Évaluez le mélange",
 s6_d:"<b>Risque et mélanges</b> additionne les quotients de risque (indice de danger), regroupe les substances à effet commun et combine les cancérogènes génotoxiques.",
 s6_b:"Aller à Risque et mélanges",
 s7_t:"Changez vos choix",
 s7_d:"Dans <b>Comparer des scénarios</b>, enregistrez votre régime, modifiez-le (poisson, pain, conserves ou frais, boissons…) et comparez jusqu’à 4 versions.",
 s7_b:"Aller à Comparer",
 s8_t:"Enregistrez et comprenez",
 s8_d:"Exportez vos résultats (CSV) ou votre régime (JSON) depuis l’onglet Comparer, et lisez <b>Méthodes et données</b> pour les sources, hypothèses et valeurs de référence.",
 s8_b:"Aller à Méthodes",
 good_html:"<h3>À savoir</h3><ul><li>Usage <b>pédagogique uniquement</b> : ce n’est pas un outil de diagnostic.</li><li>Vos données restent dans <b>ce navigateur</b> ; sur un ordinateur partagé, videz le régime en fin de séance.</li><li>Les concentrations datent de <b>2007–2009</b> et ont été mesurées sur des aliments préparés pour être consommés.</li><li>Les 33 substances ont été retenues car <b>quantifiées dans au moins 10 %</b> des échantillons de l’étude, au global ou dans au moins un groupe d’aliments (voir <b>Occurrence</b>).</li><li>Les valeurs de référence portent sur une <b>exposition vie entière</b> : un jour au-dessus n’est pas, en soi, un risque.</li></ul>",
 discuss_html:"<h3>Questions à explorer</h3><ul><li>La substance à laquelle vous êtes le plus exposé est-elle aussi la plus préoccupante ? Pourquoi pas ?</li><li>Quelles conclusions changent entre LB et UB ? Qu’est-ce que cela dit des méthodes analytiques ?</li><li>Remplacez un aliment (conserve par frais, thon par un autre poisson…) : qu’est-ce qui change, et qu’est-ce qui ne change pas ?</li><li>Comment votre moyenne sur plusieurs jours se compare-t-elle à votre pire journée ?</li><li>Passez la valeur de référence du bisphénol A du BfR à l’EFSA : à quel point la conclusion dépend-elle de la caractérisation du danger ?</li></ul>",
 tab_occ:"Occurrence",
 occ_h:"Où trouve-t-on les substances ? Occurrence dans les aliments de l’EAT2",
 occ_lead:"Chaque cellule indique la <b>part des échantillons de l’EAT2 dans lesquels la substance a été quantifiée</b> (au-dessus de la limite de quantification), par groupe d’aliments. C’est ainsi qu’ont été choisies les substances de MixExpo : un analyte est retenu s’il a été quantifié dans <b>≥ 10 % de l’ensemble des échantillons</b>, <b>ou</b> dans <b>≥ 10 % des échantillons d’au moins un groupe d’aliments</b> comptant 10 échantillons ou plus. L’occurrence dit à quelle fréquence une substance est retrouvée, pas en quelle quantité : comparez avec les onglets Exposition et Aliments contributeurs.",

 occ_scale:"Échantillons quantifiés :",
 occ_other_pah:"Autres HAP (absents du calculateur : les HAP4 sont l’indicateur de l’EFSA)",
 occ_note_grp:"Pour les sommes (dioxines, HAP4, PBDE…), un échantillon compte comme quantifié si <b>l’un</b> de ses composants l’est ; les sommes paraissent donc plus fréquentes que leurs analytes. Passez à <b>Analytes individuels</b> pour les voir un par un. Métaux : une valeur par aliment dans la feuille pédagogique (part d’aliments, pas d’échantillons). Bisphénol A : campagne ANSES distincte sur les échantillons EAT2.",
 occ_note_an:"Ce sont les analytes de l’EAT2 (plus les métaux et le bisphénol A) qui satisfont la règle de sélection et sont utilisés dans MixExpo, regroupés comme ils sont sommés dans le calculateur. Des analytes comme le PFOS (9 % au global mais 68 % des crustacés et mollusques) ou le pirimiphos-méthyl (5 % au global mais 93 % du pain) seraient manqués par une règle fondée sur l’alimentation entière. Les 8 phyto-œstrogènes qui satisfont aussi la règle ne sont pas inclus (voir Méthodes).",
 occ_note_food:"Chaque aliment de l’EAT2 est un composite de 15 sous-échantillons achetés dans une région et une saison ; la plupart ont été analysés dans quelques régions ou saisons, si bien qu’une cellule vaut souvent « 1 sur 2 » ou « 2 sur 8 ». Survolez une cellule pour voir les effectifs.",

 m6:"<p>L’onglet Exposition compare votre exposition à la moyenne et au 95e centile de l’<b>exposition alimentaire habituelle</b> des adultes (18–79 ans) ou des enfants (3–17 ans) français estimée dans l’EAT2. Le groupe suit l’âge indiqué (moins de 18 ans : enfants) et peut être changé. Votre valeur et celle de la population utilisent la même hypothèse (LB, MB ou UB) quand les deux sont publiées. Les estimations de population combinent les concentrations de l’EAT2 avec les carnets alimentaires individuels de 7 jours de l’enquête INCA2 : elles représentent l’apport à long terme, à comparer de préférence avec la <b>moyenne de plusieurs jours</b>. Les valeurs des pesticides et additifs (rapport 2 de l’EAT2) ne sont pas encore incluses.</p><ul class=\"small\"><li>ANSES (2011). Second French Total Diet Study (TDS 2), report 1: inorganic contaminants, minerals, persistent organic pollutants, mycotoxins and phytoestrogens. <a href=\"https://www.anses.fr/fr/system/files/PASER2006sa0361Ra1EN.pdf\" target=\"_blank\" rel=\"noopener\">PDF</a></li><li>Tard A. et al. (2012) Food Chem Toxicol 50(3–4) (acrylamide). <a href=\"https://doi.org/10.1016/j.fct.2011.12.033\" target=\"_blank\" rel=\"noopener\">doi</a></li><li>Veyrand B. et al. (2013) Environ Int 54:11 (PAHs). <a href=\"https://doi.org/10.1016/j.envint.2012.12.011\" target=\"_blank\" rel=\"noopener\">doi</a></li><li>Bemrah N. et al. (2014) Food Chem Toxicol 72:90 (bisphenol A). <a href=\"https://doi.org/10.1016/j.fct.2014.07.005\" target=\"_blank\" rel=\"noopener\">doi</a></li></ul>"
}};

// title of the example loaded in each day; "edited" once the foods differ from the example
const sigOf = m => JSON.stringify(packM(m));
const mkLabel = (k, m) => ({k, sig:sigOf(m)});
function dayLabel(d){
  const L = (S.labels||[])[d]; if(!L || !L.k) return null;
  return {k:L.k, edited: L.sig !== sigOf(dayMeals(d))};
}
function dietTitleHTML(d){
  const L = dayLabel(d);
  if(!L) return `<span class="tag">${esc(t("diet_shown"))}</span><b>${esc(t("diet_own"))}</b>`;
  return `<span class="tag">${esc(t("diet_ex"))}</span><b>${esc(t(L.k))}</b>${L.edited?`<span class="ed">(${esc(t("diet_edited"))})</span>`:""}`;
}
const dayShort = d => { const L = dayLabel(d); return L ? t("sh_"+L.k) + (L.edited?"*":"") : ""; };
const byFr = {}; FOODS.forEach(f => byFr[f.fr] = f);
const byId = {}; FOODS.forEach(f => byId[f.id] = f);
const LS = "mixexpo.v2";
const packM = m => { const o={}; MEALS.forEach(k=>o[k]=(m[k]||[]).map(it=>({fr:byId[it.id].fr, g:+it.g}))); return o; };
const unpackM = m => { const o={}; MEALS.forEach(k=>o[k]=[]); MEALS.forEach(k=>((m&&m[k])||[]).forEach(it=>{ const f=byFr[it.fr||it.food]; if(f) o[k].push({id:f.id, g:+it.g||0}); })); return o; };
function store(){ try{ localStorage.setItem(LS, JSON.stringify({bw:S.bw,age:S.age,basis:S.basis,traj:S.traj,extra:S.extra.map(packM),bound:S.bound,meals:packM(S.meals),scen:S.scen.map(x=>({name:x.name,bw:x.bw,meals:packM(x.meals)})),rp:S.rp,all:S.all,sort:S.sort,labels:S.labels,popg:S.popg})); }catch(e){} }
function emptyMeals(){ const m={}; MEALS.forEach(k=>m[k]=[]); return m; }
const MAXDAYS = 7;
let S = {lang:"en", bw:70, bound:"lb", meals:emptyMeals(), scen:[], rp:{}, all:false, view:"intro", sel:"Cd", sort:"fam", extra:[], dsel:0, basis:"day", age:null, traj:"HI", labels:[], popg:null};
try{ const s = JSON.parse(localStorage.getItem(LS)||"null"); if(s){ Object.assign(S, s); S.meals = unpackM(s.meals); S.scen = (s.scen||[]).map(x=>({name:x.name,bw:x.bw,meals:unpackM(x.meals)})); S.extra = (s.extra||[]).slice(0,MAXDAYS-1).map(unpackM); S.view="intro"; S.dsel=0; } }catch(e){ S.meals = emptyMeals(); S.scen = []; S.extra = []; }
if(!S.meals || !Object.values(S.meals).some(a=>a.length)) { if(!localStorage.getItem || true) {} }

function subs(){
  return SUBS_DEFAULT.map(s => {
    const o = Object.assign({}, s);
    return Object.assign(o, S.rp[s.k]||{});
  });
}
const allDays = () => [S.meals, ...S.extra];
function dayMeals(d){ return d===0 ? S.meals : S.extra[d-1]; }
function meanMeals(){
  const D = allDays(), N = D.length, o = emptyMeals();
  D.forEach(m => MEALS.forEach(k => (m[k]||[]).forEach(it => o[k].push({id:it.id, g:it.g/N}))));
  return o;
}
const useMean = () => S.basis==="mean" && S.extra.length>0;
const analysed = () => useMean() ? meanMeals() : S.meals;
function loadPreset(p){ const o = emptyMeals(); MEALS.forEach(m => (p[m]||[]).forEach(([fr,g]) => { const f = byFr[fr]; if(f) o[m].push({id:f.id, g}); })); return o; }
const t = k => (I18N[S.lang][k] ?? I18N.en[k] ?? k);
const fname = f => f[S.lang] || f.fr;
const sname = k => SUBTXT[k].n[S.lang];
const shname = k => SUBTXT[k].sh ? SUBTXT[k].sh[S.lang] : SUBTXT[k].n[S.lang];
const famOf = k => SUBS_DEFAULT.find(x=>x.k===k).fam;
const famColor = f => `var(--fam-${f})`;
const fdot = k => `<i class="fdot" style="background:${famColor(famOf(k))}"></i>`;
const famLegend = () => `<div class="famleg">${FAMS.map(f=>`<span><i class="fdot" style="background:${famColor(f)}"></i>${esc(t("fam_"+f))}</span>`).join("")}</div>`;
const unitOf = s => (s.u==="pg" ? "pg TEQ/kg bw/d" : "ng/kg bw/d").replace("bw", S.lang==="en"?"bw":"pc").replace("/d", S.lang==="en"?"/day":(S.lang==="es"?"/día":"/j"));

/* ---------------------------------------------------------------- core computation */
// TDS2 occurrence: % of analysed samples with a quantified value (any component for sums)
function occurrence(k){ let n=0, q=0; FOODS.forEach(f=>{ const c=f.c[k]; if(c){ n+=c[3]; q+=c[4]; } }); return n ? q/n*100 : null; }
function compute(meals, bw){
  const SU = subs();
  const intake = {};           // food id -> grams
  MEALS.forEach(m => (meals[m]||[]).forEach(it => { if(it.g>0) intake[it.id] = (intake[it.id]||0) + it.g; }));
  const foods = Object.keys(intake).map(Number);
  const res = {intake, foods, grams: foods.reduce((a,id)=>a+intake[id],0), S:{}};
  SU.forEach(s => {
    const E = {lb:0, mb:0, ub:0}, contrib = {}, missing = [];
    foods.forEach(id => {
      const c = byId[id].c[s.k];
      if(!c){ missing.push(id); return; }
      const g = intake[id];
      E.lb += g*c[0]/bw; E.mb += g*c[1]/bw; E.ub += g*c[2]/bw;
      contrib[id] = {lb:g*c[0]/bw, mb:g*c[1]/bw, ub:g*c[2]/bw};
    });
    const rq = b => s.type==="NONE" ? 0 : (s.type==="HBGV" ? E[b]/s.rp : E[b]*s.thr/s.rp);
    const RQ = {lb:rq("lb"), mb:rq("mb"), ub:rq("ub")};
    const status = s.type==="NONE" ? "na" : (RQ.ub < 1 ? "ok" : (RQ.lb >= 1 ? "hi" : "unc"));
    res.S[s.k] = {s, E, RQ, contrib, missing, status};
  });
  return res;
}
// Tier-0 hazard index: threshold substances only (genotoxic carcinogens are combined with MOET instead)
function hi(res, b, keys){ return (keys||Object.keys(res.S).filter(k=>res.S[k].s.grp!=="carc")).reduce((a,k)=>a+res.S[k].RQ[b],0); }
function moet(res, b){ const inv = Object.values(res.S).filter(r=>r.s.grp==="carc").reduce((a,r)=>a + r.E[b]/r.s.rp, 0); return inv>0 ? 1/inv : Infinity; }
function moetStatus(res){ const thr = 10000; return moet(res,"ub")>=thr ? "ok" : (moet(res,"lb")<thr ? "hi" : "unc"); }
function hiStatus(res, keys){ return hi(res,"ub",keys)<1 ? "ok" : (hi(res,"lb",keys)>=1 ? "hi" : "unc"); }
function cw(el, fallback){ const w = el.clientWidth; return w>200 ? Math.round(w) : fallback; }

/* ---------------------------------------------------------------- formatting */
function fmt(x, d){
  if(!isFinite(x)) return "∞";
  if(x===0) return "0";
  const loc = S.lang==="en" ? "en-GB" : (S.lang==="fr"?"fr-FR":"es-ES");
  const a = Math.abs(x);
  let opts;
  if(d!==undefined) opts={maximumFractionDigits:d, minimumFractionDigits:0};
  else if(a>=1000) opts={maximumFractionDigits:0};
  else if(a>=10) opts={maximumFractionDigits:1};
  else if(a>=0.01) opts={maximumSignificantDigits:3};
  else opts={maximumSignificantDigits:2};
  return x.toLocaleString(loc, opts);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function statusHTML(st){ const ic={ok:"✓",unc:"?",hi:"!",na:"–"}[st]; return `<span class="status st-${st}"><span class="dot">${ic}</span>${t("st_"+st)}</span>`; }
function metricText(r){
  const s=r.s, b=S.bound;
  if(s.type==="NONE") return "–";
  if(s.type==="HBGV") return fmt(r.RQ[b]*100) + " %";
  const moe = s.rp / r.E[b];
  return "MOE " + (isFinite(moe) ? fmt(moe) : "–");
}
function refText(s){
  if(s.type==="NONE") return `<span class="muted">${esc(t("no_ref"))}</span>`;
  if(s.type==="HBGV") return `${fmt(s.rp)} ${unitOf(s)}`;
  return `BMDL ${fmt(s.rp)} ${unitOf(s)} · MOE ≥ ${fmt(s.thr)}`;
}

/* ---------------------------------------------------------------- tooltip */

/* ---------------------------------------------------------------- charts (hand-made SVG, no dependencies) */
const LOGMIN = -3, LOGMAX = 3;   // RQ axis 0.001 … 100
function lx(v, x0, w){ const l = Math.log10(Math.max(v, Math.pow(10,LOGMIN))); return x0 + (Math.min(l,LOGMAX)-LOGMIN)/(LOGMAX-LOGMIN)*w; }
function logAxis(x0, w, y0, y1, compact){
  let g = "";
  for(let p=LOGMIN; p<=LOGMAX; p++){
    const x = lx(Math.pow(10,p), x0, w);
    g += `<line class="gl" x1="${x}" x2="${x}" y1="${y0}" y2="${y1}"/>`;
    const lab = p<0 ? (compact? "10"+superscript(p) : fmt(Math.pow(10,p))) : fmt(Math.pow(10,p));
    g += `<text x="${x}" y="${y1+14}" text-anchor="middle">${lab}</text>`;
  }
  const xt = lx(1, x0, w);
  g += `<line class="thr" x1="${xt}" x2="${xt}" y1="${y0-4}" y2="${y1}"/>`;
  return g;
}
function superscript(n){ const m={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"}; return String(n).split("").map(c=>m[c]).join(""); }
const STC = {ok:"var(--good)", unc:"var(--warning)", hi:"var(--critical)"};

function expoNg(r, b){ return r.E[b] * (r.s.u==="pg" ? 0.001 : 1); }   // dioxin TEQ pg -> ng for a common axis
function sortedSubs(res, mode){
  const SU = subs(), b = S.bound;
  if(mode==="expo") return SU.slice().sort((x,y)=>expoNg(res.S[y.k],b)-expoNg(res.S[x.k],b));
  if(mode==="rq")   return SU.slice().sort((x,y)=>res.S[y.k].RQ[b]-res.S[x.k].RQ[b]);
  return SU;
}
function lpos(v, lo, hi, x0, w){ const l = Math.log10(Math.max(v, Math.pow(10,lo))); return x0 + (Math.min(l,hi)-lo)/(hi-lo)*w; }
function decAxis(lo, hi, x0, w, y0, y1, compact){
  const step = (compact || (hi-lo) > 6) ? 2 : 1; let g = "";
  for(let p=Math.ceil(lo/step)*step; p<=hi; p+=step){
    const x = lpos(Math.pow(10,p), lo, hi, x0, w);
    const lab = p===0 ? "1" : ((compact || p<-2 || p>3) ? "10"+superscript(p) : fmt(Math.pow(10,p)));
    g += `<line class="gl" x1="${x}" x2="${x}" y1="${y0}" y2="${y1}"/><text x="${x}" y="${y1+14}" text-anchor="middle">${lab}</text>`;
  }
  return g;
}
function whisker(x1, x2, cy, dashed){
  if(x2-x1 <= 1) return "";
  const st = `stroke="var(--text-primary)" stroke-width="1.2" pointer-events="none"`;
  return `<line x1="${x1}" x2="${x2}" y1="${cy}" y2="${cy}" ${st} ${dashed?'stroke-dasharray="3 2"':""}/>` + (dashed ? "" : `<line x1="${x1}" x2="${x1}" y1="${cy-4}" y2="${cy+4}" ${st}/>`) + `<line x1="${x2}" x2="${x2}" y1="${cy-4}" y2="${cy+4}" ${st}/>`;
}
/* Two aligned panels sharing the substance labels: left = how much (exposure, coloured by chemical family),
   right = how risky (RQ, coloured by status). When sorted by family, rows are grouped with a family header. */
function dualChart(el, res, opts={}){
  const b = S.bound, sort = opts.sort||"fam", SU = sortedSubs(res, sort), compact = !!opts.compact;
  const W = cw(el, opts.w || 760), lab = opts.labW || 190, gap = compact ? 18 : 48, padR = 12;
  const rowH = opts.rowH || 26, headH = sort==="fam" ? (compact ? 6 : 22) : 0, top = compact ? 22 : 40;
  // layout rows (with family headers / gaps)
  const rows = []; let y = top, prevFam = null;
  SU.forEach(s => { if(sort==="fam" && s.fam!==prevFam){ rows.push({head:s.fam, y}); y += headH; prevFam = s.fam; } rows.push({s, y}); y += rowH; });
  const yEnd = y, H = yEnd + 22;
  const colW = (W - lab - gap - padR) / 2, xa = lab, xb = lab + colW + gap;
  const vals = SU.flatMap(s => ["lb","ub",b].map(k => expoNg(res.S[s.k], k))).filter(v => v > 0);
  let lo = vals.length ? Math.floor(Math.log10(Math.min(...vals))) : -3, hi = vals.length ? Math.ceil(Math.log10(Math.max(...vals))) : 3;
  lo = Math.max(lo, -7); if(hi - lo < 4) lo = hi - 4;
  const rlo = LOGMIN, rhi = LOGMAX;
  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("dual_expo")+" / "+t("dual_rq"))}">`;
  g += `<text class="lbl" x="${xa}" y="14" style="font-weight:600">${esc(t(compact?"dual_expo_s":"dual_expo"))}</text>`;
  g += `<text class="lbl" x="${xb}" y="14" style="font-weight:600">${esc(t(compact?"dual_rq_s":"dual_rq"))}</text>`;
  if(!compact) g += `<text x="${xa}" y="29">${esc(t("dual_expo_sub"))}</text><text x="${xb}" y="29">${esc(t("dual_rq_sub"))}</text>`;
  g += decAxis(lo, hi, xa, colW, top, yEnd, compact) + decAxis(rlo, rhi, xb, colW, top, yEnd, compact);
  const x1 = lpos(1, rlo, rhi, xb, colW);
  g += `<line class="thr" x1="${x1}" x2="${x1}" y1="${top-4}" y2="${yEnd}"/>`;
  rows.forEach(row => {
    if(row.head){
      if(!compact) g += `<rect x="0" y="${row.y+6}" width="10" height="10" rx="3" fill="${famColor(row.head)}"/><text x="16" y="${row.y+15}" style="font-size:11px;font-weight:600;letter-spacing:.02em">${esc(t("fam_"+row.head))}</text>`;
      return;
    }
    const s = row.s, r = res.S[s.k], cy = row.y + rowH/2, bh = Math.min(12, rowH - 9);
    const e = expoNg(r, b), q = r.RQ[b], fc = famColor(s.fam), lbZero = r.RQ.lb === 0 && r.RQ.ub > 0;
    const tipTxt = `<b>${esc(sname(s.k))}</b> · ${esc(t("fam_"+s.fam))}<br>${t("tip_expo")} (${b.toUpperCase()}): ${fmt(r.E[b])} ${unitOf(s)}<br>LB–UB: ${fmt(r.E.lb)} – ${fmt(r.E.ub)}<br>${t("tip_rq")}: ${fmt(q)} · ${metricText(r)}<br>${t("st_"+r.status)}${lbZero?"<br><i>"+esc(t("lb_zero"))+"</i>":""}`;
    g += `<rect class="hit" x="0" y="${row.y}" width="${W}" height="${rowH}" data-tip="${esc(tipTxt)}"/>`;
    g += `<text class="lbl" x="${lab-22}" y="${cy+4}" text-anchor="end" pointer-events="none">${esc(compact ? trunc(shname(s.k),26) : shname(s.k))}</text>`;
    g += `<rect x="${lab-16}" y="${cy-5}" width="10" height="10" rx="3" fill="${fc}" pointer-events="none"/>`;
    // exposure panel (family colour)
    if(res.foods.length && r.missing.length === res.foods.length){
      g += `<text x="${xa+4}" y="${cy+4}" style="font-style:italic">${esc(t(compact?"not_in_diet_s":"not_in_diet"))}</text>`;
      if(s.type!=="NONE") g += `<text x="${xb+4}" y="${cy+4}" style="font-style:italic">–</text>`;
      return;
    }
    const xa0 = lpos(Math.pow(10,lo), lo, hi, xa, colW), xe = lpos(e, lo, hi, xa, colW);
    if(e > 0) g += `<rect x="${xa0}" y="${cy-bh/2}" width="${Math.max(2, xe-xa0)}" height="${bh}" rx="3" fill="${fc}" pointer-events="none"/>`;
    const eub = lpos(expoNg(r,"ub")||Math.pow(10,lo), lo, hi, xa, colW);
    g += whisker(lpos(expoNg(r,"lb")||Math.pow(10,lo), lo, hi, xa, colW), eub, cy, lbZero);
    if(lbZero && e === 0) g += `<circle cx="${eub}" cy="${cy}" r="4" fill="${fc}" stroke="var(--surface-1)" stroke-width="1.5" pointer-events="none"/>`;
    // risk panel (status colour)
    if(s.type==="NONE"){ g += `<text x="${xb+4}" y="${cy+4}" style="font-style:italic">${esc(t("no_ref"))}</text>`; return; }
    const xb0 = lpos(Math.pow(10,rlo), rlo, rhi, xb, colW), xq = lpos(q, rlo, rhi, xb, colW);
    if(q > 0) g += `<rect x="${xb0}" y="${cy-bh/2}" width="${Math.max(2, xq-xb0)}" height="${bh}" rx="3" fill="${STC[r.status]}" pointer-events="none"/>`;
    const rub = lpos(r.RQ.ub||Math.pow(10,rlo), rlo, rhi, xb, colW);
    g += whisker(lpos(r.RQ.lb||Math.pow(10,rlo), rlo, rhi, xb, colW), rub, cy, lbZero);
    if(lbZero && q === 0) g += `<circle cx="${rub}" cy="${cy}" r="4.5" fill="${STC[r.status]}" stroke="var(--surface-1)" stroke-width="1.5" pointer-events="none"/>`;
  });
  el.innerHTML = g + `</svg>`;
}
function bpaWarn(res, short){
  const s = subs().find(x=>x.k==="BPA"), E = res.S.BPA.E[S.bound];
  const EFSA = 0.2, BFR = 200, rqE = E/EFSA, rqB = E/BFR;
  const isEfsa = Math.abs(s.rp-EFSA) < 1e-9;
  if(short) return t(isEfsa ? "bpa_short_efsa" : "bpa_short");
  let h = t(isEfsa ? "bpa_warn_efsa" : "bpa_warn").replace("{rp}", fmt(s.rp));
  if(res.foods.length) h += " " + t("bpa_rq").replace("{rb}", fmt(rqB)).replace("{re}", fmt(rqE));
  return h;
}
function rankNote(res){
  const b = S.bound, SU = subs();
  const topE = SU.slice().sort((x,y)=>expoNg(res.S[y.k],b)-expoNg(res.S[x.k],b))[0];
  const topR = SU.slice().sort((x,y)=>res.S[y.k].RQ[b]-res.S[x.k].RQ[b])[0];
  if(!res.foods.length) return "";
  let h = t("rank_note").replace("{a}", esc(sname(topE.k))).replace("{ea}", fmt(res.S[topE.k].E[b])+" "+unitOf(topE)).replace("{b}", esc(sname(topR.k))).replace("{rb}", fmt(res.S[topR.k].RQ[b]));
  if(topE.k !== topR.k) h += " " + t("rank_diff");
  return h;
}
function barList(el, rows, opts={}){
  // rows: [{label, v (0..1 share or value), txt, tip}]
  const W = cw(el, opts.w || 520), lab = opts.labW || 200, rowH = 24, padR = 56, x0 = lab, w = W-lab-padR;
  const max = opts.max || Math.max(...rows.map(r=>r.v), 1e-12);
  const H = rows.length*rowH + 6;
  let g = `<svg viewBox="0 0 ${W} ${H}">`;
  rows.forEach((r,i)=>{
    const y = i*rowH, cy = y+rowH/2, bw = Math.max(2, r.v/max*w);

    g += `<text class="lbl" x="${lab-10}" y="${cy+4}" text-anchor="end" pointer-events="none">${esc(trunc(r.label, opts.trunc||30))}</text>`;
    g += `<rect x="${x0}" y="${cy-6}" width="${bw}" height="12" rx="3" fill="${r.color||"var(--series-1)"}" pointer-events="none"/>`;
    g += `<text x="${x0+bw+6}" y="${cy+4}" pointer-events="none">${esc(r.txt)}</text>`;

function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function searchFoods(q){
  const nq = norm(q.trim());
  let list = FOODS.filter(f => S.all || f.core);
  if(nq) list = FOODS.filter(f => (S.all||f.core||nq.length>=3) && [f.es,f.en,f.fr].some(n=>norm(n).includes(nq)));
  const out = {};
  CATS.forEach(c=>out[c]=[]);
  list.forEach(f=>out[f.cat].push(f));
  CATS.forEach(c=>out[c].sort((a,b)=>fname(a).localeCompare(fname(b))));
  return out;
}
function openDD(input){
  const dd = input.nextElementSibling;
  const groups = searchFoods(input.value);
  let h = "";
  CATS.forEach(c => { if(!groups[c].length) return;
    h += `<div class="grp">${esc(t("cat_"+c))}</div>` + groups[c].map(f=>`<div class="opt" data-id="${f.id}"><span>${esc(fname(f))}${S.lang!=="fr"?` <small>· ${esc(f.fr)}</small>`:""}</span><small>${f.g} g${f.c.Cd?"":" · ⚠"}</small></div>`).join("");
  });
  dd.innerHTML = h || `<div class="empty" style="padding:8px 10px">—</div>`;

function closeDD(){ document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open")); }

function bindEditor(box){

      s += `<line x1="${X(0)}" x2="${xr}" y1="${y}" y2="${y}" stroke="${famColor(su.fam)}" stroke-width="3" stroke-linecap="round" opacity=".45"/>`;

      if(lr > L1) s += `<path d="M${x1+4} ${y-5} L${x1+11} ${y} L${x1+4} ${y+5} Z" fill="${famColor(su.fam)}"/>`;
      if(lr < L0) s += `<path d="M${x0-4} ${y-5} L${x0-11} ${y} L${x0-4} ${y+5} Z" fill="${famColor(su.fam)}"/>`;

  });

  document.getElementById("popHint").innerHTML = (!useMean() && allDays().length < 2) ? t("pop_hint") : "";

function renderRisk(res){
  const b = S.bound, SU = subs();
  const H = hi(res,b);
  const e1 = document.getElementById("hiAll"); e1.innerHTML = `${fmt(H,2)} <span class="small" style="font-weight:500">${statusHTML(hiStatus(res))}</span>`;
  const carc = SU.filter(s=>s.grp==="carc");
  const MT = moet(res, b), stC = moetStatus(res);
  document.getElementById("moetCarc").innerHTML = `${isFinite(MT)?fmt(MT):"–"} <span class="small" style="font-weight:500">${statusHTML(stC)}</span>`;
  // drivers (threshold substances)
  let drv = SU.filter(s=>s.grp!=="carc" && s.type!=="NONE").map(s=>({k:s.k, v:res.S[s.k].RQ[b]})).sort((a,c)=>c.v-a.v);
  const TOPN = 12, rest = drv.slice(TOPN), restV = rest.reduce((a,d)=>a+d.v,0);
  drv = drv.slice(0, TOPN);
  const drvRows = drv.map(d=>({label:shname(d.k), color:famColor(famOf(d.k)), v:d.v/H, txt:fmt(d.v/H*100,1)+" %", tip:`<b>${esc(sname(d.k))}</b><br>RQ ${fmt(d.v)} / HI ${fmt(H,2)}`}));
  if(rest.length) drvRows.push({label:t("drv_rest").replace("{n}", rest.length), color:"var(--text-muted)", v:restV/H, txt:fmt(restV/H*100,1)+" %", tip:rest.map(d=>`${esc(shname(d.k))}: ${fmt(d.v/H*100,1)} %`).join("<br>")});
  if(H>0) barList(document.getElementById("driversChart"), drvRows, {w:520, labW:180});
  else document.getElementById("driversChart").innerHTML = `<p class="empty">${esc(t("no_items"))}</p>`;
  // groups (threshold substances); shared linear scale so rows are comparable
  const TG = GROUPS.filter(g=>g!=="carc");
  const maxG = Math.max(1.2, ...TG.map(g=>SU.filter(s=>s.grp===g).reduce((a,s)=>a+res.S[s.k].RQ[b],0)));
  const scaleMax = maxG<=1.2 ? 1.5 : Math.pow(10, Math.ceil(Math.log10(maxG)*4)/4);
  const box = document.getElementById("mixRows");
  const W = Math.max(260, (box.clientWidth||900) - 210 - 150 - 24), Hh=46, w=W-30;
  const short = k => (SUBTXT[k].sh ? SUBTXT[k].sh[S.lang] : sname(k));
  let h = "";
  TG.forEach(g => {
    const ss = SU.filter(s=>s.grp===g); if(!ss.length) return;
    const tot = ss.reduce((a,s)=>a+res.S[s.k].RQ[b],0);
    const st = hiStatus(res, ss.map(s=>s.k));
    let x=0, segs="";
    ss.slice().sort((a,c)=>res.S[c.k].RQ[b]-res.S[a.k].RQ[b]).forEach((s,i)=>{
      const v = res.S[s.k].RQ[b], ww = v/scaleMax*w;
      if(ww<=0) return;
      segs += `<rect x="${x}" y="6" width="${Math.max(1.5,ww-2)}" height="16" rx="3" fill="${famColor(s.fam)}" data-tip="<b>${esc(sname(s.k))}</b><br>RQ ${fmt(v)} (${fmt(tot>0?v/tot*100:0,0)} %)"/>`;
      x += ww;
    });
    const xt = 1/scaleMax*w;
    const axis = `<line class="thr" x1="${xt}" x2="${xt}" y1="2" y2="26"/><text x="${xt}" y="40" text-anchor="middle">1</text><text x="0" y="40">0</text><text x="${w}" y="40" text-anchor="end">${fmt(scaleMax)}</text>`;
    h += `<div class="mix-row"><div class="gname"><b>${esc(t("g_"+g))}</b><small>${esc(t("g_"+g+"_d"))} · ${ss.map(s=>fdot(s.k)+esc(shname(s.k))).join(" &nbsp;")}</small></div>
      <div class="chart"><svg viewBox="0 0 ${W} ${Hh}"><line class="gl" x1="0" x2="${w}" y1="14" y2="14"/>${segs}${axis}</svg></div>
      <div><div style="font-size:20px;font-weight:650;font-variant-numeric:tabular-nums">HI ${fmt(tot,2)}</div>${statusHTML(st)}</div></div>`;
  });
  // genotoxic carcinogens: MOE approach, no HI
  h += `<div class="mix-row"><div class="gname"><b>${esc(t("g_carc"))}</b><small>${esc(t("g_carc_d"))} · ${carc.map(s=>fdot(s.k)+esc(shname(s.k))).join(" &nbsp;")}</small></div>
    <div class="small sec">${t("carc_row")}:<br>${carc.map(s=>{ const m = s.rp/res.S[s.k].E[b]; return `<b>${esc(sname(s.k))}</b> MOE ${isFinite(m)?fmt(m):"–"} ${statusHTML(res.S[s.k].status)}`; }).join(" &nbsp;·&nbsp; ")}</div>
    <div><div style="font-size:20px;font-weight:650;font-variant-numeric:tabular-nums">MOE<sub>T</sub> ${isFinite(MT)?fmt(MT):"–"}</div>${statusHTML(stC)}</div></div>`;
  document.getElementById("mixRows").innerHTML = h;
  document.getElementById("bpaWarnRisk").innerHTML = bpaWarn(res);
}

      <td class="small">${esc(SUBTXT[s.k].ep[S.lang])}</td><td class="num small">${oc===null?"–":fmt(oc,0)+" %"}${s.fam==="metal"?"*":""}${(()=>{ const bg = bestGroup(s.k); return bg && s.fam!=="metal" ? `<div class="muted" style="white-space:nowrap">${esc(incaName(bg.g))} ${fmt(bg.p,0)} %</div>` : ""; })()}</td><td class="small">${t("conf_"+s.conf)}</td></tr>`;

  // coverage
  const n = FOODS.length;
  document.getElementById("covMatrix").innerHTML = `<table class="t" style="max-width:520px"><tbody>${SU.map(s=>{ const c = FOODS.filter(f=>f.c[s.k]).length; return `<tr><td>${esc(sname(s.k))}</td><td class="num">${c} / ${n}</td><td style="width:220px"><div style="height:10px;border-radius:3px;background:var(--surface-2)"><div style="height:10px;border-radius:3px;width:${c/n*100}%;background:var(--series-1)"></div></div></td></tr>`; }).join("")}</tbody></table>`;
}
/* ---------------------------------------------------------------- 7 occurrence heatmap (TDS2 % of samples quantified) */
// INCA2 food groups in a food-category order; short labels for the column headers
const INCA_TX = {
 "Pain et panification sèche":{en:"Bread & rusks",es:"Pan y biscotes",fr:"Pain et panification sèche"},
 "Céréales pour petit déjeuner":{en:"Breakfast cereals",es:"Cereales de desayuno",fr:"Céréales petit déjeuner"},
 "Pâtes":{en:"Pasta",es:"Pasta",fr:"Pâtes"},
 "Riz et blé dur ou concassé":{en:"Rice & durum wheat",es:"Arroz y trigo duro",fr:"Riz et blé dur"},
 "Viennoiserie":{en:"Croissants & buns",es:"Bollería",fr:"Viennoiserie"},
 "Biscuits sucrés ou salés et barres":{en:"Biscuits & bars",es:"Galletas y barritas",fr:"Biscuits et barres"},
 "Pâtisseries et gâteaux":{en:"Pastries & cakes",es:"Pasteles y tartas",fr:"Pâtisseries et gâteaux"},
 "Lait":{en:"Milk",es:"Leche",fr:"Lait"},
 "Ultra-frais laitier":{en:"Yoghurts & fresh dairy",es:"Yogures y lácteos frescos",fr:"Ultra-frais laitier"},
 "Fromages":{en:"Cheese",es:"Quesos",fr:"Fromages"},
 "Entremets, crèmes desserts et laits gélifiés":{en:"Dairy desserts",es:"Postres lácteos",fr:"Entremets, crèmes desserts"},
 "Glaces et desserts glacés":{en:"Ice cream",es:"Helados",fr:"Glaces"},
 "Beurre":{en:"Butter",es:"Mantequilla",fr:"Beurre"},
 "Huile":{en:"Oil",es:"Aceite",fr:"Huile"},
 "Margarine":{en:"Margarine",es:"Margarina",fr:"Margarine"},
 "Viande":{en:"Meat",es:"Carne",fr:"Viande"},
 "Volaille et gibier":{en:"Poultry & game",es:"Aves y caza",fr:"Volaille et gibier"},
 "Charcuterie":{en:"Cured & processed meat",es:"Embutidos y fiambres",fr:"Charcuterie"},
 "Abats":{en:"Offal",es:"Vísceras",fr:"Abats"},
 "Oeufs et dérivés":{en:"Eggs",es:"Huevos",fr:"Œufs et dérivés"},
 "Poissons":{en:"Fish",es:"Pescados",fr:"Poissons"},
 "Crustacés et mollusques":{en:"Shellfish",es:"Mariscos",fr:"Crustacés et mollusques"},
 "Légumes (hors pomme de terre)":{en:"Vegetables (not potatoes)",es:"Verduras (sin patata)",fr:"Légumes (hors pomme de terre)"},
 "Pommes de terre et apparentés":{en:"Potatoes & similar",es:"Patatas y similares",fr:"Pommes de terre"},
 "Légumes secs":{en:"Pulses",es:"Legumbres",fr:"Légumes secs"},
 "Fruits":{en:"Fruit",es:"Frutas",fr:"Fruits"},
 "Fruits secs et graines oléagineuses":{en:"Nuts & seeds",es:"Frutos secos y semillas",fr:"Fruits secs et graines"},
 "Compotes et fruits cuits":{en:"Stewed fruit",es:"Compotas",fr:"Compotes et fruits cuits"},
 "Plats composés":{en:"Mixed dishes",es:"Platos preparados",fr:"Plats composés"},
 "Pizzas, quiches et pâtisseries salées":{en:"Pizzas & savoury pies",es:"Pizzas y tartas saladas",fr:"Pizzas, quiches"},
 "Sandwiches, casse-croûte":{en:"Sandwiches & snacks",es:"Bocadillos",fr:"Sandwiches, casse-croûte"},
 "Soupes et bouillons":{en:"Soups",es:"Sopas y caldos",fr:"Soupes et bouillons"},
 "Condiments et sauces":{en:"Condiments & sauces",es:"Condimentos y salsas",fr:"Condiments et sauces"},
 "Sucres et dérivés":{en:"Sugar & confectionery",es:"Azúcar y dulces",fr:"Sucres et dérivés"},
 "Chocolat":{en:"Chocolate",es:"Chocolate",fr:"Chocolat"},
 "Eaux":{en:"Water",es:"Agua",fr:"Eaux"},
 "Boissons fraîches sans alcool":{en:"Soft drinks & juices",es:"Refrescos y zumos",fr:"Boissons sans alcool"},
 "Boissons alcoolisées":{en:"Alcoholic drinks",es:"Bebidas alcohólicas",fr:"Boissons alcoolisées"},
 "Café":{en:"Coffee",es:"Café",fr:"Café"},
 "Autres boissons chaudes":{en:"Tea & other hot drinks",es:"Té y otras bebidas calientes",fr:"Autres boissons chaudes"},
 "Aliments destinés à une alimentaire particulière":{en:"Special-purpose foods",es:"Alimentos para usos especiales",fr:"Alimentation particulière"},
};
const INCA_ORDER = Object.keys(INCA_TX);
const incaName = g => (INCA_TX[g] && INCA_TX[g][S.lang]) || g || "–";
const OCC_MIN_N = OCC.minN;
const OCC_BINS = [["--seq-0","0 %"],["--seq-1","< 10"],["--seq-3","10–25"],["--seq-4","25–50"],["--seq-5","50–75"],["--seq-7","≥ 75 %"]];
const occBin = p => p<=0 ? 0 : p<10 ? 1 : p<25 ? 2 : p<50 ? 3 : p<75 ? 4 : 5;
const darkMode = () => { try{ return matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){ return false; } };
// ink that stays readable on each bin, in light and dark mode
const occInk = b => darkMode() ? (b>=5 ? "#121212" : "var(--text-primary)") : (b>=3 ? "#fff" : "var(--text-primary)");
let OCCV = {view:"grp", vals:false, grp:"all"};
// per-chemical (calculator unit) counts by food group, from the per-food data (any component quantified for sums)
function unitByGroup(k){
  const g = {}; let n=0, q=0;
  FOODS.forEach(f => { const c = f.c[k]; if(!c) return; const gg = f.inca||"Eaux"; (g[gg] = g[gg]||[0,0]); g[gg][0]+=c[4]; g[gg][1]+=c[3]; n+=c[3]; q+=c[4]; });
  return {g, n, q};
}
// criterion met by an analyte (or the best of a unit's analytes): overall >= 10 %, else best group with >= MIN_N samples
function critOf(rows){
  let best = null, all = false;
  rows.forEach(r => {
    if(r.n && r.q/r.n*100 >= 10) all = true;
    Object.entries(r.g).forEach(([gi,[q,m]]) => { if(m>=OCC_MIN_N){ const p=q/m*100; if(!best || p>best.p) best = {p, g:OCC.groups[gi]}; } });
  });
  return {all, best};
}
function critHTML(c){
  if(c.all) return `<span class="crit all">${esc(t("crit_all"))}</span>`;
  if(c.best && c.best.p>=10) return `<span class="crit" title="${esc(c.best.g)}">${esc(t("crit_grp"))}: ${esc(incaName(c.best.g))} ${fmt(c.best.p,0)} %</span>`;
  return `<span class="crit">${esc(t("crit_none"))}</span>`;
}
function occCell(q, m, label, colLabel, small){
  if(!m) return `<td class="c na" data-tip="<b>${esc(label)}</b> · ${esc(colLabel)}<br>${esc(t("not_analysed"))}"></td>`;
  const p = q/m*100, b = occBin(p);
  const tip = `<b>${esc(label)}</b> · ${esc(colLabel)}<br>${esc(t("occ_tip").replace("{q}",q).replace("{n}",m))} (${fmt(p,0)} %)${small?`<br>${esc(t("occ_small_tip"))}`:""}`;
  return `<td class="c${small?" small":(b===0?" z":"")}" style="background:var(${OCC_BINS[b][0]});color:${occInk(b)}" data-tip="${esc(tip)}">${OCCV.vals?Math.round(p):""}</td>`;
}
function renderOcc(){
  const SU = subs().slice().sort((a,b)=>FAMS.indexOf(a.fam)-FAMS.indexOf(b.fam));
  const box = document.getElementById("occHeat"), sel = document.getElementById("occGrp");
  document.querySelectorAll("#occSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.o===OCCV.view));
  document.getElementById("occVals").checked = OCCV.vals;
  const present = new Set(OCC.groups); FOODS.forEach(f=>present.add(f.inca||"Eaux"));
  const cols = INCA_ORDER.filter(g=>present.has(g)).concat([...present].filter(g=>!INCA_TX[g]));
  let h = "";
  if(OCCV.view==="food"){
    sel.style.display = "";
    sel.innerHTML = `<option value="all">${esc(t("occ_all_grp"))}</option>` + cols.map(g=>`<option value="${esc(g)}" ${g===OCCV.grp?"selected":""}>${esc(incaName(g))}</option>`).join("");
    sel.value = OCCV.grp;
    h = `<table><thead><tr><th class="rl">${esc(t("occ_food"))}</th>${SU.map(s=>`<th class="g" title="${esc(sname(s.k))}">${fdot(s.k)}${esc(shname(s.k))}</th>`).join("")}</tr></thead><tbody>`;
    const groups = OCCV.grp==="all" ? cols : [OCCV.grp];
    groups.forEach(g => {
      const fs = FOODS.filter(f=>(f.inca||"Eaux")===g).sort((a,b)=>fname(a).localeCompare(fname(b)));
      if(!fs.length) return;
      if(OCCV.grp==="all") h += `<tr class="fam"><td class="rl" colspan="${SU.length+1}">${esc(incaName(g))}</td></tr>`;
      fs.forEach(f => {
        h += `<tr><td class="rl sub" title="${esc(fname(f))}">${esc(trunc(fname(f),34))}</td>` + SU.map(s=>{ const c=f.c[s.k]; return c ? occCell(c[4], c[3], fname(f), sname(s.k), false) : occCell(0,0,fname(f),sname(s.k)); }).join("") + `</tr>`;
      });
    });
    box.innerHTML = h + `</tbody></table>`;
  } else {
    sel.style.display = "none";
    h = `<table><thead><tr><th class="rl">${esc(t(OCCV.view==="an"?"occ_analyte":"th_sub"))}</th><th class="num">${esc(t("occ_overall"))}</th><th>${esc(t("occ_crit"))}</th>${cols.map(g=>`<th class="g" title="${esc(g)}">${esc(incaName(g))}</th>`).join("")}</tr></thead><tbody>`;
    const ncol = cols.length + 3;
    const row = (label, cls, gcount, n, q, crit, noSmall) => {
      let r = `<tr><td class="rl ${cls}" title="${esc(label)}">${esc(trunc(label,38))}</td><td class="ov num">${n?fmt(q/n*100,0)+" %":"–"}</td><td class="cr">${crit}</td>`;
      cols.forEach(g => { const v = gcount[g]; r += v ? occCell(v[0], v[1], label, incaName(g), !noSmall && v[1] < OCC_MIN_N) : occCell(0,0,label,incaName(g)); });
      return r + `</tr>`;
    };
    const byName = rows => { const o = {}; Object.entries(rows).forEach(([gi,v]) => o[OCC.groups[gi]] = v); return o; };
    FAMS.forEach(fam => {
      const us = SU.filter(s=>s.fam===fam);
      const extra = OCCV.view==="an" && fam==="proc" ? OCC.rows.filter(r=>!r.k) : [];
      if(!us.length && !extra.length) return;
      h += `<tr class="fam"><td class="rl" colspan="${ncol}"><i class="fdot" style="background:${famColor(fam)}"></i>${esc(t("fam_"+fam))}</td></tr>`;
      us.forEach(s => {
        const an = OCC.rows.filter(r=>r.k===s.k);
        if(OCCV.view==="grp"){
          const u = unitByGroup(s.k);
          h += row(sname(s.k), "", u.g, u.n, u.q, critHTML(critOf(an)), fam==="metal");
        } else if(an.length===1){
          h += row(sname(s.k), "", byName(an[0].g), an[0].n, an[0].q, critHTML(critOf(an)), fam==="metal");
        } else {
          h += `<tr><td class="rl" colspan="${ncol}" style="font-weight:600;padding-top:4px">${esc(sname(s.k))}</td></tr>`;
          an.forEach(r => h += row(r.a, "sub", byName(r.g), r.n, r.q, critHTML(critOf([r]))));
        }
      });
      if(extra.length){
        h += `<tr><td class="rl out" colspan="${ncol}" style="font-weight:600;padding-top:4px">${esc(t("occ_other_pah"))}</td></tr>`;
        extra.forEach(r => h += row(r.a, "sub out", byName(r.g), r.n, r.q, critHTML(critOf([r]))));
      }
    });
    box.innerHTML = h + `</tbody></table>`;
  }
  const hatch = `<span class="bin"><i style="background:repeating-linear-gradient(135deg,var(--line-strong) 0 1.5px,transparent 1.5px 5px)"></i>${esc(t("not_analysed"))}</span>`;
  const small = OCCV.view==="food" ? "" : `<span class="bin"><i style="background:var(--seq-4);box-shadow:inset 0 0 0 3px var(--surface-1)"></i>${esc(t("occ_small").replace("{n}",OCC_MIN_N))}</span>`;
  document.getElementById("occScale").innerHTML = `<span>${esc(t("occ_scale"))}</span>` + OCC_BINS.map(([v,l],i)=>`<span class="bin"><i style="background:var(${v})${i===0?";box-shadow:inset 0 0 0 1px var(--line-strong)":""}"></i>${l}</span>`).join("") + hatch + small;
  document.getElementById("occNote").innerHTML = t("occ_note_"+OCCV.view);
}
document.getElementById("occSeg").addEventListener("click", e => { const b=e.target.closest("button"); if(b){ OCCV.view=b.dataset.o; renderOcc(); } });
document.getElementById("occGrp").addEventListener("change", e => { OCCV.grp = e.target.value; renderOcc(); });
document.getElementById("occVals").addEventListener("change", e => { OCCV.vals = e.target.checked; renderOcc(); });
// best food group (>= MIN_N samples) for the Methods table
function bestGroup(k){
  const u = unitByGroup(k); let best = null;
  Object.entries(u.g).forEach(([g,[q,m]]) => { if(m>=OCC_MIN_N){ const p=q/m*100; if(!best || p>best.p) best={g,p}; } });
  return best;
}
document.getElementById("refTable").addEventListener("change", e => {
  const el = e.target; if(!el.dataset.k) return;
  const v = +el.value; if(!(v>0)) { el.value = subs().find(s=>s.k===el.dataset.k)[el.dataset.f]; return; }
  S.rp[el.dataset.k] = Object.assign(S.rp[el.dataset.k]||{}, {[el.dataset.f]: v});
  update();
});
document.getElementById("btnResetRP").addEventListener("click", () => { S.rp = {}; update(); });

/* ---------------------------------------------------------------- navigation & global controls */
function setView(v){
  S.view = v;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.v===v));
  document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on", s.id==="v-"+v));
  update(v==="days" || v==="diet");
}
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if(b){ setView(b.dataset.v); window.scrollTo({top:0}); } });
document.getElementById("langSeg").addEventListener("click", e => { const b=e.target.closest("button"); if(b){ S.lang=b.dataset.l; try{ localStorage.setItem(LS+".lang", S.lang); }catch(err){} applyI18n(); update(); } });
document.getElementById("basisSeg").addEventListener("click", e => { const b=e.target.closest("button"); if(b && !b.disabled){ S.basis=b.dataset.x; update(false); } });
function setAge(v){ S.age = (v>=1 && v<=110) ? v : null; document.getElementById("age").value = S.age||""; update(false); }
function setBw(v){ if(v>=10 && v<=250){ S.bw=v; document.getElementById("bw").value=v; update(false); } }
document.getElementById("age").addEventListener("change", e => setAge(+e.target.value));
document.getElementById("v-intro").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if(b){ setView(b.dataset.go); window.scrollTo({top:0}); } });
document.getElementById("boundSeg").addEventListener("click", e => { const b=e.target.closest("button"); if(b){ S.bound=b.dataset.b; applyI18n(); update(false); } });
document.getElementById("bw").addEventListener("input", e => setBw(+e.target.value));
document.getElementById("allFoods").addEventListener("change", e => { S.all = e.target.checked; store(); });
let clearArmed = 0;
document.getElementById("btnClear").addEventListener("click", e => {
  const btn = e.currentTarget;
  if(Date.now() - clearArmed < 4000){ clearArmed = 0; btn.textContent = t("clear"); S.meals = emptyMeals(); S.labels[0] = null; update(); return; }
  clearArmed = Date.now(); btn.textContent = t("confirm_clear");
  setTimeout(()=>{ if(clearArmed && Date.now()-clearArmed>=3900){ clearArmed=0; btn.textContent=t("clear"); } }, 4000);
});
document.getElementById("preset").addEventListener("change", e => {
  const p = PRESETS[e.target.value]; if(!p) return;
  S.meals = loadPreset(p); S.labels[0] = mkLabel(e.target.value, S.meals);
  e.target.value = ""; update();
});
document.getElementById("btnCSV").addEventListener("click", csvExport);
document.getElementById("sortSeg").addEventListener("click", e => { const x=e.target.closest("button"); if(x){ S.sort=x.dataset.s; update(false); } });
document.getElementById("btnPrint").addEventListener("click", () => { try{ window.print(); }catch(e){} });
function ioMsg(m){ const el = document.getElementById("ioMsg"); el.textContent = m; setTimeout(()=>{ if(el.textContent===m) el.textContent=""; }, 5000); }

function update(full=true){
  const res1 = compute(S.meals, S.bw);
  const res = useMean() ? compute(meanMeals(), S.bw) : res1;
  if(full) renderMeals();
  renderLive(res1);
  // diet basis switch + banner
  const N = allDays().length;
  document.getElementById("basisMeanBtn").textContent = t("basis_mean").replace("{n}", N);
  document.getElementById("basisMeanBtn").disabled = N < 2;
  document.getElementById("basisCtrl").style.display = N < 2 ? "none" : "";
  document.querySelectorAll("#basisSeg button").forEach(x=>x.setAttribute("aria-pressed", x.dataset.x===(useMean()?"mean":"day")));
  const bb = document.getElementById("basisBanner");
  const showB = ["expo","contrib","risk","compare"].includes(S.view);
  bb.style.display = showB ? "block" : "none";
  if(showB) bb.innerHTML = (useMean() ? t("basis_banner_mean").replace("{n}", N) : (N>1 ? t("basis_banner_day").replace("{n}", N) : t("basis_banner_one")))
    + (useMean() ? "" : (()=>{ const L = dayLabel(0); return L ? ` <span class="muted">· ${esc(t("diet_ex"))}: ${esc(t(L.k))}${L.edited?" ("+esc(t("diet_edited"))+")":""}</span>` : ""; })());
  if(S.view==="diet") document.getElementById("dietTitle").innerHTML = dietTitleHTML(0);
  if(S.view==="days") { if(full) renderDays(); else { renderDayChips(); renderDaysResults(); } }
  if(S.view==="expo") renderExpo(res);
  if(S.view==="contrib") renderContrib(res);
  if(S.view==="risk") renderRisk(res);
  if(S.view==="compare") renderCompare(res);
  if(S.view==="methods") renderMethods();
  if(S.view==="occ") renderOcc();
  store();
}

let rzT; addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(()=>update(false), 150); });
/* ---------------------------------------------------------------- boot */
if(!Object.values(S.meals).some(a=>a.length)){ S.meals = loadPreset(PRESETS.p_pnns); S.labels = [mkLabel("p_pnns", S.meals)]; }
if(!Array.isArray(S.labels)) S.labels = [];
// language: ?lang=xx or #xx in the link > user's saved choice > English
(function(){
  const ok = l => ["es","fr","en"].includes(l) ? l : null;
  const fromUrl = ok((new URLSearchParams(location.search).get("lang")||"").toLowerCase()) || ok(location.hash.replace("#","").toLowerCase());
  let saved = null; try{ saved = ok(localStorage.getItem(LS+".lang")); }catch(e){}   // only set by an explicit click
  S.lang = fromUrl || saved || "en";
})();
document.getElementById("bw").value = S.bw;
document.getElementById("age").value = S.age||"";
document.getElementById("allFoods").checked = !!S.all;
applyI18n();
setView("intro");
update();
</script>
